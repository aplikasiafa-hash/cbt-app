      }
      const ganti = g => { const m = /^docx:(\d+)$/.exec(g || ''); return m ? (this.impor.url[m[1]] || '') : g; };
      soal.forEach(s => { s.gambar = (s.gambar || []).map(ganti).filter(Boolean); (s.opsi || []).forEach(o => { o.gambar = ganti(o.gambar); }); });
      const n = soal.length;
      this.bank.soal.push(...soal); this.sel = this.bank.soal.length - n;
      this.impor = imporKosong();
      toast(n + ' soal' + (daftar.length ? ' dan ' + daftar.length + ' gambar' : '') + ' ditambahkan. Jangan lupa simpan.', 'ok', 6000);
    },
    async eksporWord() {
      if (this.mengekspor) return;
      this.mengekspor = true;
      try { await unduhWord(this.bank); } catch (e) { toast('Gagal membuat file Word: ' + e.message, 'err', 7000); } finally { this.mengekspor = false; }
    },
    async unduhContoh() {
      if (this.mengekspor) return;
      this.mengekspor = true;
      try { await unduhWord(null); } catch (e) { toast('Gagal membuat file Word: ' + e.message, 'err', 7000); } finally { this.mengekspor = false; }
    },
    async bukaKunci() {
      const kotor = this.kotor;
      try {
        await api('kunciBank', { ids: [this.bank.id], kunci: false });
        Object.assign(this.bank, { terkunci: false, dikunciOleh: '', dikunciPada: 0 });
        if (!kotor) nextTick(() => { this.kotor = false; S.editorKotor = false; });
        toast('Kunci dibuka. Bank soal bisa diubah lagi.');
      } catch (e) { toast(e.message, 'err'); }
    },
    async simpan() {
      if (this.menyimpan || !this.bank) return;
      if (this.terkunci) return toast('Bank soal ini sedang dikunci, jadi tidak bisa disimpan.', 'err');
      if (!this.bank.judul.trim()) return toast('Judul bank soal wajib diisi', 'err');
      const kurang = this.bank.soal.map((s, i) => masalahSoal(s).length ? i + 1 : 0).filter(Boolean);
      if (kurang.length && !await tanya('Ada soal yang belum lengkap', `Soal nomor ${kurang.slice(0, 15).join(', ')}${kurang.length > 15 ? '…' : ''} belum lengkap (misalnya kunci belum dipilih). Tetap simpan?`, { ok: 'Tetap simpan' })) return;
      this.menyimpan = true;
      try {
        const kirim = JSON.parse(JSON.stringify(this.bank));
        kirim.soal.forEach(s => { if (s.pasangan) s.pasangan.forEach(p => { if (p.pengecoh) p.kiri = ''; delete p.pengecoh; }); });
        const r = await api('saveBank', { bank: kirim });
        this.dipakai = r.dipakai || [];
        this.tersimpan = Date.now();
        nextTick(() => { this.kotor = false; S.editorKotor = false; });
        localStorage.removeItem('cbt_draf_' + this.bank.id);
        toast('Bank soal tersimpan');
      } catch (e) {
        toast(e.message + (e.code === 'KUNCI' ? ' Perubahan Anda tetap tersimpan sebagai draf di perangkat ini.' : ''), 'err', 9000);
        if (e.code === 'KUNCI') try { const b = await api('getBank', { id: this.bank.id }); Object.assign(this.bank, { terkunci: !!b.terkunci, dikunciOleh: b.dikunciOleh || '', dikunciPada: b.dikunciPada || 0 }); } catch (e2) {}
      } finally { this.menyimpan = false; }
    }
  }
});

app.component('v-jadwal', {

    pengawasBentrok() {

    // nama ujian mengikuti judul bank soal (dari guru); admin tetap bisa mengubahnya

const LABEL_STATUS = { belum: 'Belum mulai', mengerjakan: 'Mengerjakan', pending: 'Pending', selesai: 'Selesai' };
// Monitor HEMAT: cukup status tiap siswa (belum mulai / mengerjakan / pending / selesai). Tidak menarik progres jawaban.
// Memakai koneksi aplikasi yang sudah terbuka; perubahan status dikirim server lewat koneksi itu (tanpa request baru).
// Tidak ada penyegaran berkala & tidak menyambung ulang otomatis: bila koneksi putus, tekan "Perbarui" (1 request).
app.component('v-monitor', {
  template: '#t-monitor',
  data: () => ({ d: null, q: '', fKelas: '', fStatus: '', diperbarui: 0, langsung: false, terputus: false, sepi: false, LABEL_STATUS }),
  computed: {
    teksStatus() {
      if (this.langsung) return '● Status diperbarui otomatis';
      if (this.sepi) return this.ditutup ? 'Ujian sudah ditutup' : 'Tidak ada siswa yang sedang mengerjakan · diperiksa tiap menit';
      return this.terputus ? 'Koneksi terputus' : 'Menyambung…';
    },
    ditutup() { return !!(this.d && sekarang() > this.d.ujian.selesai + 120000 && !this.d.peserta.some(p => p.status === 'mengerjakan' || p.status === 'pending')); },
    hit() { const h = { belum: 0, mengerjakan: 0, pending: 0, selesai: 0 }; this.d.peserta.forEach(p => { const k = p.status === 'direset' ? 'belum' : p.status; h[k] = (h[k] || 0) + 1; }); return h; },
    tampil() {
      const q = this.q.toLowerCase(), u = { pending: 0, mengerjakan: 1, belum: 2, direset: 2, selesai: 3 };
      const cocok = p => !this.fStatus || p.status === this.fStatus || (this.fStatus === 'belum' && p.status === 'direset');
      return this.d.peserta.filter(p => (!q || p.nama.toLowerCase().includes(q) || p.nis.includes(q)) && (!this.fKelas || p.kelas === this.fKelas) && cocok(p))
        .sort((a, b) => (u[a.status] - u[b.status]) || a.kelas.localeCompare(b.kelas) || a.nama.localeCompare(b.nama));
    }
  },
  mounted() {
    if (!S.route.id) return;
    this.mati = false;
    this.dengar = m => this.pesan(m);
    Sok.pendengar.add(this.dengar);
    this.mulai();
  },
  unmounted() { this.putus(); },
  methods: {
    async muat(diam) { try { this.d = await api('monitorUjian', { ujianId: S.route.id }, { retry: diam ? 1 : 3 }); this.diperbarui = Date.now(); } catch (e) { if (!diam) toast(e.message, 'err'); } },
    /** Koneksi langsung hanya selama ada siswa yang sedang mengerjakan. Tanpa itu: cek berkala tiap menit
     *  (mesin ujian tidak tertahan menyala hanya karena halaman Monitoring terbuka). */
    adaAktif() { const t = sekarang(); return !!(this.d && this.d.peserta.some(p => p.status === 'mengerjakan' && !(p.deadline && p.deadline + 120000 < t))); },
    async mulai() {
      await this.muat();
      if (this.mati) return;
      if (this.adaAktif()) this.sambung(); else this.modeSepi();
    },
    modeSepi() {
      this.sepi = true; this.langsung = false; this.terputus = false;
      clearInterval(this.tCek);
      this.tCek = setInterval(async () => {
        if (this.mati || this.langsung || document.hidden || this.ditutup) return;
        await this.muat(true);
        if (!this.mati && this.adaAktif()) { clearInterval(this.tCek); this.sepi = false; this.sambung(); }
      }, 60000);
    },
    sambung() {

      if (S.user.role === 'admin' && (p.status === 'selesai' || aktif)) a.push({ t: 'Ulang ujian dari awal', f: () => this.jalankan('resetPeserta', p, 'Ulang ujian ' + p.nama + '?', 'Semua jawaban dan nilai siswa ini dihapus. Siswa bisa mengerjakan lagi dari awal.'), danger: true });
      return a;
    },

      try { await coba(() => api(aksi, { ujianId: S.route.id, nis: p.nis }), 'Berhasil'); if (!this.langsung) this.muat(); } catch (e) {}
    }
  }
});

const KOLOM_GURU = ['Nama pengguna', 'Nama', 'Mata pelajaran', 'Password', 'Peran', 'Status'];
app.component('v-guru', {
  template: '#t-guru', data: () => ({ list: null, f: null, imp: null, sibuk: false }),
  computed: {
    hitungImpor() { const ada = new Set((this.list || []).map(g => g.username)); let baru = 0, ubah = 0; new Set(this.imp.rows.map(r => r.username)).forEach(u => ada.has(u) ? ubah++ : baru++); return { baru, ubah }; }
  },
  mounted() { this.muat(); },
  methods: {
    adaUser(u) { return (this.list || []).some(g => g.username === u); },
    petakan(baris) {
      if (!baris.length) return [];
      const norm = s => String(s || '').toLowerCase().replace(/[^a-z]/g, '');
      const h = baris[0].map(norm);
      let iU = h.findIndex(x => ['namapengguna', 'username', 'user', 'pengguna', 'akun', 'login', 'nip', 'nippengguna'].includes(x));
      let iN = h.findIndex((x, i) => i !== iU && ['nama', 'namalengkap', 'namaguru'].includes(x));
      let iM = h.findIndex(x => ['matapelajaran', 'mapel', 'pelajaran', 'matapelajaranyangdiampu'].includes(x));
      let iP = h.findIndex(x => ['password', 'katasandi', 'sandi', 'pass'].includes(x));
      let iR = h.findIndex(x => ['peran', 'role', 'hakakses', 'akses'].includes(x));
      let iS = h.findIndex(x => ['status', 'aktif', 'statusakun'].includes(x));
      let data = baris.slice(1);
      if (iU < 0 || iN < 0) { [iU, iN, iM, iP, iR, iS] = [0, 1, 2, 3, 4, 5]; data = /^(namapengguna|username|nip|no)$/.test(norm(baris[0][0])) ? baris.slice(1) : baris; }
      const sel = (r, i) => i >= 0 ? String(r[i] ?? '').trim() : '';
      let rusak = 0;
      const out = [];
      for (const r of data) {
        if (!sel(r, iU) || !sel(r, iN)) continue;
        const u = pengenal(r[iU]), pw = iP >= 0 ? pengenal(r[iP]) : '';
        if (u === null || pw === null) { rusak++; continue; }    // NIP 18 digit yang tersimpan sebagai angka
        out.push({ username: u.toLowerCase(), nama: sel(r, iN), mapel: sel(r, iM), password: pw, peran: sel(r, iR), status: sel(r, iS) });
      }
      if (this.imp) this.imp.rusak = rusak;
      return out;
    },
    parseTeks() { const sep = this.imp.teks.includes('\t') ? '\t' : (this.imp.teks.includes(';') ? ';' : ','); this.imp.rows = this.petakan(this.imp.teks.replace(/\r/g, '').split('\n').filter(l => l.trim()).map(l => l.split(sep))); },
    async bacaFile(e) {
      const f = e.target.files[0]; if (!f) return;
      try { const X = await muatXLSX(); const wb = X.read(await f.arrayBuffer(), { type: 'array' }); const ws = wb.Sheets[wb.SheetNames[0]]; this.imp.rows = this.petakan(bacaLembar(X, ws)); if (!this.imp.rows.length && !this.imp.rusak) toast('Tidak ada data yang terbaca. Pastikan ada kolom Nama pengguna dan Nama.', 'err'); }
      catch (err) { toast(err.message, 'err'); }
    },
    async impor() {
      this.sibuk = true;
      try {
        const r = await api('importGuru', { rows: this.imp.rows }, { retry: 2 });
        toast(`${r.baru} guru baru, ${r.ubah} diperbarui${r.lewati.length ? ', ' + r.lewati.length + ' baris dilewati (nama pengguna tidak valid)' : ''}`, 'ok', 6000);
        this.imp = null; this.muat();
      } catch (e) { toast(e.message, 'err', 6000); } finally { this.sibuk = false; }
    },
    async muat() { try { this.list = await api('listGuru'); } catch (e) { toast(e.message, 'err'); this.list = []; } },
    async unduh() {
      try {
        const [X, sandi] = await Promise.all([muatXLSX(), api('sandiGuru')]), wb = X.utils.book_new();
        const rows = this.list.map(g => ({ 'Nama pengguna': g.username, 'Nama': g.nama, 'Mata pelajaran': (g.mapel || []).join(', '), 'Password': sandi[g.id] || '', 'Peran': g.role === 'admin' ? 'Admin' : 'Guru', 'Status': g.aktif ? 'Aktif' : 'Nonaktif' }));
        X.utils.book_append_sheet(wb, lembarTeks(X, KOLOM_GURU, rows, ['Nama pengguna', 'Password']), 'Guru');
        X.writeFile(wb, 'Data_guru.xlsx');
      } catch (e) { toast(e.message, 'err'); }
    },
    async unduhFormat() {
      try { const X = await muatXLSX(), wb = X.utils.book_new(); X.utils.book_append_sheet(wb, lembarTeks(X, KOLOM_GURU, [], ['Nama pengguna', 'Password'], 300), 'Guru'); X.writeFile(wb, 'Format_impor_guru.xlsx'); }
      catch (e) { toast(e.message, 'err'); }
    },
    async simpan() {
      this.sibuk = true;
      try { await api('saveGuru', this.f); toast('Akun guru tersimpan'); this.f = null; this.muat(); }
      catch (e) { toast(e.message, 'err'); } finally { this.sibuk = false; }
    },
    async hapus(g) {
      if (!await tanya('Hapus akun guru?', `Akun ${g.nama} (${g.username}) akan dihapus. Bank soal miliknya tetap ada dan bisa dikelola admin.`, { ok: 'Hapus', bahaya: true })) return;
      try { await coba(() => api('deleteGuru', { id: g.id }), 'Akun dihapus'); this.muat(); } catch (e) {}
    }
  }
});

/* ---------- penggunaan harian serverC (Pengaturan) ---------- */
// Batas yang ditampilkan = 90% dari batas harian serverC: permintaan 90.000, observabilitas 180.000,
// baris dibaca 4,5 juta, baris ditulis 90.000, penyimpanan 4,5 GB (mesin ujian mengikuti aturan yang sama).
const PERSEN_PAKAI = 90;
const GRUP_PAKAI = [
  { judul: 'Server', galat: 'worker', baris: [
    { k: 'workerReq', label: 'Permintaan', en: '(Requests)' },
    { k: 'obs', label: 'Peristiwa observabilitas', en: '(Observability events)', g: 'obs' }] },
  { judul: 'Database', galat: 'd1', baris: [
    { k: 'd1Baca', label: 'Baris dibaca', en: '(Rows read)' },
    { k: 'd1Tulis', label: 'Baris ditulis', en: '(Rows written)' },
    { k: 'd1Simpan', label: 'Total penyimpanan', en: '(Total storage)', byte: true }] },
  { judul: 'Mesin ujian', galat: 'do', baris: [
    { k: 'doReq', label: 'Permintaan', en: '(Requests)' },
    { k: 'doDurasi', label: 'Durasi', en: '(Duration)', satuan: ' GB-dtk' },
    { k: 'doBaca', label: 'Baris dibaca', en: '(Rows read)' },
    { k: 'doTulis', label: 'Baris ditulis', en: '(Rows written)' },
    { k: 'doSimpan', label: 'Penyimpanan', en: '(Storage)', byte: true }] }
];
const fmtByte = n => { const u = ['B', 'kB', 'MB', 'GB']; let i = 0; while (n >= 1000 && i < 3) { n /= 1000; i++; } return (i && n < 100 ? n.toLocaleString('id-ID', { maximumFractionDigits: 1 }) : Math.round(n).toLocaleString('id-ID')) + ' ' + u[i]; };
const fmtAngka = (n, satuan = '') => (n < 100 && n % 1 ? n.toLocaleString('id-ID', { maximumFractionDigits: 1 }) : Math.round(n).toLocaleString('id-ID')) + satuan;
const fmtBatas = (n, satuan = '') => n >= 1e6 && !satuan ? (n / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' juta' : fmtAngka(n, satuan);
function barisPakai(b, nilai, batas) {
  const maks = (batas || 0) * PERSEN_PAKAI / 100, ada = nilai != null, p = ada && maks ? nilai / maks * 100 : 0;
  const warna = p >= 100 ? 'var(--merah)' : p >= 70 ? '#C77700' : 'var(--biru)', isi = Math.min(100, Math.max(p, ada && nilai > 0 ? 3 : 0));
  return { k: b.k, label: b.label, en: b.en, lewat: p >= 100,
    teks: !ada ? '—' : b.byte ? fmtByte(nilai) : fmtAngka(nilai, b.satuan),
    maks: b.byte ? fmtByte(maks) : fmtBatas(maks, b.satuan),
    persen: ada ? p.toLocaleString('id-ID', { maximumFractionDigits: 1 }) + '% dari batas' : 'tidak terbaca',
    cincin: `conic-gradient(${warna} ${isi}%, var(--garis-2) 0)` };
}

              : 'Halaman ujian siswa bisa dibuka di browser biasa (HP / laptop) tanpa aplikasi CBT Ujian. Aplikasi CBT Ujian tetap bisa dipakai. Berlaku dalam ±30 detik.',

      catch (e) { toast(e.message, 'err'); } finally { this.sibukKunci = false; }
    },

      try {
        const X = await muatXLSX(), wb = X.utils.book_new(), c = this.c;
        X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet([['Data', 'Isi'], ['Nama sekolah', c.namaSekolah || ''], ['Tahun ajaran', c.tahunAjaran || ''], ['Semester', c.semester || ''], ['URL logo', c.logo || '']]), 'Identitas');
        X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet([['Tingkat'], ...(c.tingkat || []).map(t => [t])]), 'Tingkat');
        X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet([['Nama kelas', 'Tingkat'], ...(c.kelas || []).map(k => [k.nama, k.tingkat || ''])]), 'Kelas');
        X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet([['Mata pelajaran'], ...(c.mapel || []).map(m => [m])]), 'Mata pelajaran');
        X.writeFile(wb, 'Pengaturan_' + namaFile(c.namaSekolah || 'sekolah') + '.xlsx');
      } catch (e) { toast(e.message, 'err'); }
    },
    /** Baca lembar Identitas / Tingkat / Kelas / Mata pelajaran (nama lembar atau judul kolom). */
    async bacaImpor(e) {
      const f = e.target.files[0]; if (!f) return;
      try {
        const X = await muatXLSX(), wb = X.read(await f.arrayBuffer(), { type: 'array' });
        const norm = v => String(v ?? '').trim(), kunci = v => norm(v).toLowerCase().replace(/[^a-z]/g, '');
        const data = {};
        for (const nm of wb.SheetNames) {
          const rows = X.utils.sheet_to_json(wb.Sheets[nm], { header: 1, raw: false, defval: '' }).filter(r => r.some(x => norm(x)));
          if (!rows.length) continue;
          const n = kunci(nm), h = rows[0].map(kunci);
          const isi = rows.slice(1);
          if (n.includes('identitas') || (h[0] === 'data' && h[1] === 'isi')) {
            const id = {};
            (h[0] === 'data' ? isi : rows).forEach(r => {
              const k = kunci(r[0]), v = norm(r[1]);
              if (k === 'namasekolah') id.namaSekolah = v; else if (k === 'tahunajaran') id.tahunAjaran = v;
              else if (k === 'semester') id.semester = /genap/i.test(v) ? 'Genap' : (v ? 'Ganjil' : ''); else if (k === 'urllogo' || k === 'logo') id.logo = v;
            });
            data.identitas = id;
          } else if (n.includes('kelas') || h.includes('namakelas') || h[0] === 'kelas') {
            const iN = Math.max(0, h.findIndex(x => x === 'namakelas' || x === 'kelas')), iT = h.findIndex(x => x === 'tingkat');
            const ada = new Set();
            data.kelas = isi.map(r => ({ nama: norm(r[iN]), tingkat: iT >= 0 ? norm(r[iT]) : '' })).filter(k => k.nama && !ada.has(k.nama.toLowerCase()) && ada.add(k.nama.toLowerCase()));
          } else if (n.includes('mata') || n.includes('mapel') || h[0] === 'matapelajaran' || h[0] === 'mapel') {
            data.mapel = [...new Set(isi.map(r => norm(r[0])).filter(Boolean))];
          } else if (n.includes('tingkat') || h[0] === 'tingkat') {
            data.tingkat = [...new Set(isi.map(r => norm(r[0])).filter(Boolean))];
          }
        }
        if (!data.identitas && !data.kelas && !data.mapel && !data.tingkat) return toast('Tidak ada lembar Identitas, Tingkat, Kelas, atau Mata pelajaran di file ini.', 'err');
        this.imp.data = data;
      } catch (err) { toast(err.message, 'err'); }
    },
    async terapkanImpor() {
      const d = this.imp.data, c = JSON.parse(JSON.stringify(this.c)), ganti = this.imp.mode === 'ganti';
      if (d.identitas) Object.keys(d.identitas).forEach(k => { if (d.identitas[k]) c[k] = d.identitas[k]; });
      const tambahUnik = (lama, baru) => { const a = [...lama]; baru.forEach(x => { if (!a.some(y => y.toLowerCase() === x.toLowerCase())) a.push(x); }); return a; };
      if (d.tingkat) c.tingkat = ganti ? d.tingkat : tambahUnik(c.tingkat || [], d.tingkat);
      if (d.kelas) {
        if (ganti) c.kelas = d.kelas.map(k => ({ ...k }));
        else d.kelas.forEach(k => { const x = c.kelas.find(y => y.nama.toLowerCase() === k.nama.toLowerCase()); if (x) { if (k.tingkat) x.tingkat = k.tingkat; } else c.kelas.push({ ...k }); });
        c.tingkat = tambahUnik(c.tingkat || [], c.kelas.map(k => k.tingkat).filter(Boolean));
        c.kelas.sort((a, b) => a.nama.localeCompare(b.nama, 'id', { numeric: true }));
      }
      if (d.mapel) c.mapel = ganti ? d.mapel : tambahUnik(c.mapel || [], d.mapel);
      if (ganti && !await tanya('Ganti daftar pengaturan?', 'Daftar tingkat, kelas, dan mata pelajaran diganti persis dengan isi file. Kelas atau mapel yang tidak ada di file akan hilang dari pengaturan (data siswa & bank soal tidak terhapus).', { ok: 'Ganti', bahaya: true })) return;
      const lama = this.c; this.c = c;
      if (await this.simpan()) this.imp = null; else this.c = lama;
    },
    async muatUlangData() {
      if (!await tanya('Muat ulang data?', 'Data guru, bank soal, jadwal, dan pengaturan dibaca ulang dari serverC. Hanya perlu bila data di serverC diubah di luar aplikasi.', { ok: 'Muat ulang' })) return;
      try { const r = await api('muatUlangData'); toast(`Dimuat ulang: ${r.guru} guru, ${r.bank} bank soal, ${r.ujian} jadwal`); this.muatStatus && this.muatStatus(); } catch (e) { toast(e.message, 'err'); }
    },
    muatStatus() { api('statusSistem').then(r => this.st = r).catch(() => {}); },
    async sinkron() {
      this.sibukSync = true;
      try { const r = await api('sinkronSekarang'); toast(pesanSinkron(r), r.cadangan && r.cadangan.error ? 'err' : 'ok', 6000); this.muatStatus(); }
      catch (e) { toast(e.message, 'err'); } finally { this.sibukSync = false; }
    },
    async impor() {
      if (!await tanya('Impor dari serverB?', 'Data di serverB (pengaturan, guru, siswa, bank soal, jadwal, hasil) akan dimasukkan ke serverC. Data dengan ID sama akan ditimpa. Pakai ini untuk memindahkan data dari versi lama. Jangan lakukan saat ujian berlangsung.', { ok: 'Impor sekarang', bahaya: true })) return;
      this.sibukSync = true;
      try {
        const n = await api('imporCadangan', {}, { retry: 0 });
        toast(`Diimpor: ${n.guru} guru, ${n.siswa} siswa, ${n.bank} bank soal, ${n.ujian} jadwal, ${n.hasil} hasil`, 'ok', 8000);
        S.config = await api('getConfig'); localStorage.setItem('cbt_g_config', JSON.stringify(S.config)); this.c = JSON.parse(JSON.stringify(S.config)); this.asli = JSON.stringify(this.c);
      } catch (e) { toast(e.message, 'err', 8000); } finally { this.sibukSync = false; }
    }
  }
});
function pesanSinkron(r) {
  let t = r.disinkron ? r.disinkron + ' hasil disimpan ke serverC' : 'Semua hasil sudah tersimpan';
  if (r.cadangan && r.cadangan.error) t += '. Gagal dikirim ke serverB: ' + r.cadangan.error;
  else if (r.cadangan && r.cadangan.berkas) t += ', ' + r.cadangan.berkas + ' berkas dikirim ke serverB';
  else if (r.adaRepo) t += ', serverB sudah terbaru';
  return t;
}

/* ---------- router ---------- */
const RUTE = ['beranda', 'bank', 'editor', 'jadwal', 'monitor', 'hasil', 'siswa', 'guru', 'pengaturan', 'akun'];
const ADMIN = ['siswa', 'guru', 'pengaturan'];
let hashLama = location.hash;
function rute() {
  if (S.editorKotor && S.route.name === 'editor' && !confirm('Ada perubahan bank soal yang belum disimpan. Tinggalkan halaman ini?')) { history.replaceState(null, '', hashLama); return; }
  const [, name, id] = (location.hash || '').match(/^#\/([a-z]+)\/?([^/?#]*)/) || [];
  let n = RUTE.includes(name) ? name : 'beranda';
  if (ADMIN.includes(n) && S.user && S.user.role !== 'admin') n = 'beranda';
  S.route = { name: n, id: decodeURIComponent(id || '') };
  S.editorKotor = false; hashLama = location.hash;
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', rute);
rute();

    document.documentElement.style.setProperty('--atas', (tb && tb.offsetParent !== null ? tb.offsetHeight : 0) + 'px');
  };
  const minta = () => { if (!jalan) { jalan = true; requestAnimationFrame(atur); } };
  window.addEventListener('scroll', minta, { passive: true });
  window.addEventListener('resize', minta);
  window.addEventListener('hashchange', minta);
  setTimeout(atur, 0);
})();
</script>
