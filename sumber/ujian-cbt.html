<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<meta name="format-detection" content="telephone=no">
<title>Ujian CBT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css">
<style>
/* Palet "biru teduh": latar terang lembut (tidak silau), satu warna utama biru tenang,
   hijau untuk kirim/selesai, kuning hanya untuk ragu-ragu, merah hanya untuk peringatan. */
:root{
  --latar:#F2F5F8; --kertas:#FFFFFF;
  --utama:#2A5C8A; --utama-gelap:#1F4A72; --utama-muda:#E7EFF7; --utama-garis:#BCD0E3;
  --hijau:#22796A; --hijau-gelap:#1A6356; --hijau-muda:#E1F1ED;
  --ragu:#E3A82B; --ragu-gelap:#8A6000; --ragu-muda:#FCF4E0;
  --merah:#B4383A; --merah-muda:#FBEBEB;
  --teks:#1C2833; --teks-2:#566574; --teks-3:#8C98A4; --garis:#D9E1E8; --garis-2:#E9EEF3;
  --bayang:0 1px 2px rgba(28,40,51,.05),0 2px 10px rgba(28,40,51,.04);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);font-size:15px;line-height:1.55;color:var(--teks);background:var(--latar);-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--utama);outline-offset:2px}
[v-cloak]{display:none}
h1,h2,h3{margin:0;line-height:1.3;letter-spacing:-.01em;font-weight:700}
p{margin:0}
.muted{color:var(--teks-2)} .small{font-size:13px} .tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo{width:34px;height:34px;border-radius:10px;background:var(--utama);display:grid;place-items:center;flex:none}
.logo svg{display:block}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--garis);background:var(--kertas);cursor:pointer;font-weight:600;white-space:nowrap;color:var(--teks);text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{border-color:#BAC6D1;background:#FAFCFD}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--utama);border-color:var(--utama);color:#fff}
.btn-primary:hover{background:var(--utama-gelap);border-color:var(--utama-gelap)}
.btn-selesai{background:var(--hijau);border-color:var(--hijau);color:#fff}
.btn-selesai:hover{background:var(--hijau-gelap);border-color:var(--hijau-gelap)}
.btn-lembut{background:var(--utama-muda);border-color:transparent;color:var(--utama-gelap)}
.btn-lembut:hover{background:#DCE8F3;border-color:transparent}
.btn-ghost{border-color:transparent;background:transparent;color:var(--teks-2)}
.btn-ghost:hover{background:var(--latar);border-color:transparent}
.btn-block{width:100%}
.btn-sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:9px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field>span{font-weight:600;font-size:14px}
.field input{width:100%;height:48px;padding:0 14px;border:1.5px solid var(--garis);border-radius:10px;background:#fff;font-size:16px}
.field input:focus{border-color:var(--utama);outline:none;box-shadow:0 0 0 3px var(--utama-muda)}
.sandi{-webkit-text-security:disc}
/* kolom kata sandi + tombol mata */
.sandi-wrap{position:relative;display:block}
.field .sandi-wrap input{padding-right:52px}
.mata{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:42px;height:38px;border:0;border-radius:8px;background:none;color:var(--teks-2);cursor:pointer;display:grid;place-items:center;padding:0}
.mata:hover,.mata:active{color:var(--teks);background:var(--latar)}
.mata:focus-visible{outline:2px solid var(--utama);outline-offset:1px}
/* tombol Keluar di kepala halaman: jelas terlihat & mudah ditekan di HP */
.btn-keluar{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--garis);background:#fff;color:var(--teks);font-weight:600;flex:none;white-space:nowrap}
.btn-keluar:hover,.btn-keluar:active{background:var(--latar);border-color:var(--garis)}
.err{background:var(--merah-muda);color:var(--merah);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}

/* masuk */
.login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 18px;background:linear-gradient(180deg,var(--utama-muda) 0,var(--latar) 55%)}
.kartu-login{width:100%;max-width:400px;background:#fff;border:1px solid var(--garis-2);border-radius:18px;padding:26px 24px 22px;box-shadow:var(--bayang)}
.merek{display:flex;align-items:center;gap:12px;min-width:0}
.merek b{display:block;font-size:15px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kartu-login .merek{margin-bottom:24px}
.kartu-login h1{font-size:22px;margin-bottom:6px}
.kartu-login p.muted{font-size:14px;margin-bottom:20px}

/* kepala halaman daftar / konfirmasi / selesai */
.kepala{background:#fff;border-bottom:1px solid var(--garis-2);position:sticky;top:0;z-index:20}
.kepala .isi{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:60px}
.kepala .merek{flex:1}
.wadah{max-width:760px;margin:0 auto;padding:20px 16px 48px}
.profil{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--garis-2);border-radius:14px;padding:14px 16px;box-shadow:var(--bayang)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--utama-muda);color:var(--utama-gelap);display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.profil .who{flex:1;min-width:0}
.profil .who b{display:block;font-size:16px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profil .who span{display:block;font-size:13px;color:var(--teks-2)}
.judul-bagian{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 2px}
.judul-bagian h1{font-size:18px}
.judul-bagian p{font-size:13px;color:var(--teks-2)}
.kartu{background:#fff;border:1px solid var(--garis-2);border-radius:14px;padding:16px 18px;margin-top:12px;display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap;box-shadow:var(--bayang)}
.kartu .info{flex:1 1 240px;min-width:0}
.kartu .mapel{font-size:12px;color:var(--utama);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kartu h3{font-size:16.5px;margin:3px 0 6px}
.kartu .waktu{font-size:13.5px;color:var(--teks-2);display:flex;flex-wrap:wrap;gap:2px 14px}
.kartu .aksi-kartu{flex:none;margin-left:auto}
.chip{display:inline-flex;align-items:center;min-height:28px;padding:2px 12px;border-radius:14px;font-size:13px;font-weight:600}
.chip-abu{background:var(--latar);color:var(--teks-2)}
.chip-hijau{background:var(--hijau-muda);color:var(--hijau-gelap)}
.kosong{text-align:center;padding:44px 20px;color:var(--teks-2);background:#fff;border:1px dashed var(--garis);border-radius:14px;margin-top:12px}
.kosong b{display:block;color:var(--teks);font-size:16px;margin-bottom:6px}
.bawah{display:flex;justify-content:center;margin-top:28px}

/* konfirmasi */
.panel{background:#fff;border:1px solid var(--garis-2);border-radius:16px;box-shadow:var(--bayang);overflow:hidden}
.panel-kepala{padding:18px 20px;border-bottom:1px solid var(--garis-2)}
.panel-kepala span{font-size:12px;color:var(--utama);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.panel-kepala h2{font-size:19px;margin-top:3px}
.panel-isi{padding:16px 20px 20px}
.tbl-data{width:100%;border-collapse:collapse;margin:0 0 16px}
.tbl-data td{padding:10px 0;border-bottom:1px solid var(--garis-2);vertical-align:top}
.tbl-data td:first-child{color:var(--teks-2);width:44%;padding-right:12px}
.tbl-data td:last-child{font-weight:600}
.token-in{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:700;font-size:22px!important;font-variant-numeric:tabular-nums}
.aturan{background:var(--utama-muda);border-radius:12px;padding:14px 16px;font-size:14px;margin-bottom:18px;color:#25415C}
.aturan ul{margin:6px 0 0;padding-left:18px}
.aturan li{margin:4px 0}
.tombol-baris{display:flex;gap:10px}
.tombol-baris .btn:last-child{flex:1}

/* layar ujian */
.uj{min-height:100vh;display:flex;flex-direction:column}
.uj-top{background:#fff;border-bottom:1px solid var(--garis-2);position:sticky;top:0;z-index:30}
.uj-top .isi{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:62px}
.uj-top .judul{min-width:0;flex:1}
.uj-top .judul b{display:block;font-size:15px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uj-top .judul span{display:block;font-size:12.5px;line-height:1.35;color:var(--teks-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{display:flex;align-items:center;gap:8px;background:var(--utama-muda);color:var(--utama-gelap);border-radius:12px;padding:6px 14px 6px 11px;flex:none}
.timer svg{flex:none}
.timer .t{display:flex;flex-direction:column;line-height:1.15}
.timer small{font-size:10.5px;font-weight:600;opacity:.8}
.timer b{font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.kuning{background:var(--ragu-muda);color:var(--ragu-gelap)}
.timer.merah{background:var(--merah);color:#fff}
.btn-daftar{display:none;align-items:center;gap:7px;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--garis);background:#fff;cursor:pointer;font-weight:600;font-size:14px;flex:none;font-variant-numeric:tabular-nums;color:var(--teks)}
.uj-main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;max-width:1240px;width:100%;margin:0 auto;padding:20px 16px 112px}
.kertas{background:#fff;border:1px solid var(--garis-2);border-radius:16px;min-height:60vh;user-select:none;-webkit-user-select:none;box-shadow:var(--bayang)}
.kertas-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--garis-2)}
.no-soal{min-width:40px;height:40px;padding:0 8px;border-radius:11px;background:var(--utama-muda);color:var(--utama-gelap);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;font-variant-numeric:tabular-nums}
.kertas-head .ket{flex:1;min-width:0}
.kertas-head .ket b{display:block;font-size:14px;line-height:1.35}
.kertas-head .ket span{display:block;font-size:12.5px;line-height:1.35;color:var(--teks-2)}
.fs{display:inline-flex;border:1px solid var(--garis);border-radius:9px;overflow:hidden;flex:none}
.fs button{border:0;background:#fff;width:36px;height:34px;cursor:pointer;font-weight:700;color:var(--teks-2);padding:0}
.fs button+button{border-left:1px solid var(--garis)}
.fs button.on{background:var(--utama);color:#fff}
.kertas-body{padding:20px 24px 28px}
.soal{line-height:1.75;font-size:var(--fz,18px)}
.soal .stim{background:#F6F8FA;border-left:3px solid var(--utama-garis);padding:12px 16px;margin-bottom:16px;border-radius:0 10px 10px 0;font-size:.94em;max-height:46vh;overflow:auto;user-select:none}
.soal .teks{margin-bottom:14px}
.soal .gbr{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 16px}
.soal .gbr img{max-width:100%;max-height:360px;border-radius:8px;border:1px solid var(--garis-2);cursor:zoom-in}
.petunjuk{font-size:13px;font-weight:600;color:var(--teks-2);margin-bottom:10px;line-height:1.5}
.opsi{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--garis-2);border-radius:12px;margin-bottom:10px;cursor:pointer;background:#fff;width:100%;text-align:left;font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;transition:border-color .12s,background .12s}
.opsi:hover{border-color:var(--utama-garis)}
.opsi.pilih{border-color:var(--utama);background:var(--utama-muda)}
.opsi .t{flex:1;min-width:0;padding-top:3px}
.opsi img{max-width:100%;max-height:200px;display:block;margin-top:6px;border-radius:6px}
.bub{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--garis);color:var(--teks-2);display:inline-grid;place-items:center;font-weight:700;font-size:14px;line-height:1;background:#fff;flex:none;font-family:var(--font);font-variant-numeric:tabular-nums;padding:0;cursor:pointer}
.bub.isi{background:var(--utama);border-color:var(--utama);color:#fff}
.bub.ragu{background:var(--ragu);border-color:var(--ragu);color:#3B2A00}
.bub.aktif{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--utama)}
.bub.kotak{border-radius:9px}
.tbl-bs{width:100%;border-collapse:collapse;font-size:.95em}
.tbl-bs td,.tbl-bs th{border:1px solid var(--garis-2);padding:10px 12px;vertical-align:middle}
.tbl-bs th{font-size:13px;background:#F8FAFB;font-weight:600}
.tbl-bs td.c{text-align:center;width:84px;padding:6px}
.tbl-bs .rb{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--garis);background:#fff;cursor:pointer}
.tbl-bs .rb.on{background:var(--utama);border-color:var(--utama);box-shadow:inset 0 0 0 4px #fff}
.kanan-box{border:1px solid var(--garis-2);border-radius:12px;padding:10px 14px;margin-bottom:10px;background:#F8FAFB}
.kb-judul{font-size:12.5px;font-weight:600;color:var(--teks-2);margin-bottom:4px}
.kb-item{display:flex;gap:10px;align-items:baseline;padding:3px 0}
.kb-h{font-weight:700;color:var(--utama);min-width:18px}
.jodoh-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--garis-2)}
.jodoh-row select{font-size:15px;width:100%;height:46px;border:1.5px solid var(--garis);border-radius:10px;padding:0 10px;background:#fff}
.jodoh-row select.ada{border-color:var(--utama);background:var(--utama-muda)}
.isian{width:100%;height:50px;border:1.5px solid var(--garis);border-radius:10px;padding:0 14px;font-size:17px;user-select:text;-webkit-user-select:text;background:#fff}
.uraian{width:100%;min-height:200px;border:1.5px solid var(--garis);border-radius:10px;padding:12px 14px;font-size:16px;line-height:1.65;resize:vertical;user-select:text;-webkit-user-select:text;background:#fff}
.isian:focus,.uraian:focus{border-color:var(--utama);outline:none;box-shadow:0 0 0 3px var(--utama-muda)}
.urut-row{display:flex;gap:10px;align-items:center;border:1.5px solid var(--garis-2);border-radius:12px;padding:8px 10px;margin-bottom:8px;background:#fff}
.urut-row .n{font-weight:700;color:var(--utama);width:24px;text-align:center;flex:none}
.urut-row .t{flex:1;min-width:0}
.urut-row button{width:42px;height:40px;border:1px solid var(--garis);border-radius:9px;background:#fff;cursor:pointer;font-size:17px;flex:none}
.urut-row button:disabled{opacity:.35}
.sisa-char{font-size:12px;color:var(--teks-3);text-align:right;margin-top:4px}

.uj-foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--garis-2);z-index:25;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.uj-foot .isi{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:10px}
.uj-foot .btn{min-width:48px}
.ragu-btn{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid #EBCF8C;background:#fff;cursor:pointer;font-weight:600;margin:0 auto;color:var(--teks)}
.ragu-btn .kotak{width:20px;height:20px;border-radius:6px;border:2px solid var(--ragu);display:grid;place-items:center;font-size:13px;line-height:1;color:#fff}
.ragu-btn.on{background:var(--ragu-muda);border-color:var(--ragu)}
.ragu-btn.on .kotak{background:var(--ragu)}

.ljk{background:#fff;border:1px solid var(--garis-2);border-radius:16px;padding:16px;position:sticky;top:84px;align-self:start;box-shadow:var(--bayang)}
.ljk h3{font-size:14.5px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ljk h3 span{color:var(--teks-2);font-weight:500;font-size:12.5px}
.ljk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 6px;justify-items:center;margin:14px 0;max-height:52vh;overflow:auto;padding:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--teks-2);margin-bottom:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--garis);vertical-align:-2px;margin-right:5px}
.legend i.isi{background:var(--utama);border-color:var(--utama)}
.legend i.ragu{background:var(--ragu);border-color:var(--ragu)}
.sync{font-size:12px;color:var(--teks-2);margin-top:12px;display:flex;gap:7px;align-items:center;line-height:1.4}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--hijau);display:inline-block;flex:none}
.sync.off i{background:var(--merah)} .sync.proses i{background:var(--ragu)}
.pegangan{display:none}
.scrim{display:none}

.modal-bg{position:fixed;inset:0;background:rgba(20,32,45,.45);display:grid;place-items:center;padding:18px;z-index:60;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:440px;padding:22px 22px 18px;box-shadow:0 12px 40px rgba(20,32,45,.18)}
.modal h2{font-size:18px;margin-bottom:8px}
.modal p{margin-bottom:12px}
.modal .aksi{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.daftar-no{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.daftar-no button{min-width:36px;height:32px;border-radius:8px;border:1px solid var(--garis);background:#fff;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.daftar-no button.ragu{background:var(--ragu-muda);border-color:#EBCF8C}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin-top:6px}
.check input{width:20px;height:20px;accent-color:var(--hijau);margin-top:1px;flex:none}
.peringatan h2{color:var(--merah)}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:70;padding:12px}
.zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}
.fs-banner{background:var(--utama-muda);color:#25415C;border-bottom:1px solid var(--utama-garis);padding:8px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}

.selesai-box{max-width:460px;margin:6vh auto 0;background:#fff;border-radius:18px;padding:32px 26px 26px;text-align:center;border:1px solid var(--garis-2);box-shadow:var(--bayang)}
.selesai-box .centang{width:64px;height:64px;border-radius:50%;background:var(--hijau-muda);margin:0 auto 16px;display:grid;place-items:center}
.selesai-box h1{font-size:21px;margin-bottom:6px}
.nilai{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;margin:16px 0 4px;color:var(--utama-gelap)}
.tombol-selesai{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.toasts{position:fixed;top:74px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90;width:max-content;max-width:92vw}
.toast{background:var(--teks);color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);text-align:center}
.toast.err{background:var(--merah)}

@media (max-width:900px){
  .uj-main{grid-template-columns:1fr;padding:12px 10px 104px}
  .btn-daftar{display:inline-flex}
  .ljk{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:50;border-radius:18px 18px 0 0;border-width:1px 0 0;transform:translateY(105%);transition:transform .2s;max-height:80vh;overflow:auto;padding:10px 18px calc(18px + env(safe-area-inset-bottom))}
  .ljk.buka{transform:none}
  .pegangan{display:block;width:40px;height:4px;border-radius:2px;background:var(--garis);margin:0 auto 12px}
  .ljk-grid{grid-template-columns:repeat(auto-fill,minmax(44px,1fr))}
  .scrim.buka{display:block;position:fixed;inset:0;background:rgba(20,32,45,.4);z-index:45}
}
@media (max-width:600px){
  body{font-size:14.5px}
  .kepala .isi,.uj-top .isi{padding:8px 12px;gap:10px;min-height:58px}
  .wadah{padding:16px 12px 40px}
  .kartu{padding:14px}
  .kartu .aksi-kartu{flex:1 1 100%;margin-left:0}
  .kartu .aksi-kartu .btn{width:100%}
  .kartu .aksi-kartu .chip{width:100%;justify-content:center}
  .panel-kepala,.panel-isi{padding-left:16px;padding-right:16px}
  .kertas{border-radius:14px}
  .kertas-head{padding:12px 14px}
  .kertas-body{padding:16px 14px 22px}
  .opsi{gap:12px;padding:11px 12px}
  .bub{width:34px;height:34px}
  .jodoh-row{grid-template-columns:1fr;gap:6px}
  .tbl-bs td,.tbl-bs th{padding:8px}
  .tbl-bs td.c{width:64px}
  .uj-foot{padding-left:10px;padding-right:10px}
  .uj-foot .lbl{display:none}
  .timer{padding:6px 11px 6px 9px;gap:6px}
  .timer b{font-size:16px}
  .modal{padding:20px 18px 16px}
}
@media (max-width:380px){
  .timer small,.timer svg{display:none}
  .uj-top .judul span{display:none}
  .fs button{width:32px}
}
@media (prefers-reduced-motion:reduce){.ljk{transition:none}}
</style>
</head>
<body>
<div id="app" v-cloak></div>

<script type="text/x-template" id="t-root">
  <!-- MASUK -->
  <div class="login" v-if="layar==='login'">
    <div class="kartu-login">
      <div class="merek"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><b>{{ sekolah.namaSekolah || 'Ujian CBT' }}</b></div>
      <h1>Masuk ujian</h1>
      <p class="muted">Gunakan NIS dan kata sandi dari kartu login. Kata sandi awal sama dengan NIS.</p>
      <form @submit.prevent="masuk" :autocomplete="app ? 'off' : 'on'">
        <div class="err" v-if="err">{{ err }}</div>
        <label class="field"><span>NIS</span><input v-model.trim="f.nis" inputmode="text" :autocomplete="app ? 'off' : 'username'" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
        <label class="field"><span>Kata sandi</span><span class="sandi-wrap"><input :type="(app || lihatPw) ? 'text' : 'password'" :class="{sandi: app && !lihatPw}" v-model="f.pw" :autocomplete="app ? 'off' : 'current-password'" autocapitalize="none" autocorrect="off" spellcheck="false" required><button type="button" class="mata" @click.prevent="lihatPw = !lihatPw" :aria-pressed="lihatPw" :aria-label="lihatPw ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi'" :title="lihatPw ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><template v-if="lihatPw"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-2.6 3.5M6.6 6.6C4 8.3 2.5 12 2.5 12s3.5 7 9.5 7c1.8 0 3.4-.6 4.7-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></template><template v-else><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></template></svg></button></span></label>
        <button class="btn btn-primary btn-block" :disabled="sibuk">{{ sibuk ? 'Memeriksa…' : 'Masuk' }}</button>
        <p class="small muted" style="margin-top:14px" v-if="!apiSiap">Alamat server belum diatur (API_URL).</p>
      </form>
      <button type="button" class="btn btn-ghost btn-block" style="margin-top:8px" v-if="app" @click="mintaKeluarApp">Tutup aplikasi</button>
    </div>
  </div>

  <!-- DAFTAR UJIAN -->
  <template v-else-if="layar==='daftar'">
    <header class="kepala"><div class="isi">
      <div class="merek"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><b>{{ sekolah.namaSekolah || 'Ujian CBT' }}</b></div>
      <button class="btn btn-sm btn-keluar" @click="keluar" aria-label="Keluar akun"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M14 8l4 4-4 4"/><path d="M18 12H9"/></svg>Keluar</button>
    </div></header>
    <div class="wadah">
      <div class="profil">
        <span class="avatar">{{ inisial }}</span>
        <div class="who"><b>{{ user.nama }}</b><span>NIS {{ user.nis }} · Kelas {{ user.kelas }}</span></div>
      </div>
      <div class="judul-bagian">
        <div><h1>Ujian hari ini</h1><p>Daftar diperbarui otomatis.</p></div>
        <button class="btn btn-lembut btn-sm" @click="muatDaftar()">Segarkan</button>
      </div>
      <div class="err" v-if="err" style="margin-top:14px">{{ err }}</div>
      <div v-if="!daftar" class="kosong">Memuat…</div>
      <div v-else-if="!daftar.length" class="kosong"><b>Tidak ada ujian hari ini</b>Belum ada ujian yang dijadwalkan untuk kelas Anda.</div>
      <div class="kartu" v-for="u in daftar" :key="u.id">
        <div class="info">
          <div class="mapel">{{ u.mapel }}</div>
          <h3>{{ u.nama }}</h3>
          <div class="waktu"><span>{{ fmtHari(u.mulai) }}, {{ fmtJam(u.mulai) }}–{{ fmtJam(u.selesai) }}</span><span>{{ u.durasi }} menit · {{ u.jumlahSoal }} soal</span></div>
        </div>
        <div class="aksi-kartu">
          <span v-if="u.status==='selesai'" class="chip chip-hijau">Selesai<template v-if="u.nilai!==undefined"> · nilai {{ u.nilai }}<template v-if="u.perluKoreksi">*</template></template></span>
          <button v-else-if="u.status==='mengerjakan'" class="btn btn-selesai" @click="pilih(u)">Lanjutkan</button>
          <button v-else-if="u.jadwal==='berlangsung'" class="btn btn-primary" @click="pilih(u)">Mulai</button>
          <span v-else-if="u.jadwal==='akan'" class="chip chip-abu">Dibuka {{ hitungMundur(u.mulai) }}</span>
          <span v-else class="chip chip-abu">Ditutup</span>
        </div>
      </div>
      <p class="small muted" style="margin-top:16px" v-if="daftar && daftar.some(u=>u.perluKoreksi)">* Nilai sementara, soal uraian masih dikoreksi guru.</p>
      <div class="bawah" v-if="app"><button class="btn btn-ghost btn-sm" @click="mintaKeluarApp">Tutup aplikasi</button></div>
    </div>
  </template>

  <!-- KONFIRMASI -->
  <template v-else-if="layar==='konfirmasi'">
    <header class="kepala"><div class="isi">
      <div class="merek"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><b>Konfirmasi ujian</b></div>
    </div></header>
    <div class="wadah" style="max-width:540px">
      <div class="panel">
        <div class="panel-kepala"><span>{{ pilihan.mapel }}</span><h2>{{ pilihan.nama }}</h2></div>
        <form class="panel-isi" @submit.prevent="mulai(false)" autocomplete="off">
          <table class="tbl-data"><tbody>
            <tr><td>Nama</td><td>{{ user.nama }}</td></tr>
            <tr><td>NIS / kelas</td><td>{{ user.nis }} / {{ user.kelas }}</td></tr>
            <tr><td>Jumlah soal</td><td>{{ pilihan.jumlahSoal }}</td></tr>
            <tr><td>Waktu pengerjaan</td><td>{{ pilihan.durasi }} menit</td></tr>
            <tr><td>Ditutup pukul</td><td>{{ fmtJam(pilihan.selesai) }}</td></tr>
          </tbody></table>
          <div class="aturan">
            <b>Sebelum mulai</b>
            <ul>
              <li>Waktu berjalan sejak tombol mulai ditekan dan tidak berhenti meski halaman ditutup.</li>
              <li>Jangan keluar dari halaman ini atau membuka aplikasi lain. Setiap kali keluar akan dicatat.</li>
              <li>Jawaban tersimpan otomatis di perangkat ini. Jika koneksi putus, lanjutkan saja: jawaban dikirim saat Anda menekan <b>Selesai</b>.</li>
              <li v-if="app">Aplikasi <b>terkunci</b> setelah Anda menekan <b>Mulai mengerjakan</b> dan baru bisa ditutup setelah jawaban terkirim.</li>
            </ul>
            <p v-if="pilihan.wajibApp && !app" style="margin-top:8px;color:var(--merah)"><b>Ujian ini wajib dikerjakan lewat aplikasi CBT Ujian (Android/Windows).</b></p>
            <p v-if="pilihan.keterangan" style="margin-top:8px"><b>Pesan pengawas:</b> {{ pilihan.keterangan }}</p>
          </div>
          <div class="err" v-if="err">{{ err }}</div>
          <label class="field" v-if="pilihan.pakaiToken"><span>Token ujian</span><input class="token-in" v-model.trim="tokenUjian" maxlength="6" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" required placeholder="••••••"><small class="muted">Token dibacakan oleh pengawas.</small></label>
          <div class="tombol-baris">
            <button type="button" class="btn" @click="layar='daftar';err=''">Kembali</button>
            <button class="btn btn-primary" :disabled="sibuk">{{ sibuk ? 'Menyiapkan soal…' : (pilihan.status==='mengerjakan' ? 'Lanjutkan mengerjakan' : 'Mulai mengerjakan') }}</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- UJIAN -->
  <div class="uj" v-else-if="layar==='ujian'" @contextmenu.prevent @copy.prevent @cut.prevent>
    <header class="uj-top"><div class="isi">
      <div class="judul"><b>{{ uj.ujian.nama }}</b><span>{{ user.nama }} · {{ user.nis }}</span></div>
      <div class="timer" :class="{kuning: sisaDetik<=600 && sisaDetik>300, merah: sisaDetik<=300}" role="timer" aria-live="off">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>
        <span class="t"><small>Sisa waktu</small><b>{{ sisaTeks }}</b></span>
      </div>
      <button class="btn-daftar" @click="ljkBuka=true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>{{ idx+1 }}/{{ uj.soal.length }}<span class="sr">Daftar soal</span></button>
    </div></header>
    <div class="fs-banner" v-if="perluFullscreen"><span>Mode layar penuh tertutup.</span><button class="btn btn-sm" @click="layarPenuh">Kembali ke layar penuh</button></div>
    <div class="uj-main">
      <section class="kertas">
        <div class="kertas-head">
          <span class="no-soal">{{ idx+1 }}</span>
          <div class="ket"><b>Soal {{ idx+1 }} dari {{ uj.soal.length }}</b><span>{{ namaTipe(soal.tipe) }}<template v-if="soal.bobot!==1"> · bobot {{ soal.bobot }}</template></span></div>
          <div class="fs" aria-label="Ukuran huruf">
            <button v-for="(z,i) in [16,18,21]" :key="z" :class="{on: fz===z}" @click="setFz(z)" :aria-label="'Ukuran huruf ' + (i+1)" :style="{fontSize: (12+i*2)+'px'}">A</button>
          </div>
        </div>
        <div class="kertas-body">
          <div class="soal" :style="{'--fz': fz+'px'}" :key="soal.id">
            <div class="stim" v-if="soal.stimulus" v-html="fmt(soal.stimulus)" v-math></div>
            <div class="teks" v-html="fmt(soal.teks)" v-math></div>
            <div class="gbr" v-if="soal.gambar && soal.gambar.length"><img v-for="g in soal.gambar" :key="g" :src="g" alt="Gambar soal" @click="zoom=g"></div>
            <div class="petunjuk">{{ petunjuk(soal.tipe) }}</div>

            <template v-if="soal.tipe==='pg' || soal.tipe==='pgk'">
              <button v-for="(o,i) in soal.opsi" :key="o.id" class="opsi" :class="{pilih: dipilih(o.id)}" @click="pilihOpsi(o.id)" :aria-pressed="dipilih(o.id)">
                <span class="bub" :class="{isi: dipilih(o.id), kotak: soal.tipe==='pgk'}">{{ huruf(i) }}</span>
                <span class="t"><span v-html="fmt(o.teks)" v-math></span><img v-if="o.gambar" :src="o.gambar" alt="" @click.stop="zoom=o.gambar"></span>
              </button>
            </template>

            <table class="tbl-bs" v-if="soal.tipe==='bs'">
              <thead><tr><th>Pernyataan</th><th>{{ soal.label[0] }}</th><th>{{ soal.label[1] }}</th></tr></thead>
              <tbody><tr v-for="p in soal.pernyataan" :key="p.id">
                <td v-html="fmt(p.teks)" v-math></td>
                <td class="c"><button class="rb" :class="{on: objVal[p.id]===true}" @click="setObj(p.id,true)" :aria-label="soal.label[0]" :aria-pressed="objVal[p.id]===true"></button></td>
                <td class="c"><button class="rb" :class="{on: objVal[p.id]===false}" @click="setObj(p.id,false)" :aria-label="soal.label[1]" :aria-pressed="objVal[p.id]===false"></button></td>
              </tr></tbody>
            </table>

            <div v-if="soal.tipe==='jodoh'">
              <div class="kanan-box">
                <div class="kb-judul">Pilihan pasangan</div>
                <div class="kb-item" v-for="(r,i) in soal.kanan" :key="r.id"><span class="kb-h">{{ hurufKanan(i) }}</span><span v-html="fmt(r.teks)" v-math></span></div>
              </div>
              <div class="jodoh-row" v-for="k in soal.kiri" :key="k.id">
                <div v-html="fmt(k.teks)" v-math></div>
                <select :class="{ada: objVal[k.id]}" :value="objVal[k.id]||''" @change="setObj(k.id,$event.target.value)"><option value="">— pilih —</option><option v-for="(r,i) in soal.kanan" :key="r.id" :value="r.id">{{ hurufKanan(i) }}. {{ polos(r.teks) }}</option></select>
              </div>
            </div>

            <input v-if="soal.tipe==='isian'" class="isian" :value="jawabSaat||''" @input="setJawab($event.target.value)" placeholder="Ketik jawaban di sini" autocomplete="off" autocorrect="off" spellcheck="false" @paste.prevent>

            <div v-if="soal.tipe==='urut'">
              <div class="urut-row" v-for="(id,i) in urutan" :key="id">
                <span class="n">{{ i+1 }}</span><span class="t" v-html="fmt(opsiById(id).teks)" v-math></span>
                <button :disabled="i===0" @click="geser(i,-1)" aria-label="Naikkan">↑</button>
                <button :disabled="i===urutan.length-1" @click="geser(i,1)" aria-label="Turunkan">↓</button>
              </div>
              <button v-if="!Array.isArray(jawabSaat)" class="btn btn-lembut btn-sm" @click="setJawab([...urutan])">Urutan ini sudah benar</button>
            </div>

            <template v-if="soal.tipe==='uraian'">
              <textarea class="uraian" :value="jawabSaat||''" @input="setJawab($event.target.value.slice(0,3000))" placeholder="Tulis jawaban Anda di sini" autocomplete="off" @paste.prevent></textarea>
              <div class="sisa-char">{{ (jawabSaat||'').length }}/3000 karakter</div>
            </template>
          </div>
        </div>
      </section>

      <div class="scrim" :class="{buka: ljkBuka}" @click="ljkBuka=false"></div>
      <aside class="ljk" :class="{buka: ljkBuka}" aria-label="Lembar jawaban">
        <div class="pegangan"></div>
        <h3>Lembar jawaban <span>{{ jmlTerjawab }}/{{ uj.soal.length }} terjawab</span></h3>
        <div class="ljk-grid">
          <button v-for="(s,i) in uj.soal" :key="s.id" class="bub" :class="{isi: terjawab(s) && !ragu(s.id), ragu: ragu(s.id), aktif: i===idx}" @click="ke(i)" :aria-label="'Soal ' + (i+1)">{{ i+1 }}</button>
        </div>
        <div class="legend"><span><i class="isi"></i>Sudah dijawab</span><span><i class="ragu"></i>Ragu-ragu</span><span><i></i>Belum</span></div>
        <button v-if="kunciKirim <= 0" class="btn btn-selesai btn-block" @click="bukaSelesai">Selesai ujian</button>
        <p v-else class="small muted tunggu-selesai" style="margin:6px 0 0;text-align:center">Tombol Selesai muncul {{ kunciKirimTeks }} lagi</p>
        <div class="sync" :class="{off: sync==='offline', proses: sync==='proses'}"><i></i>{{ syncTeks }}</div>
      </aside>
    </div>
    <div class="uj-foot"><div class="isi">
      <button class="btn" @click="ke(idx-1)" :disabled="idx===0" aria-label="Soal sebelumnya">‹ <span class="lbl">Sebelumnya</span></button>
      <button class="ragu-btn" :class="{on: ragu(soal.id)}" @click="toggleRagu"><span class="kotak">{{ ragu(soal.id) ? '✓' : '' }}</span>Ragu-ragu</button>
      <button v-if="idx < uj.soal.length-1" class="btn btn-primary" @click="ke(idx+1)" aria-label="Soal berikutnya"><span class="lbl">Berikutnya</span> ›</button>
      <button v-else class="btn btn-selesai" @click="bukaSelesai" :style="kunciKirim > 0 ? 'visibility:hidden' : ''" :aria-hidden="kunciKirim > 0">Selesai</button>
    </div></div>

    <div class="zoom" v-if="zoom" @click="zoom=''"><img :src="zoom" alt="Gambar diperbesar"></div>

    <div class="modal-bg" v-if="dlg==='selesai'" @click.self="dlg=''">
      <div class="modal">
        <h2>Selesaikan ujian?</h2>
        <p>Anda menjawab <b>{{ jmlTerjawab }}</b> dari {{ uj.soal.length }} soal.</p>
        <template v-if="belumNo.length"><p class="small" style="margin-bottom:2px"><b>Belum dijawab:</b></p><div class="daftar-no"><button v-for="n in belumNo" :key="n" @click="ke(n-1);dlg=''">{{ n }}</button></div></template>
        <template v-if="raguNo.length"><p class="small" style="margin-bottom:2px"><b>Masih ragu-ragu:</b></p><div class="daftar-no"><button v-for="n in raguNo" :key="n" class="ragu" @click="ke(n-1);dlg=''">{{ n }}</button></div></template>
        <p class="small muted">Setelah dikirim, jawaban tidak bisa diubah.</p>
        <label class="check"><input type="checkbox" v-model="yakin"><span>Saya yakin dan ingin mengirim jawaban sekarang</span></label>
        <div class="aksi"><button class="btn" @click="dlg=''">Periksa lagi</button><button class="btn btn-selesai" :disabled="!yakin || kunciKirim > 0" @click="kirim('')">Kirim jawaban</button></div>
      </div>
    </div>
    <div class="modal-bg" v-if="dlg==='langgar'">
      <div class="modal peringatan">
        <h2>Anda keluar dari halaman ujian</h2>
        <p>Kejadian ini tercatat <b>{{ pelanggaran }}</b> kali<template v-if="uj.ujian.maxPelanggaran"> dari batas {{ uj.ujian.maxPelanggaran }}. Jika mencapai batas, jawaban Anda dikirim otomatis</template>.</p>
        <p class="small muted">Tetap di halaman ini sampai selesai mengerjakan.</p>
        <div class="aksi"><button class="btn btn-primary" @click="dlg='';layarPenuh()">Lanjutkan mengerjakan</button></div>
      </div>
    </div>
    <div class="modal-bg" v-if="dlg==='kirim'">
      <div class="modal">
        <h2>{{ alasanKirim ? alasanKirim : 'Mengirim jawaban' }}</h2>
        <p v-if="!gagalKirim">Mengirim jawaban ke server… Jangan tutup halaman ini.</p>
        <template v-else><p>Jawaban belum terkirim karena tidak ada internet. Jawaban Anda aman tersimpan di perangkat ini dan dikirim otomatis begitu internet menyala.</p>
          <div class="aksi"><button class="btn btn-selesai" @click="kirim(alasanKirim)">Coba kirim lagi</button></div></template>
      </div>
    </div>
  </div>

  <!-- SELESAI -->
  <template v-else-if="layar==='selesai'">
    <header class="kepala"><div class="isi">
      <div class="merek"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><b>{{ sekolah.namaSekolah || 'Ujian CBT' }}</b></div>

        if (this.wsBuka && Sok.terbuka()) {
          try { r = await this.selesaiWs(alasan); }
          catch (e) { if (e.code && e.code !== 'NET' && e.code !== 'BUSY') throw e; r = null; }
        }
        // koneksi sempat putus → buka 1 koneksi baru khusus untuk mengirim jawaban akhir
        if (!r) r = await api('selesaiUjian', { ...this.dataSync(), alasan: alasan ? alasan.toLowerCase() : '' }, { retry: 3, maksJeda: 15000 });
        this.akhiri({ ...r, nama: this.uj.ujian.nama, alasan: alasan ? alasan.toLowerCase() : '' });
      } catch (e) {
        if (e.code === 'PERANGKAT') { AppUjian.buka(); this.putus(); this.lepasPenjaga(); this.hapusPaketIni(); this.toast(e.message, 'err', 8000); this.keDaftar(); }
        else if (e.code === 'DIRESET') this.direset();
        else if (e.code === 'BELUM_WAKTU') { this.dlg = ''; this.toast(e.message, 'err', 6000); }
        else if (e.code === 'AUTH') {   // sesi login kedaluwarsa: masuk lagi, jawaban tetap di perangkat lalu dikirim
          this.lepasPenjaga(); this.uj = null; this.dlg = ''; this.bersihSesi(); this.layar = 'login';
          this.err = 'Sesi berakhir. Masuk lagi untuk mengirim jawaban yang tersimpan di perangkat ini.';
        }
        else { this.gagalKirim = true; this.terakhirCoba = this.tik; }
      } finally { this.mengirim = false; }
    },
    akhiri(hasil) {
      if (this.layar !== 'ujian' && !this.uj) return;
      this.putus();
      this.lepasPenjaga();
      this.hapusPaketIni();
      try { localStorage.removeItem(this.kunciLokal); } catch (e) {}
      if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
      AppUjian.buka();   // jawaban sudah diterima server → aplikasi tidak terkunci lagi
      this.hasil = { ...hasil, uid: this.uj ? this.uj.ujian.id : '' }; this.dlg = ''; this.uj = null; this.layar = 'selesai';
    }
  }
});
app.directive('math', { mounted: el => renderMath(el), updated: el => renderMath(el) });
app.directive('focus', { mounted: el => setTimeout(() => el.focus(), 30) });
app.mount('#app');
</script>
