ius:9px;border:1.5px solid #e2c55a;background:#fff;cursor:pointer;font-weight:700;margin:0 auto}.ragu-btn .kotak{width:20px;height:20px;border-radius:5px;border:2px solid #c9a300;display:grid;place-items:center;font-size:13px;line-height:1}.ragu-btn.on{background:var(--stabilo);border-color:#c9a300}.ragu-btn.on .kotak{background:var(--grafit);border-color:var(--grafit);color:#fff}.ljk{background:#fff;border:1.5px solid var(--tinta);border-radius:12px;padding:14px 14px 16px;position:sticky;top:76px;align-self:start}.ljk h3{font-size:14px;color:var(--tinta);display:flex;justify-content:space-between;align-items:baseline}.ljk h3 span{color:var(--teks-2);font-weight:600;font-size:12.5px}.ljk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 6px;justify-items:center;margin:14px 0;max-height:52vh;overflow:auto;padding:4px}.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--teks-2);margin-bottom:12px}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--tinta);vertical-align:-2px;margin-right:5px}.legend i.isi{background:var(--grafit);border-color:var(--grafit)}.legend i.ragu{background:var(--stabilo);border-color:#c9a300}.sync{font-size:12px;color:var(--teks-2);margin-top:10px;display:flex;gap:6px;align-items:center}.sync i{width:8px;height:8px;border-radius:50%;background:#33a06f;display:inline-block}.sync.off i{background:var(--merah)}.sync.proses i{background:var(--stabilo)}.scrim{display:none}.modal-bg{position:fixed;inset:0;background:rgba(30,34,39,.6);display:grid;place-items:center;padding:18px;z-index:60;overflow:auto}.modal{background:#fff;border-radius:14px;width:100%;max-width:460px;padding:22px 22px 18px}.modal h2{font-size:19px;margin-bottom:8px}.modal p{margin-bottom:12px}.modal .aksi{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.daftar-no{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}.daftar-no button{min-width:36px;height:32px;border-radius:7px;border:1px solid var(--garis);background:#fff;cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums}.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin-top:6px}.check input{width:20px;height:20px;accent-color:var(--grafit);margin-top:1px}.peringatan h2{color:var(--merah)}.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:70;padding:12px}.zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}.fs-banner{background:var(--stabilo-muda);border-bottom:1px solid #efd98a;padding:8px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:center}.selesai-box{max-width:460px;margin:8vh auto;background:#fff;border-radius:14px;padding:30px 28px;text-align:center;border:1px solid var(--garis)}.selesai-box .centang{width:64px;height:64px;border-radius:50%;background:var(--grafit);margin:0 auto 16px;display:grid;place-items:center}.selesai-box h1{font-size:22px;margin-bottom:6px}.nilai{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;margin:16px 0 4px;color:var(--teks)}.toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90;width:max-content;max-width:92vw}.toast{background:var(--grafit);color:#fff;padding:11px 16px;border-radius:9px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.2)}.toast.err{background:var(--merah)}@media (max-width:900px){.uj-main{grid-template-columns:1fr;padding:12px 10px 110px}.btn-daftar{display:inline-flex;align-items:center}.ljk{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:50;border-radius:16px 16px 0 0;border-width:2px 0 0;transform:translateY(105%);transition:transform .2s;max-height:80vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}.ljk.buka{transform:none}.scrim.buka{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}.kertas:before{left:16px}.kertas-body{padding:16px 14px 22px 30px}.uj-top .judul span{display:none}.uj-top>.mark{display:none}.timer{min-width:88px;padding:3px 8px}.timer b{font-size:18px}.uj-foot .lbl{display:none}}@media (prefers-reduced-motion:reduce){.ljk{transition:none}}</style> </head> <body> <div id="app" v-cloak></div> <script type="text/x-template" id="t-root"> <!-- LOGIN -->
  <div class="login" v-if="layar==='login'">
    <div class="lembar">
      <div class="lembar-head">
        <div><span class="mark"><i></i><i class="on"></i><i></i><i></i></span><b>{{ sekolah.namaSekolah || 'Ujian CBT' }}</b><span>Masuk untuk mengerjakan ujian</span></div>
      </div>
      <form class="lembar-body" @submit.prevent="masuk">
        <p class="muted">Gunakan NIS dan kata sandi dari kartu login. Kata sandi awal sama dengan NIS.</p>
        <div class="err" v-if="err">{{ err }}</div>
        <label class="field"><span>NIS</span><input v-model.trim="f.nis" inputmode="text" autocomplete="username" autocapitalize="none" required></label>
        <label class="field"><span>Kata sandi</span><input type="password" v-model="f.pw" autocomplete="current-password" required></label>
        <button class="btn btn-primary btn-block" :disabled="sibuk">{{ sibuk ? 'Memeriksa…' : 'Masuk' }}</button>
        <p class="small muted" style="margin-top:14px" v-if="!apiSiap">Alamat server belum diatur (API_URL).</p>
        <button type="button" class="btn btn-block" style="margin-top:10px" v-if="app" @click="mintaKeluarApp">Tutup aplikasi</button>
      </form>
    </div>
  </div>

  <!-- DAFTAR UJIAN -->
  <template v-else-if="layar==='daftar'">
    <div class="bar-atas">
      <span class="mark"><i></i><i class="on"></i><i></i></span>
      <b>{{ sekolah.namaSekolah }}</b>
      <div class="who"><b>{{ user.nama }}</b>{{ user.nis }} · {{ user.kelas }}</div>
      <button class="btn" @click="keluar">Keluar</button>
      <button class="btn" v-if="app" @click="mintaKeluarApp">Tutup aplikasi</button>
    </div>
    <div class="wadah">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap">
        <div><h1>Ujian Anda</h1><p class="muted">Ujian untuk kelas {{ user.kelas }}. Daftar diperbarui otomatis.</p></div>
        <button class="btn btn-sm" @click="muatDaftar()">Segarkan</button>
      </div>
      <div class="err" v-if="err" style="margin-top:14px">{{ err }}</div>
      <div v-if="!daftar" class="kosong">Memuat…</div>
      <div v-else-if="!daftar.length" class="kosong"><b>Tidak ada ujian hari ini</b>Belum ada ujian yang dijadwalkan untuk kelas Anda pada hari ini.</div>
      <div class="kartu" v-for="u in daftar" :key="u.id">
        <div class="info">
          <div class="mapel">{{ u.mapel }}</div>
          <h3>{{ u.nama }}</h3>
          <div class="waktu">{{ fmtHari(u.mulai) }}, {{ fmtJam(u.mulai) }}–{{ fmtJam(u.selesai) }} · {{ u.durasi }} menit · {{ u.jumlahSoal }} soal</div>
        </div>
        <template v-if="u.status==='selesai'"><span class="chip chip-hijau">Selesai<template v-if="u.nilai!==undefined"> · nilai {{ u.nilai }}<template v-if="u.perluKoreksi">*</template></template></span></template>
        <button v-else-if="u.status==='mengerjakan'" class="btn btn-tinta" @click="pilih(u)">Lanjutkan</button>
        <template v-else-if="u.jadwal==='berlangsung'"><button class="btn btn-primary" @click="pilih(u)">Mulai</button></template>
        <span v-else-if="u.jadwal==='akan'" class="chip chip-abu">Dibuka {{ hitungMundur(u.mulai) }}</span>
        <span v-else class="chip chip-abu">Ditutup</span>
      </div>
      <p class="small muted" style="margin-top:16px" v-if="daftar && daftar.some(u=>u.perluKoreksi)">* Nilai sementara, soal uraian masih dikoreksi guru.</p>
    </div>
  </template>

  <!-- KONFIRMASI -->
  <template v-else-if="layar==='konfirmasi'">
    <div class="bar-atas"><span class="mark"><i></i><i class="on"></i><i></i></span><b>Konfirmasi ujian</b></div>
    <div class="wadah" style="max-width:520px">
      <div class="lembar" style="max-width:none;border:1px solid var(--garis)">
        <div class="lembar-head"><div><span>{{ pilihan.mapel }}</span><b style="margin-top:2px">{{ pilihan.nama }}</b></div></div>
        <form class="lembar-body" @submit.prevent="mulai(false)">
          <table class="tbl-data"><tbody>
            <tr><td>Nama</td><td>{{ user.nama }}</td></tr>
            <tr><td>NIS / kelas</td><td>{{ user.nis }} / {{ user.kelas }}</td></tr>
            <tr><td>Jumlah soal</td><td>{{ pilihan.jumlahSoal }}</td></tr>
            <tr><td>Waktu pengerjaan</td><td>{{ pilihan.durasi }} menit</td></tr>
            <tr><td>Ditutup pukul</td><td>{{ fmtJam(pilihan.selesai) }}</td></tr>
          </tbody></table>
          <div class="aturan">
            <b>Sebelum mulai</b>
            <ul>
              <li>Waktu berjalan sejak tombol mulai ditekan dan tidak berhenti meski halaman ditutup.</li>
              <li>Jangan keluar dari halaman ini atau membuka aplikasi lain. Setiap kali keluar akan dicatat.</li>
              <li>Jawaban tersimpan otomatis di perangkat ini. Jika koneksi putus, lanjutkan saja: jawaban dikirim saat Anda menekan <b>Selesai</b> (pastikan internet menyala saat itu).</li>
              <li v-if="app">Aplikasi <b>terkunci</b> setelah Anda menekan <b>Mulai mengerjakan</b> dan terbuka lagi setelah jawaban terkirim. Untuk keluar lebih awal, minta <b>token keluar</b> kepada pengawas.</li>
            </ul>
            <p v-if="pilihan.wajibApp && !app" style="margin-top:8px;color:var(--merah,#B3261E)"><b>Ujian ini wajib dikerjakan lewat aplikasi CBT Ujian (Android/Windows).</b></p>
            <p v-if="pilihan.keterangan" style="margin-top:8px"><b>Pesan pengawas:</b> {{ pilihan.keterangan }}</p>
          </div>
          <div class="err" v-if="err">{{ err }}</div>
          <label class="field" v-if="pilihan.pakaiToken"><span>Token ujian</span><input class="token-in" v-model.trim="tokenUjian" maxlength="6" autocomplete="off" autocapitalize="characters" required placeholder="••••••"><small class="muted">Token dibacakan oleh pengawas.</small></label>
          <div style="display:flex;gap:10px">
            <button type="button" class="btn" @click="layar='daftar';err=''">Kembali</button>
            <button class="btn btn-primary" style="flex:1" :disabled="sibuk">{{ sibuk ? 'Menyiapkan soal…' : (pilihan.status==='mengerjakan' ? 'Lanjutkan mengerjakan' : 'Mulai mengerjakan') }}</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- UJIAN -->
  <div class="uj" v-else-if="layar==='ujian'" @contextmenu.prevent @copy.prevent @cut.prevent>
    <div class="uj-top">
      <span class="mark" style="color:#fff"><i></i><i class="on"></i><i></i></span>
      <div class="judul"><b>{{ uj.ujian.nama }}</b><span>{{ user.nama }} · {{ user.nis }}</span></div>
      <div class="timer" :class="{kuning: sisaDetik<=600 && sisaDetik>300, merah: sisaDetik<=300}" role="timer" aria-live="off">
        <small>Sisa waktu</small><b>{{ sisaTeks }}</b>
      </div>
      <button class="btn-daftar" @click="ljkBuka=true">Daftar soal</button>
      <button class="btn-keluar-app" v-if="app" @click="mintaKeluarApp" aria-label="Keluar aplikasi" title="Keluar aplikasi (perlu token keluar)">⏻</button>
    </div>
    <div class="fs-banner" v-if="perluFullscreen"><span>Mode layar penuh tertutup.</span><button class="btn btn-sm" @click="layarPenuh">Kembali ke layar penuh</button></div>
    <div class="uj-main">
      <section class="kertas">
        <div class="kertas-head">
          <span class="no-soal">{{ idx+1 }}</span>
          <div class="ket"><b>Soal {{ idx+1 }} dari {{ uj.soal.length }}</b><span>{{ namaTipe(soal.tipe) }}<template v-if="soal.bobot!==1"> · bobot {{ soal.bobot }}</template></span></div>
          <div class="fs" aria-label="Ukuran huruf">
            <button v-for="(z,i) in [16,18,21]" :key="z" :class="{on: fz===z}" @click="setFz(z)" :aria-label="'Ukuran huruf ' + (i+1)" :style="{fontSize: (12+i*2)+'px'}">A</button>
          </div>
        </div>
        <div class="kertas-body">
          <div class="soal" :style="{'--fz': fz+'px'}" :key="soal.id">
            <div class="stim" v-if="soal.stimulus" v-html="fmt(soal.stimulus)" v-math></div>
            <div class="teks" v-html="fmt(soal.teks)" v-math></div>
            <div class="gbr" v-if="soal.gambar && soal.gambar.length"><img v-for="g in soal.gambar" :key="g" :src="g" alt="Gambar soal" @click="zoom=g"></div>
            <div class="petunjuk">{{ petunjuk(soal.tipe) }}</div>

            <template v-if="soal.tipe==='pg' || soal.tipe==='pgk'">
              <button v-for="(o,i) in soal.opsi" :key="o.id" class="opsi" :class="{pilih: dipilih(o.id)}" @click="pilihOpsi(o.id)" :aria-pressed="dipilih(o.id)">
                <span class="bub" :class="{isi: dipilih(o.id), kotak: soal.tipe==='pgk'}">{{ huruf(i) }}</span>
                <span class="t"><span v-html="fmt(o.teks)" v-math></span><img v-if="o.gambar" :src="o.gambar" alt="" @click.stop="zoom=o.gambar"></span>
              </button>
            </template>

            <table class="tbl-bs" v-if="soal.tipe==='bs'">
              <thead><tr><th>Pernyataan</th><th>{{ soal.label[0] }}</th><th>{{ soal.label[1] }}</th></tr></thead>
              <tbody><tr v-for="p in soal.pernyataan" :key="p.id">
                <td v-html="fmt(p.teks)" v-math></td>
                <td class="c"><button class="rb" :class="{on: objVal[p.id]===true}" @click="setObj(p.id,true)" :aria-label="soal.label[0]" :aria-pressed="objVal[p.id]===true"></button></td>
                <td class="c"><button class="rb" :class="{on: objVal[p.id]===false}" @click="setObj(p.id,false)" :aria-label="soal.label[1]" :aria-pressed="objVal[p.id]===false"></button></td>
              </tr></tbody>
            </table>

            <div v-if="soal.tipe==='jodoh'">
              <div class="kanan-box">
                <div class="kb-judul">Pilihan pasangan</div>
                <div class="kb-item" v-for="(r,i) in soal.kanan" :key="r.id"><span class="kb-h">{{ hurufKanan(i) }}</span><span v-html="fmt(r.teks)" v-math></span></div>
              </div>
              <div class="jodoh-row" v-for="k in soal.kiri" :key="k.id">
                <div v-html="fmt(k.teks)" v-math></div>
                <select :class="{ada: objVal[k.id]}" :value="objVal[k.id]||''" @change="setObj(k.id,$event.target.value)"><option value="">— pilih —</option><option v-for="(r,i) in soal.kanan" :key="r.id" :value="r.id">{{ hurufKanan(i) }}. {{ polos(r.teks) }}</option></select>
              </div>
            </div>

            <input v-if="soal.tipe==='isian'" class="isian" :value="jawabSaat||''" @input="setJawab($event.target.value)" placeholder="Ketik jawaban di sini" autocomplete="off" spellcheck="false" @paste.prevent>

            <div v-if="soal.tipe==='urut'">
              <div class="urut-row" v-for="(id,i) in urutan" :key="id">
                <span class="n">{{ i+1 }}</span><span class="t" v-html="fmt(opsiById(id).teks)" v-math></span>
                <button :disabled="i===0" @click="geser(i,-1)" aria-label="Naikkan">↑</button>
                <button :disabled="i===urutan.length-1" @click="geser(i,1)" aria-label="Turunkan">↓</button>
              </div>
              <button v-if="!Array.isArray(jawabSaat)" class="btn btn-sm" style="font-family:var(--font)" @click="setJawab([...urutan])">Urutan ini sudah benar</button>
            </div>

            <template v-if="soal.tipe==='uraian'">
              <textarea class="uraian" :value="jawabSaat||''" @input="setJawab($event.target.value.slice(0,3000))" placeholder="Tulis jawaban Anda di sini" @paste.prevent></textarea>
              <div class="sisa-char">{{ (jawabSaat||'').length }}/3000 karakter</div>
            </template>
          </div>
        </div>
      </section>

      <div class="scrim" :class="{buka: ljkBuka}" @click="ljkBuka=false"></div>
      <aside class="ljk" :class="{buka: ljkBuka}" aria-label="Lembar jawaban">
        <h3>Lembar jawaban <span>{{ jmlTerjawab }}/{{ uj.soal.length }} terjawab</span></h3>
        <div class="ljk-grid">
          <button v-for="(s,i) in uj.soal" :key="s.id" class="bub" :class="{isi: terjawab(s) && !ragu(s.id), ragu: ragu(s.id), aktif: i===idx}" @click="ke(i)" :aria-label="'Soal ' + (i+1)">{{ i+1 }}</button>
        </div>
        <div class="legend"><span><i class="isi"></i>Sudah dijawab</span><span><i class="ragu"></i>Ragu-ragu</span><span><i></i>Belum</span></div>
        <button class="btn btn-tinta btn-block" @click="bukaSelesai">Selesai ujian</button>
        <div class="sync" :class="{off: sync==='offline', proses: sync==='proses'}"><i></i>{{ syncTeks }}</div>
      </aside>
    </div>
    <div class="uj-foot"><div class="isi">
      <button class="btn" @click="ke(idx-1)" :disabled="idx===0">‹ <span class="lbl">Sebelumnya</span></button>
      <button class="ragu-btn" :class="{on: ragu(soal.id)}" @click="toggleRagu"><span class="kotak">{{ ragu(soal.id) ? '✓' : '' }}</span>Ragu-ragu</button>
      <button v-if="idx < uj.soal.length-1" class="btn btn-primary" @click="ke(idx+1)"><span class="lbl">Berikutnya</span> ›</button>
      <button v-else class="btn btn-tinta" @click="bukaSelesai">Selesai</button>
    </div></div>

    <div class="zoom" v-if="zoom" @click="zoom=''"><img :src="zoom" alt="Gambar diperbesar"></div>

    <div class="modal-bg" v-if="dlg==='selesai'" @click.self="dlg=''">
      <div class="modal">
        <h2>Selesaikan ujian?</h2>
        <p>Anda menjawab <b>{{ jmlTerjawab }}</b> dari {{ uj.soal.length }} soal.</p>
        <template v-if="belumNo.length"><p class="small" style="margin-bottom:2px"><b>Belum dijawab:</b></p><div class="daftar-no"><button v-for="n in belumNo" :key="n" @click="ke(n-1);dlg=''">{{ n }}</button></div></template>
        <template v-if="raguNo.length"><p class="small" style="margin-bottom:2px"><b>Masih ragu-ragu:</b></p><div class="daftar-no"><button v-for="n in raguNo" :key="n" style="background:var(--stabilo-muda)" @click="ke(n-1);dlg=''">{{ n }}</button></div></template>
        <p class="small muted">Setelah dikirim, jawaban tidak bisa diubah.</p>
        <label class="check"><input type="checkbox" v-model="yakin"><span>Saya yakin dan ingin mengirim jawaban sekarang</span></label>
        <div class="aksi"><button class="btn" @click="dlg=''">Periksa lagi</button><button class="btn btn-tinta" :disabled="!yakin" @click="kirim('')">Kirim jawaban</button></div>
      </div>
    </div>
    <div class="modal-bg" v-if="dlg==='langgar'">
      <div class="modal peringatan">
        <h2>Anda keluar dari halaman ujian</h2>
        <p>Kejadian ini tercatat <b>{{ pelanggaran }}</b> kali<template v-if="uj.ujian.maxPelanggaran"> dari batas {{ uj.ujian.maxPelanggaran }}. Jika mencapai batas, jawaban Anda dikirim otomatis</template>.</p>
        <p class="small muted">Tetap di halaman ini sampai selesai mengerjakan.</p>
        <div class="aksi"><button class="btn btn-primary" @click="dlg='';layarPenuh()">Lanjutkan mengerjakan</button></div>
      </div>
    </div>
    <div class="modal-bg" v-if="dlg==='kirim'">
      <div class="modal">
        <h2>{{ alasanKirim ? alasanKirim : 'Mengirim jawaban' }}</h2>
        <p v-if="!gagalKirim">Mengirim jawaban ke server… Jangan tutup halaman ini.</p>
        <template v-else><p>Jawaban belum terkirim karena tidak ada internet. Jawaban Anda aman tersimpan di perangkat ini dan dikirim otomatis begitu internet menyala. Jangan hapus data browser.</p>
          <div class="aksi"><button class="btn btn-tinta" @click="kirim(alasanKirim)">Coba kirim lagi</button></div></template>
      </div>
    </div>
  </div>

  <!-- SELESAI -->
  <template v-else-if="layar==='selesai'">
    <div class="bar-atas"><span class="mark"><i></i><i class="on"></i><i></i></span><b>{{ sekolah.namaSekolah }}</b></div>
    <div class="wadah">
      <div class="selesai-box">
        <div class="centang"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
        <h1>Jawaban terkirim</h1>
        <p class="muted">{{ hasil.nama }}<br>dikirim pukul {{ fmtJam(hasil.selesai) }}<template v-if="hasil.alasan"> ({{ hasil.alasan }})</template></p>
        <template v-if="hasil.nilai!==undefined">
          <div class="nilai">{{ hasil.nilai }}</div>
          <p class="muted">{{ hasil.benar }} dari {{ hasil.jumlahSoal }} soal dijawab benar penuh.<template v-if="hasil.perluKoreksi"><br>Nilai masih sementara: {{ hasil.perluKoreksi }} soal uraian akan dikoreksi guru.</template></p>
        </template>
        <p v-else class="muted" style="margin-top:12px">Nilai akan diumumkan oleh guru.</p>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap">
          <button class="btn btn-primary" @click="keDaftar">Kembali ke daftar ujian</button>
          <button class="btn" @click="keluar">Keluar</button>
          <button class="btn" v-if="app" @click="mintaKeluarApp">Tutup aplikasi</button>
        </div>
      </div>
    </div>
  </template>

  <div class="modal-bg" v-if="dlgApp" @click.self="dlgApp=false">
    <form class="modal" @submit.prevent="konfirmasiKeluarApp">
      <template v-if="layar==='ujian' && uj">
        <h2>Keluar dari aplikasi ujian</h2>
        <p>Ujian masih berlangsung. Keluar hanya bisa dengan <b>token keluar</b> dari pengawas. Jawaban Anda tetap tersimpan di perangkat dan ujian dilanjutkan saat aplikasi dibuka lagi.</p>
        <label class="field"><span>Token keluar</span><input class="token-in" v-model.trim="keluarToken" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="••••••" v-focus></label>
        <div class="err" v-if="keluarErr">{{ keluarErr }}</div>
      </template>
      <template v-else><h2>Tutup aplikasi?</h2><p>Aplikasi CBT Ujian akan ditutup.</p></template>
      <div class="aksi"><button type="button" class="btn" @click="dlgApp=false">Batal</button><button class="btn btn-tinta" :disabled="keluarSibuk">{{ keluarSibuk ? 'Memeriksa…' : 'Keluar' }}</button></div>
    </form>
  </div>
