      <div class="merek"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><b>{{ sekolah.namaSekolah || 'Ujian CBT' }}</b></div>
      <h1>Masuk ujian</h1>
      <p class="muted">Gunakan NIS dan kata sandi dari kartu login. Kata sandi awal sama dengan NIS.</p>
      <form @submit.prevent="masuk" :autocomplete="app ? 'off' : 'on'">
        <div class="err" v-if="err">{{ err }}</div>
        <label class="field"><span>NIS</span><input v-model.trim="f.nis" inputmode="text" :autocomplete="app ? 'off' : 'username'" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
        <label class="field"><span>Kata sandi</span><span class="sandi-wrap"><input :type="(app || lihatPw) ? 'text' : 'password'" :class="{sandi: app && !lihatPw}" v-model="f.pw" :autocomplete="app ? 'off' : 'current-password'" autocapitalize="none" autocorrect="off" spellcheck="false" required><button type="button" class="mata" @click.prevent="lihatPw = !lihatPw" :aria-pressed="lihatPw" :aria-label="lihatPw ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi'" :title="lihatPw ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><template v-if="lihatPw"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-2.6 3.5M6.6 6.6C4 8.3 2.5 12 2.5 12s3.5 7 9.5 7c1.8 0 3.4-.6 4.7-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></template><template v-else><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></template></svg></button></span></label>
        <button class="btn btn-primary btn-block" :disabled="sibuk">{{ sibuk ? 'Memeriksa…' : 'Masuk' }}</button>
        <p class="small muted" style="margin-top:14px" v-if="!apiSiap">Alamat server belum diatur (API_URL).</p>
      </form>
      <button type="button" class="btn btn-ghost btn-block" style="margin-top:8px" v-if="app" @click="mintaKeluarApp">Tutup aplikasi</button>
    </div>
  </div>

  <!-- DAFTAR UJIAN -->
  <template v-else-if="layar==='daftar'">
    <header class="kepala"><div class="isi">
      <div class="merek"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><b>{{ sekolah.namaSekolah || 'Ujian CBT' }}</b></div>
      <button class="btn btn-sm btn-keluar" @click="keluar" aria-label="Keluar akun"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M14 8l4 4-4 4"/><path d="M18 12H9"/></svg>Keluar</button>
    </div></header>
    <div class="wadah">
      <div class="profil">
        <span class="avatar">{{ inisial }}</span>
        <div class="who"><b>{{ user.nama }}</b><span>NIS {{ user.nis }} · Kelas {{ user.kelas }}</span></div>
      </div>
      <div class="judul-bagian">
        <div><h1>Ujian hari ini</h1><p>Daftar diperbarui otomatis.</p></div>
        <button class="btn btn-lembut btn-sm" @click="muatDaftar()">Segarkan</button>
      </div>
      <div class="err" v-if="err" style="margin-top:14px">{{ err }}</div>
      <div v-if="!daftar" class="kosong">Memuat…</div>
      <div v-else-if="!daftar.length" class="kosong"><b>Tidak ada ujian hari ini</b>Belum ada ujian yang dijadwalkan untuk kelas Anda.</div>
      <div class="kartu" v-for="u in daftar" :key="u.id">
        <div class="info">
          <div class="mapel">{{ u.mapel }}</div>
          <h3>{{ u.nama }}</h3>
          <div class="waktu"><span>{{ fmtHari(u.mulai) }}, {{ fmtJam(u.mulai) }}–{{ fmtJam(u.selesai) }}</span><span>{{ u.durasi }} menit · {{ u.jumlahSoal }} soal</span></div>
        </div>
        <div class="aksi-kartu">
          <span v-if="u.status==='selesai'" class="chip chip-hijau">Selesai<template v-if="u.nilai!==undefined"> · nilai {{ u.nilai }}<template v-if="u.perluKoreksi">*</template></template></span>
          <button v-else-if="u.status==='mengerjakan'" class="btn btn-selesai" @click="pilih(u)">Lanjutkan</button>
          <button v-else-if="u.jadwal==='berlangsung'" class="btn btn-primary" @click="pilih(u)">Mulai</button>
          <span v-else-if="u.jadwal==='akan'" class="chip chip-abu">Dibuka {{ hitungMundur(u.mulai) }}</span>
          <span v-else class="chip chip-abu">Ditutup</span>
        </div>
      </div>
      <p class="small muted" style="margin-top:16px" v-if="daftar && daftar.some(u=>u.perluKoreksi)">* Nilai sementara, soal uraian masih dikoreksi guru.</p>
      <div class="bawah" v-if="app"><button class="btn btn-ghost btn-sm" @click="mintaKeluarApp">Tutup aplikasi</button></div>
    </div>
  </template>

  <!-- KONFIRMASI -->
  <template v-else-if="layar==='konfirmasi'">
    <header class="kepala"><div class="isi">
      <div class="merek"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><b>Konfirmasi ujian</b></div>
    </div></header>
    <div class="wadah" style="max-width:540px">
      <div class="panel">
        <div class="panel-kepala"><span>{{ pilihan.mapel }}</span><h2>{{ pilihan.nama }}</h2></div>
        <form class="panel-isi" @submit.prevent="mulai(false)" autocomplete="off">
          <table class="tbl-data"><tbody>
            <tr><td>Nama</td><td>{{ user.nama }}</td></tr>
            <tr><td>NIS / kelas</td><td>{{ user.nis }} / {{ user.kelas }}</td></tr>
            <tr><td>Jumlah soal</td><td>{{ pilihan.jumlahSoal }}</td></tr>
            <tr><td>Waktu pengerjaan</td><td>{{ pilihan.durasi }} menit</td></tr>
            <tr><td>Ditutup pukul</td><td>{{ fmtJam(pilihan.selesai) }}</td></tr>
          </tbody></table>
          <div class="aturan">
            <b>Sebelum mulai</b>
            <ul>
              <li>Waktu berjalan sejak tombol mulai ditekan dan tidak berhenti meski halaman ditutup.</li>
              <li>Jangan keluar dari halaman ini atau membuka aplikasi lain. Setiap kali keluar akan dicatat.</li>
              <li>Jawaban tersimpan otomatis di perangkat ini. Jika koneksi putus, lanjutkan saja: jawaban dikirim saat Anda menekan <b>Selesai</b>.</li>
              <li v-if="app">Aplikasi <b>terkunci</b> setelah Anda menekan <b>Mulai mengerjakan</b> dan baru bisa ditutup setelah jawaban terkirim.</li>
            </ul>
            <p v-if="pilihan.wajibApp && !app" style="margin-top:8px;color:var(--merah)"><b>Ujian ini wajib dikerjakan lewat aplikasi CBT Ujian (Android/Windows).</b></p>
            <p v-if="pilihan.keterangan" style="margin-top:8px"><b>Pesan pengawas:</b> {{ pilihan.keterangan }}</p>
          </div>
          <div class="err" v-if="err">{{ err }}</div>
          <label class="field" v-if="pilihan.pakaiToken"><span>Token ujian</span><input class="token-in" v-model.trim="tokenUjian" maxlength="6" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" required placeholder="••••••"><small class="muted">Token dibacakan oleh pengawas.</small></label>
          <div class="tombol-baris">
            <button type="button" class="btn" @click="layar='daftar';err=''">Kembali</button>
            <button class="btn btn-primary" :disabled="sibuk">{{ sibuk ? 'Menyiapkan soal…' : (pilihan.status==='mengerjakan' ? 'Lanjutkan mengerjakan' : 'Mulai mengerjakan') }}</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- UJIAN -->
  <div class="uj" v-else-if="layar==='ujian'" @contextmenu.prevent @copy.prevent @cut.prevent>
    <header class="uj-top"><div class="isi">
      <div class="judul"><b>{{ uj.ujian.nama }}</b><span>{{ user.nama }} · {{ user.nis }}</span></div>
      <div class="timer" :class="{kuning: sisaDetik<=600 && sisaDetik>300, merah: sisaDetik<=300}" role="timer" aria-live="off">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>
        <span class="t"><small>Sisa waktu</small><b>{{ sisaTeks }}</b></span>
      </div>
      <button class="btn-daftar" @click="ljkBuka=true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>{{ idx+1 }}/{{ uj.soal.length }}<span class="sr">Daftar soal</span></button>
    </div></header>
    <div class="fs-banner" v-if="perluFullscreen"><span>Mode layar penuh tertutup.</span><button class="btn btn-sm" @click="layarPenuh">Kembali ke layar penuh</button></div>
    <div class="uj-main">
      <section class="kertas">
        <div class="kertas-head">
          <span class="no-soal">{{ idx+1 }}</span>
          <div class="ket"><b>Soal {{ idx+1 }} dari {{ uj.soal.length }}</b><span>{{ namaTipe(soal.tipe) }}<template v-if="soal.bobot!==1"> · bobot {{ soal.bobot }}</template></span></div>
          <div class="fs" aria-label="Ukuran huruf">
            <button v-for="(z,i) in [16,18,21]" :key="z" :class="{on: fz===z}" @click="setFz(z)" :aria-label="'Ukuran huruf ' + (i+1)" :style="{fontSize: (12+i*2)+'px'}">A</button>
          </div>
        </div>
        <div class="kertas-body">
          <div class="soal" :style="{'--fz': fz+'px'}" :key="soal.id">
            <div class="stim" v-if="soal.stimulus" v-html="fmt(soal.stimulus)" v-math></div>
            <div class="teks" v-html="fmt(soal.teks)" v-math></div>
            <div class="gbr" v-if="soal.gambar && soal.gambar.length"><img v-for="g in soal.gambar" :key="g" :src="g" alt="Gambar soal" @click="zoom=g"></div>
            <div class="petunjuk">{{ petunjuk(soal.tipe) }}</div>

            <template v-if="soal.tipe==='pg' || soal.tipe==='pgk'">
              <button v-for="(o,i) in soal.opsi" :key="o.id" class="opsi" :class="{pilih: dipilih(o.id)}" @click="pilihOpsi(o.id)" :aria-pressed="dipilih(o.id)">
                <span class="bub" :class="{isi: dipilih(o.id), kotak: soal.tipe==='pgk'}">{{ huruf(i) }}</span>
                <span class="t"><span v-html="fmt(o.teks)" v-math></span><img v-if="o.gambar" :src="o.gambar" alt="" @click.stop="zoom=o.gambar"></span>
              </button>
            </template>

            <table class="tbl-bs" v-if="soal.tipe==='bs'">
              <thead><tr><th>Pernyataan</th><th>{{ soal.label[0] }}</th><th>{{ soal.label[1] }}</th></tr></thead>
              <tbody><tr v-for="p in soal.pernyataan" :key="p.id">
                <td v-html="fmt(p.teks)" v-math></td>
                <td class="c"><button class="rb" :class="{on: objVal[p.id]===true}" @click="setObj(p.id,true)" :aria-label="soal.label[0]" :aria-pressed="objVal[p.id]===true"></button></td>
                <td class="c"><button class="rb" :class="{on: objVal[p.id]===false}" @click="setObj(p.id,false)" :aria-label="soal.label[1]" :aria-pressed="objVal[p.id]===false"></button></td>
              </tr></tbody>
            </table>

            <div v-if="soal.tipe==='jodoh'">
              <div class="kanan-box">
                <div class="kb-judul">Pilihan pasangan</div>
                <div class="kb-item" v-for="(r,i) in soal.kanan" :key="r.id"><span class="kb-h">{{ hurufKanan(i) }}</span><span v-html="fmt(r.teks)" v-math></span></div>
              </div>
              <div class="jodoh-row" v-for="k in soal.kiri" :key="k.id">
                <div v-html="fmt(k.teks)" v-math></div>
                <select :class="{ada: objVal[k.id]}" :value="objVal[k.id]||''" @change="setObj(k.id,$event.target.value)"><option value="">— pilih —</option><option v-for="(r,i) in soal.kanan" :key="r.id" :value="r.id">{{ hurufKanan(i) }}. {{ polos(r.teks) }}</option></select>
              </div>
            </div>

            <input v-if="soal.tipe==='isian'" class="isian" :value="jawabSaat||''" @input="setJawab($event.target.value)" placeholder="Ketik jawaban di sini" autocomplete="off" autocorrect="off" spellcheck="false" @paste.prevent>

            <div v-if="soal.tipe==='urut'">
              <div class="urut-row" v-for="(id,i) in urutan" :key="id">
                <span class="n">{{ i+1 }}</span><span class="t" v-html="fmt(opsiById(id).teks)" v-math></span>
                <button :disabled="i===0" @click="geser(i,-1)" aria-label="Naikkan">↑</button>
                <button :disabled="i===urutan.length-1" @click="geser(i,1)" aria-label="Turunkan">↓</button>
              </div>
              <button v-if="!Array.isArray(jawabSaat)" class="btn btn-lembut btn-sm" @click="setJawab([...urutan])">Urutan ini sudah benar</button>
            </div>

            <template v-if="soal.tipe==='uraian'">
              <textarea class="uraian" :value="jawabSaat||''" @input="setJawab($event.target.value.slice(0,3000))" placeholder="Tulis jawaban Anda di sini" autocomplete="off" @paste.prevent></textarea>
              <div class="sisa-char">{{ (jawabSaat||'').length }}/3000 karakter</div>
            </template>
          </div>
        </div>
      </section>

      <div class="scrim" :class="{buka: ljkBuka}" @click="ljkBuka=false"></div>
      <aside class="ljk" :class="{buka: ljkBuka}" aria-label="Lembar jawaban">
        <div class="pegangan"></div>
        <h3>Lembar jawaban <span>{{ jmlTerjawab }}/{{ uj.soal.length }} terjawab</span></h3>
        <div class="ljk-grid">
          <button v-for="(s,i) in uj.soal" :key="s.id" class="bub" :class="{isi: terjawab(s) && !ragu(s.id), ragu: ragu(s.id), aktif: i===idx}" @click="ke(i)" :aria-label="'Soal ' + (i+1)">{{ i+1 }}</button>
        </div>
        <div class="legend"><span><i class="isi"></i>Sudah dijawab</span><span><i class="ragu"></i>Ragu-ragu</span><span><i></i>Belum</span></div>
        <button v-if="kunciKirim <= 0" class="btn btn-selesai btn-block" @click="bukaSelesai">Selesai ujian</button>
        <p v-else class="small muted tunggu-selesai" style="margin:6px 0 0;text-align:center">Tombol Selesai muncul {{ kunciKirimTeks }} lagi</p>
        <div class="sync" :class="{off: sync==='offline', proses: sync==='proses'}"><i></i>{{ syncTeks }}</div>
      </aside>
    </div>
    <div class="uj-foot"><div class="isi">
      <button class="btn" @click="ke(idx-1)" :disabled="idx===0" aria-label="Soal sebelumnya">‹ <span class="lbl">Sebelumnya</span></button>
      <button class="ragu-btn" :class="{on: ragu(soal.id)}" @click="toggleRagu"><span class="kotak">{{ ragu(soal.id) ? '✓' : '' }}</span>Ragu-ragu</button>
      <button v-if="idx < uj.soal.length-1" class="btn btn-primary" @click="ke(idx+1)" aria-label="Soal berikutnya"><span class="lbl">Berikutnya</span> ›</button>
      <button v-else class="btn btn-selesai" @click="bukaSelesai" :style="kunciKirim > 0 ? 'visibility:hidden' : ''" :aria-hidden="kunciKirim > 0">Selesai</button>
    </div></div>

    <div class="zoom" v-if="zoom" @click="zoom=''"><img :src="zoom" alt="Gambar diperbesar"></div>

    <div class="modal-bg" v-if="dlg==='selesai'" @click.self="dlg=''">
      <div class="modal">
        <h2>Selesaikan ujian?</h2>
        <p>Anda menjawab <b>{{ jmlTerjawab }}</b> dari {{ uj.soal.length }} soal.</p>
        <template v-if="belumNo.length"><p class="small" style="margin-bottom:2px"><b>Belum dijawab:</b></p><div class="daftar-no"><button v-for="n in belumNo" :key="n" @click="ke(n-1);dlg=''">{{ n }}</button></div></template>
        <template v-if="raguNo.length"><p class="small" style="margin-bottom:2px"><b>Masih ragu-ragu:</b></p><div class="daftar-no"><button v-for="n in raguNo" :key="n" class="ragu" @click="ke(n-1);dlg=''">{{ n }}</button></div></template>
        <p class="small muted">Setelah dikirim, jawaban tidak bisa diubah.</p>
        <label class="check"><input type="checkbox" v-model="yakin"><span>Saya yakin dan ingin mengirim jawaban sekarang</span></label>
        <div class="aksi"><button class="btn" @click="dlg=''">Periksa lagi</button><button class="btn btn-selesai" :disabled="!yakin || kunciKirim > 0" @click="kirim('')">Kirim jawaban</button></div>
      </div>
    </div>
    <div class="modal-bg" v-if="dlg==='langgar'">
      <div class="modal peringatan">
        <h2>Anda keluar dari halaman ujian</h2>
        <p>Kejadian ini tercatat <b>{{ pelanggaran }}</b> kali<template v-if="uj.ujian.maxPelanggaran"> dari batas {{ uj.ujian.maxPelanggaran }}. Jika mencapai batas, jawaban Anda dikirim otomatis</template>.</p>
        <p class="small muted">Tetap di halaman ini sampai selesai mengerjakan.</p>
        <div class="aksi"><button class="btn btn-primary" @click="dlg='';layarPenuh()">Lanjutkan mengerjakan</button></div>
      </div>
    </div>
    <div class="modal-bg" v-if="dlg==='kirim'">
      <div class="modal">
        <h2>{{ alasanKirim ? alasanKirim : 'Mengirim jawaban' }}</h2>
        <p v-if="!gagalKirim">Mengirim jawaban ke server… Jangan tutup halaman ini.</p>
        <template v-else><p>Jawaban belum terkirim karena tidak ada internet. Jawaban Anda aman tersimpan di perangkat ini dan dikirim otomatis begitu internet menyala.</p>
          <div class="aksi"><button class="btn btn-selesai" @click="kirim(alasanKirim)">Coba kirim lagi</button></div></template>
      </div>
    </div>
  </div>

  <!-- SELESAI -->
  <template v-else-if="layar==='selesai'">
    <header class="kepala"><div class="isi">
      <div class="merek"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><b>{{ sekolah.namaSekolah || 'Ujian CBT' }}</b></div>
    </div></header>
    <div class="wadah">
      <div class="selesai-box">
        <div class="centang"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#22796A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
        <h1>Jawaban terkirim</h1>
        <p class="muted">{{ hasil.nama }}<br>dikirim pukul {{ fmtJam(hasil.selesai) }}<template v-if="hasil.alasan"> ({{ hasil.alasan }})</template></p>
        <template v-if="hasil.nilai!==undefined">
          <div class="nilai">{{ hasil.nilai }}</div>
          <p class="muted">{{ hasil.benar }} dari {{ hasil.jumlahSoal }} soal dijawab benar penuh.<template v-if="hasil.perluKoreksi"><br>Nilai masih sementara: {{ hasil.perluKoreksi }} soal uraian akan dikoreksi guru.</template></p>
        </template>
        <p v-else class="muted" style="margin-top:12px">Nilai akan diumumkan oleh guru.</p>
        <div class="tombol-selesai">
          <button class="btn btn-primary" @click="keDaftar">Kembali ke daftar ujian</button>
          <button class="btn" @click="keluar">Keluar akun</button>
          <button class="btn btn-ghost" v-if="app" @click="mintaKeluarApp">Tutup aplikasi</button>
        </div>
      </div>
    </div>
  </template>

  <div class="modal-bg" v-if="dlgApp" @click.self="dlgApp=false">
    <div class="modal">
      <h2>Tutup aplikasi?</h2>
      <p class="muted">Aplikasi CBT Ujian akan ditutup.</p>
      <div class="aksi"><button type="button" class="btn" @click="dlgApp=false">Batal</button><button class="btn btn-primary" @click="tutupApp">Tutup</button></div>
