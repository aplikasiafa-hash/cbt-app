      if (iN < 0 || iNm < 0 || iK < 0) { iN = 0; iNm = 1; iK = 2; iP = 3; data = baris; if (norm(baris[0][0]) === 'nis' || norm(baris[0][0]) === 'no') data = baris.slice(1); }
      return data.map(r => ({ nis: String(r[iN] ?? '').trim(), nama: String(r[iNm] ?? '').trim(), kelas: String(r[iK] ?? '').trim(), password: iP >= 0 ? String(r[iP] ?? '').trim() : '' })).filter(r => r.nis && r.nama && r.kelas);
    },
    parseTeks() { const sep = this.imp.teks.includes('\t') ? '\t' : (this.imp.teks.includes(';') ? ';' : ','); this.imp.rows = this.petakan(this.imp.teks.replace(/\r/g, '').split('\n').filter(l => l.trim()).map(l => l.split(sep))); },
    async bacaFile(e) {
      const f = e.target.files[0]; if (!f) return;
      try { const X = await muatXLSX(); const wb = X.read(await f.arrayBuffer(), { type: 'array' }); const ws = wb.Sheets[wb.SheetNames[0]]; this.imp.rows = this.petakan(X.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' })); if (!this.imp.rows.length) toast('Tidak ada data yang terbaca. Pastikan kolom NIS, Nama, Kelas.', 'err'); }
      catch (err) { toast(err.message, 'err'); }
    },
    async impor() {
      if (this.imp.mode === 'ganti' && !await tanya('Ganti semua data siswa?', 'Seluruh data siswa lama akan diganti dengan ' + this.imp.rows.length + ' siswa ini.', { ok: 'Ganti semua', bahaya: true })) return;
      this.sibuk = true;
      try {
        const r = await api('importSiswa', { rows: this.imp.rows, mode: this.imp.mode }, { retry: 2 });
        toast(`${r.baru} siswa baru, ${r.ubah} diperbarui${r.lewati.length ? ', ' + r.lewati.length + ' baris dilewati' : ''}`, 'ok', 6000);
        if (r.config) S.config = r.config;
        this.imp = null; this.muat();
      } catch (e) { toast(e.message, 'err'); } finally { this.sibuk = false; }
    },
    async unduh() {
      // kolom D = Password: isian admin; kosong saat ditambah → sama dengan NIS
      try { const [X, sandi] = await Promise.all([muatXLSX(), api('sandiSiswa')]); const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, X.utils.json_to_sheet(this.tampil.map(s => ({ NIS: s.nis, Nama: s.nama, Kelas: s.kelas, Password: sandi[s.nis] ?? s.nis }))), 'Siswa'); X.writeFile(wb, 'Data_siswa' + (this.fKelas ? '_' + namaFile(this.fKelas) : '') + '.xlsx'); }
      catch (e) { toast(e.message, 'err'); }
    },
    async kartu() {
      const daftar = this.tampil, w = window.open('', '_blank');
      if (!w) return toast('Izinkan pop-up untuk mencetak kartu', 'err');
      w.document.write('<p style="font-family:Arial">Menyiapkan kartu…</p>');
      let sandi = {};
      try { sandi = await api('sandiSiswa'); } catch (e) { w.close(); return toast(e.message, 'err'); }
      w.document.open();
      const sek = esc(S.config.namaSekolah), url = esc(location.href.replace(/\/guru\/?.*$/, '/siswa/'));
      w.document.write(`<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Kartu login CBT</title><style>
        body{font-family:Arial,sans-serif;margin:12mm;color:#222}.g{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
        .k{border:1.4px solid #D23F68;border-radius:3mm;padding:4mm 5mm;break-inside:avoid;font-size:11pt}
        .k h4{margin:0 0 2mm;font-size:11pt}.k p{margin:1mm 0}.k small{color:#666;font-size:8.5pt}
        .k b{font-family:Consolas,monospace;font-size:12pt}@media print{body{margin:8mm}}</style></head><body>
        <div class="g">${daftar.map(s => `<div class="k"><h4>Kartu login CBT — ${sek}</h4><p>Nama: <strong>${esc(s.nama)}</strong></p><p>Kelas: ${esc(s.kelas)}</p><p>NIS: <b>${esc(s.nis)}</b></p><p>Kata sandi: <b>${esc(sandi[s.nis] ?? s.nis)}</b></p><small>Alamat ujian: ${url}</small></div>`).join('')}</div>
        <script>window.onload=()=>window.print()<\/script></body></html>`);
      w.document.close();
    }
  }
});

app.component('v-guru', {
  template: '#t-guru', data: () => ({ list: null, f: null, imp: null, sibuk: false }),
  computed: {
    hitungImpor() { const ada = new Set((this.list || []).map(g => g.username)); let baru = 0, ubah = 0; new Set(this.imp.rows.map(r => r.username)).forEach(u => ada.has(u) ? ubah++ : baru++); return { baru, ubah }; }
  },
  mounted() { this.muat(); },
  methods: {
    adaUser(u) { return (this.list || []).some(g => g.username === u); },
    petakan(baris) {
      if (!baris.length) return [];
      const norm = s => String(s || '').toLowerCase().replace(/[^a-z]/g, '');
      const h = baris[0].map(norm);
      let iU = h.findIndex(x => ['namapengguna', 'username', 'user', 'pengguna', 'akun', 'login'].includes(x));
      let iN = h.findIndex((x, i) => i !== iU && ['nama', 'namalengkap', 'namaguru'].includes(x));
      let iM = h.findIndex(x => ['matapelajaran', 'mapel', 'pelajaran', 'matapelajaranyangdiampu'].includes(x));
      let iP = h.findIndex(x => ['password', 'katasandi', 'sandi', 'pass'].includes(x));
      let iR = h.findIndex(x => ['peran', 'role', 'hakakses', 'akses'].includes(x));
      let iS = h.findIndex(x => ['status', 'aktif', 'statusakun'].includes(x));
      let data = baris.slice(1);
      if (iU < 0 || iN < 0) { [iU, iN, iM, iP, iR, iS] = [0, 1, 2, 3, 4, 5]; data = /^(namapengguna|username|no)$/.test(norm(baris[0][0])) ? baris.slice(1) : baris; }
      const sel = (r, i) => i >= 0 ? String(r[i] ?? '').trim() : '';
      return data.map(r => ({ username: sel(r, iU).toLowerCase(), nama: sel(r, iN), mapel: sel(r, iM), password: sel(r, iP), peran: sel(r, iR), status: sel(r, iS) })).filter(r => r.username && r.nama);
    },
    parseTeks() { const sep = this.imp.teks.includes('\t') ? '\t' : (this.imp.teks.includes(';') ? ';' : ','); this.imp.rows = this.petakan(this.imp.teks.replace(/\r/g, '').split('\n').filter(l => l.trim()).map(l => l.split(sep))); },
    async bacaFile(e) {
      const f = e.target.files[0]; if (!f) return;
      try { const X = await muatXLSX(); const wb = X.read(await f.arrayBuffer(), { type: 'array' }); const ws = wb.Sheets[wb.SheetNames[0]]; this.imp.rows = this.petakan(X.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' })); if (!this.imp.rows.length) toast('Tidak ada data yang terbaca. Pastikan ada kolom Nama pengguna dan Nama.', 'err'); }
      catch (err) { toast(err.message, 'err'); }
    },
    async impor() {
      this.sibuk = true;
      try {
        const r = await api('importGuru', { rows: this.imp.rows }, { retry: 2 });
        toast(`${r.baru} guru baru, ${r.ubah} diperbarui${r.lewati.length ? ', ' + r.lewati.length + ' baris dilewati (nama pengguna tidak valid)' : ''}`, 'ok', 6000);
        this.imp = null; this.muat();
      } catch (e) { toast(e.message, 'err', 6000); } finally { this.sibuk = false; }
    },
    async muat() { try { this.list = await api('listGuru'); } catch (e) { toast(e.message, 'err'); this.list = []; } },
    async unduh() {
      try {
        const [X, sandi] = await Promise.all([muatXLSX(), api('sandiGuru')]), wb = X.utils.book_new();
        const rows = this.list.map(g => ({ 'Nama pengguna': g.username, 'Nama': g.nama, 'Mata pelajaran': (g.mapel || []).join(', '), 'Password': sandi[g.id] || '', 'Peran': g.role === 'admin' ? 'Admin' : 'Guru', 'Status': g.aktif ? 'Aktif' : 'Nonaktif' }));
        X.utils.book_append_sheet(wb, X.utils.json_to_sheet(rows), 'Guru');
        X.writeFile(wb, 'Data_guru.xlsx');
      } catch (e) { toast(e.message, 'err'); }
    },
    async simpan() {
      this.sibuk = true;
      try { await api('saveGuru', this.f); toast('Akun guru tersimpan'); this.f = null; this.muat(); }
      catch (e) { toast(e.message, 'err'); } finally { this.sibuk = false; }
    },
    async hapus(g) {
      if (!await tanya('Hapus akun guru?', `Akun ${g.nama} (${g.username}) akan dihapus. Bank soal miliknya tetap ada dan bisa dikelola admin.`, { ok: 'Hapus', bahaya: true })) return;
      try { await coba(() => api('deleteGuru', { id: g.id }), 'Akun dihapus'); this.muat(); } catch (e) {}
    }
  }
});

app.component('v-pengaturan', {
  template: '#t-pengaturan',
  data: () => ({ c: JSON.parse(JSON.stringify(S.config)), sibuk: false, sibukSync: false, versi: '', st: null }),
  async mounted() {
    try { this.c = await api('getConfig'); } catch (e) {}
    this.c.tingkat = this.c.tingkat || []; this.c.kelas = this.c.kelas || []; this.c.mapel = this.c.mapel || [];
    api('ping').then(r => this.versi = r.versi).catch(() => {});
    this.muatStatus();
  },
  methods: {
    async simpan() {
      this.sibuk = true;
      try { S.config = await api('saveConfig', this.c); localStorage.setItem('cbt_g_config', JSON.stringify(S.config)); this.c = JSON.parse(JSON.stringify(S.config)); toast('Pengaturan tersimpan'); }
      catch (e) { toast(e.message, 'err'); } finally { this.sibuk = false; }
    },
    async muatUlangData() {
      if (!await tanya('Muat ulang data?', 'Data guru, bank soal, jadwal, dan pengaturan dibaca ulang dari database D1. Hanya perlu bila data di D1 diubah di luar aplikasi.', { ok: 'Muat ulang' })) return;
      try { const r = await api('muatUlangData'); toast(`Dimuat ulang: ${r.guru} guru, ${r.bank} bank soal, ${r.ujian} jadwal`); this.muatStatus && this.muatStatus(); } catch (e) { toast(e.message, 'err'); }
    },
    muatStatus() { api('statusSistem').then(r => this.st = r).catch(() => {}); },
    async sinkron() {
      this.sibukSync = true;
      try { const r = await api('sinkronSekarang'); toast(pesanSinkron(r), r.cadangan && r.cadangan.error ? 'err' : 'ok', 6000); this.muatStatus(); }
      catch (e) { toast(e.message, 'err'); } finally { this.sibukSync = false; }
    },
    async impor() {
      if (!await tanya('Impor dari GitHub?', 'Data di repo ' + this.st.dataRepo + ' (pengaturan, guru, siswa, bank soal, jadwal, hasil) akan dimasukkan ke database Cloudflare. Data dengan ID sama akan ditimpa. Pakai ini untuk memindahkan data dari versi Apps Script. Jangan lakukan saat ujian berlangsung.', { ok: 'Impor sekarang', bahaya: true })) return;
      this.sibukSync = true;
      try {
        const n = await api('imporGithub', {}, { retry: 0 });
        toast(`Diimpor: ${n.guru} guru, ${n.siswa} siswa, ${n.bank} bank soal, ${n.ujian} jadwal, ${n.hasil} hasil`, 'ok', 8000);
        S.config = await api('getConfig'); localStorage.setItem('cbt_g_config', JSON.stringify(S.config)); this.c = JSON.parse(JSON.stringify(S.config));
      } catch (e) { toast(e.message, 'err', 8000); } finally { this.sibukSync = false; }
    }
  }
});
function pesanSinkron(r) {
  let t = r.disinkron ? r.disinkron + ' hasil disimpan ke database' : 'Semua hasil sudah tersimpan';
  if (r.cadangan && r.cadangan.error) t += '. Cadangan GitHub gagal: ' + r.cadangan.error;
  else if (r.cadangan && r.cadangan.berkas) t += ', ' + r.cadangan.berkas + ' berkas dicadangkan ke GitHub';
  return t;
}

/* ---------- router ---------- */
const RUTE = ['beranda', 'bank', 'editor', 'jadwal', 'monitor', 'hasil', 'siswa', 'guru', 'pengaturan', 'akun'];
const ADMIN = ['siswa', 'guru', 'pengaturan'];
let hashLama = location.hash;
function rute() {
  if (S.editorKotor && S.route.name === 'editor' && !confirm('Ada perubahan bank soal yang belum disimpan. Tinggalkan halaman ini?')) { history.replaceState(null, '', hashLama); return; }
  const [, name, id] = (location.hash || '').match(/^#\/([a-z]+)\/?([^/?#]*)/) || [];
  let n = RUTE.includes(name) ? name : 'beranda';
  if (ADMIN.includes(n) && S.user && S.user.role !== 'admin') n = 'beranda';
  S.route = { name: n, id: decodeURIComponent(id || '') };
  S.editorKotor = false; hashLama = location.hash;
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', rute);
rute();
app.mount('#app');
