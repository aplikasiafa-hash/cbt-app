<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CBT Sekolah — Guru & Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css">
<style>
:root{
  --kertas:#fff; --latar:#EDEFF2; --seragam:#4A525C; --seragam-gelap:#3A4049;
  --teks:#252A30; --teks-2:#5F6772; --teks-3:#8A919B; --garis:#D7DBE0; --garis-2:#E8EBEE;
  --tinta:#D23F68; --tinta-muda:#FBEAF0; --grafit:#26292E;
  --stabilo:#F7D54A; --stabilo-muda:#FFF7D6;
  --hijau:#2E7D57; --hijau-muda:#E2F2E9; --merah:#B3261E; --merah-muda:#FBE8E7; --biru:#2F5E9E; --biru-muda:#E7EEF8;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-soal:'Literata',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.5;color:var(--teks);background:var(--latar);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--biru)}
:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
[v-cloak]{display:none}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.01em}
h1{font-size:24px;font-weight:800} h2{font-size:18px;font-weight:700} h3{font-size:15px;font-weight:700}
p{margin:0}
.muted{color:var(--teks-2)} .small{font-size:12.5px} .tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* tanda merek: tiga bulatan LJK, satu terisi */
.mark{display:inline-flex;gap:4px;align-items:center}
.mark i{width:11px;height:11px;border-radius:50%;border:1.6px solid currentColor;display:block}
.mark i.on{background:currentColor}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:7px;border:1px solid var(--garis);background:var(--kertas);cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--teks)}
.btn:hover{border-color:#B9BFC7;background:#F8F9FA}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--grafit);border-color:var(--grafit);color:#fff}
.btn-primary:hover{background:#000;border-color:#000}
.btn-danger{color:var(--merah);border-color:#E9C3C0}
.btn-danger:hover{background:var(--merah-muda);border-color:var(--merah)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:rgba(0,0,0,.05);border-color:transparent}
.btn-sm{height:30px;padding:0 10px;font-size:13px}
.btn-block{width:100%}
.btn-link{border:0;background:none;padding:0;color:var(--biru);cursor:pointer;font-weight:600}

/* form */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field>span{font-weight:600;font-size:13px}
.field>small{color:var(--teks-2);font-size:12px}
.input,.field input:not([type=checkbox]):not([type=radio]),.field select,.field textarea,select.input,textarea.input{height:38px;padding:0 11px;border:1px solid var(--garis);border-radius:7px;background:#fff;width:100%;min-width:0}
textarea.input,.field textarea{height:auto;padding:9px 11px;resize:vertical;line-height:1.5}
.input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--grafit);outline:none;box-shadow:0 0 0 3px rgba(38,41,46,.1)}
.check{display:flex;gap:9px;align-items:flex-start;margin-bottom:10px;cursor:pointer}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--grafit)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.err{color:var(--merah);font-size:13px;margin:-4px 0 12px}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px;background:var(--seragam)}
.login-card{width:100%;max-width:400px;background:var(--kertas);border-radius:12px;padding:34px 32px 28px;position:relative;overflow:hidden}
.login-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:repeating-linear-gradient(var(--tinta) 0 14px,transparent 14px 22px)}
.login-card .mark{color:var(--tinta);margin-bottom:18px}
.login-card h1{font-size:22px;margin-bottom:4px}
.login-card p.muted{margin-bottom:22px}
.login-foot{margin-top:16px;font-size:12px;color:var(--teks-3)}

/* kerangka */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--seragam);color:#E9ECEF;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-head{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.side-head .mark{color:#fff}
.side-head b{display:block;font-size:16px;margin-top:8px;color:#fff}
.side-head span{font-size:12px;color:#C3C9D0}
.nav{padding:10px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:7px;color:#E1E5E9;text-decoration:none;font-weight:600;margin-bottom:2px}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:#fff;color:var(--teks)}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav .sep{height:1px;background:rgba(255,255,255,.1);margin:10px 4px}
.nav .grp{font-size:11.5px;color:#AEB5BD;padding:8px 11px 4px;font-weight:600}
.side-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.1);font-size:13px}
.side-foot b{display:block;color:#fff}
.side-foot button{margin-top:8px;color:#fff;border-color:rgba(255,255,255,.25);background:transparent}
.side-foot button:hover{background:rgba(255,255,255,.1)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.page{padding:28px 32px 60px;max-width:1240px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head p{color:var(--teks-2);margin-top:4px}

/* panel & tabel */
.panel{background:var(--kertas);border:1px solid var(--garis);border-radius:10px}
.panel-pad{padding:18px 20px}
.panel+.panel{margin-top:16px}
.grid2>.panel+.panel{margin-top:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--garis-2)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--garis-2)}
.toolbar .input{height:34px;width:auto}
.toolbar .search{min-width:220px;flex:1;max-width:340px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12.5px;font-weight:600;color:var(--teks-2);padding:10px 14px;border-bottom:1px solid var(--garis);white-space:nowrap;background:#FAFBFC}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--garis-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#FAFBFC}
.tbl .act{text-align:right;white-space:nowrap}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:44px 20px;text-align:center;color:var(--teks-2)}
.empty b{display:block;color:var(--teks);font-size:15px;margin-bottom:4px}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid var(--garis-2);font-size:13px;color:var(--teks-2)}

/* status */
.chip{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.chip-abu{background:#EEF0F2;color:var(--teks-2)}
.chip-kuning{background:var(--stabilo-muda);color:#7A5B00;border-color:#EFD98A}
.chip-hijau{background:var(--hijau-muda);color:var(--hijau)}
.chip-merah{background:var(--merah-muda);color:var(--merah)}
.chip-biru{background:var(--biru-muda);color:var(--biru)}
.chip-garis{border-color:var(--garis);color:var(--teks-2)}
.chip-oranye{background:#FFF0E0;color:#9A4A00;border-color:#F5C99A}
.stat-status{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat-status button{border:1px solid var(--garis);background:#fff;border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:2px}
.stat-status button b{font-size:26px;line-height:1.1}.stat-status button span{font-size:13px;color:var(--teks-2)}
.stat-status button.on{outline:2px solid var(--teks);outline-offset:-2px}
.stat-status .st-mengerjakan b{color:#7A5B00}.stat-status .st-pending b{color:#9A4A00}.stat-status .st-selesai b{color:var(--hijau)}
@media (max-width:640px){.stat-status{grid-template-columns:repeat(2,1fr)}}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#C5CAD0}
.dot.on{background:#33A06F;box-shadow:0 0 0 3px rgba(51,160,111,.18)}
.bar{height:6px;background:var(--garis-2);border-radius:3px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--grafit)}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:4px;background:#EEF0F2;color:var(--teks-2);margin:1px 2px 1px 0}

/* bulatan LJK */
.bub{width:32px;height:32px;border-radius:50%;border:1.6px solid var(--tinta);color:var(--tinta);display:inline-grid;place-items:center;font-weight:700;font-size:13px;background:#fff;cursor:pointer;padding:0;font-variant-numeric:tabular-nums;flex:none}
.bub.isi{background:var(--grafit);border-color:var(--grafit);color:#fff}
.bub.ragu{background:var(--stabilo);border-color:#C9A300;color:var(--teks)}
.bub.aktif{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--tinta)}
.bub.kurang{position:relative}
.bub.kurang:after{content:"";position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--merah);border:2px solid #fff}

/* sentence stats */
.lede{font-size:16px;line-height:1.7;color:var(--teks);max-width:62ch}
.lede b{font-variant-numeric:tabular-nums}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(30,34,39,.55);display:grid;place-items:center;padding:20px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:560px;max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.modal.lebar{max-width:900px}
.modal-head{padding:18px 22px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-body{padding:4px 22px 8px;overflow:auto}
.modal-foot{padding:14px 22px 18px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--garis-2);margin-top:8px}
.x{width:32px;height:32px;border:0;background:none;border-radius:6px;cursor:pointer;font-size:20px;line-height:1;color:var(--teks-2)}
.x:hover{background:#F0F2F4}

/* toast */
.toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:80;max-width:380px}
.toast{background:var(--grafit);color:#fff;padding:11px 14px;border-radius:8px;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:flex;gap:10px;align-items:flex-start}
.toast.err{background:var(--merah)}
.toast.ok:before{content:"";width:9px;height:9px;border-radius:50%;background:#59D08F;margin-top:5px;flex:none}
@media (prefers-reduced-motion:no-preference){.toast{animation:masuk .18s ease-out}@keyframes masuk{from{transform:translateY(6px);opacity:0}}}

/* editor */
.ed-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--garis);border-radius:10px;padding:10px 12px;margin-bottom:14px;position:sticky;top:0;z-index:5}
.ed-head .judul{font-weight:700;font-size:16px;border:1px solid transparent;border-radius:6px;padding:4px 8px;min-width:140px;flex:1}
.ed-head .judul:hover{border-color:var(--garis)}
.ed-head .judul:focus{border-color:var(--grafit);outline:none}
.ed-head select{height:34px}
.ed-status{font-size:12.5px;color:var(--teks-2);white-space:nowrap}
.ed-status.kotor{color:#8A6400}
.ed{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
.ed-list{position:sticky;top:76px}
.ed-list .panel-pad{padding:14px}
.bub-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 6px;justify-items:center;margin:10px 0 14px}
.bub-cell{display:flex;flex-direction:column;align-items:center;gap:3px}
.bub-cell small{font-size:10px;color:var(--teks-3);font-weight:600;letter-spacing:.02em}
.type-menu{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.type-menu button{justify-content:flex-start;height:auto;padding:8px 10px;font-size:12.5px;text-align:left;white-space:normal;line-height:1.3}
.sf-head{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--garis-2)}
.sf-head .no{font-size:22px;font-weight:800;color:var(--tinta);font-variant-numeric:tabular-nums;margin-right:6px}
.sf-body{padding:18px 20px}
.sec{margin-top:20px;padding-top:18px;border-top:1px dashed var(--garis)}
.sec>h3{margin-bottom:4px}
.sec>p.muted{margin-bottom:12px;font-size:13px}
.opsi-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:start;margin-bottom:10px}
.opsi-row .bub{margin-top:3px}
.opsi-row textarea{min-height:38px}
.mini-thumb{width:46px;height:38px;border-radius:6px;border:1px solid var(--garis);object-fit:cover;display:block;background:#F4F5F6}
.imgs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.img-box{position:relative;border:1px solid var(--garis);border-radius:8px;padding:4px;background:#FAFBFC}
.img-box img{display:block;max-width:180px;max-height:120px;border-radius:5px}
.img-box button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.fmt-bar{display:flex;gap:2px;margin-bottom:4px}
.fmt-bar button{height:26px;min-width:28px;padding:0 7px;border:1px solid transparent;background:none;border-radius:5px;cursor:pointer;font-size:12.5px;color:var(--teks-2)}
.fmt-bar button:hover{background:#EEF0F2;color:var(--teks)}
.seg{display:inline-flex;border:1px solid var(--garis);border-radius:7px;overflow:hidden;flex:none}
.seg button{border:0;background:#fff;padding:0 12px;height:34px;cursor:pointer;font-weight:600;font-size:13px;color:var(--teks-2)}
.seg button+button{border-left:1px solid var(--garis)}
.seg button.on{background:var(--grafit);color:#fff}
.bs-row,.jd-row,.ur-row,.is-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.bs-row input,.jd-row input,.ur-row input,.is-row input{flex:1}
.jd-head{display:flex;gap:8px;font-size:12.5px;font-weight:600;color:var(--teks-2);margin-bottom:6px}
.jd-head span{flex:1}
.hint{font-size:12.5px;color:var(--teks-2);background:#F6F7F8;border-radius:7px;padding:9px 12px;margin-top:8px;line-height:1.55}
.hint code{background:#fff;border:1px solid var(--garis-2);border-radius:4px;padding:0 4px;font-size:12px}
.warn-bar{background:var(--stabilo-muda);border:1px solid #EFD98A;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}

/* tampilan soal (pratinjau & detail) */
.soal-view{font-family:var(--font-soal);font-size:16.5px;line-height:1.7}
.soal-view .stim{background:#F7F8F9;border-left:3px solid var(--garis);padding:12px 16px;margin-bottom:14px;border-radius:0 8px 8px 0;font-size:15.5px}
.soal-view .teks{margin-bottom:12px}
.soal-view .gbr{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 14px}
.soal-view .gbr img{max-width:100%;max-height:340px;border-radius:6px;border:1px solid var(--garis-2)}
.sv-hint{font-family:var(--font);font-size:12.5px;color:var(--teks-2);margin-bottom:10px;font-weight:600}
.sv-opsi{display:flex;gap:12px;align-items:flex-start;padding:9px 12px;border:1px solid var(--garis-2);border-radius:9px;margin-bottom:8px;cursor:pointer;background:#fff}
.sv-opsi:hover{border-color:var(--garis)}
.sv-opsi.pilih{border-color:var(--grafit);background:#F6F7F8}
.sv-opsi .bub{margin-top:1px;font-family:var(--font)}
.sv-opsi img{max-width:240px;max-height:160px;display:block;margin-top:6px;border-radius:5px}
.sv-opsi.kunci{border-color:var(--hijau);background:var(--hijau-muda)}
.sv-tbl{width:100%;border-collapse:collapse;font-size:15px}
.sv-tbl td,.sv-tbl th{border:1px solid var(--garis);padding:8px 10px;vertical-align:middle}
.sv-tbl th{font-family:var(--font);font-size:12.5px;background:#FAFBFC;font-weight:600}
.sv-tbl td.c{text-align:center;width:90px}
.sv-tbl select{font-family:var(--font);font-size:14px;width:100%}
.sv-kanan{border:1.5px dashed var(--garis);border-radius:9px;padding:8px 12px;margin-bottom:10px;background:#FAFBFC}
.sv-kh{font-family:var(--font);color:var(--tinta)}
.sv-input{font-family:var(--font);width:100%;border:1px solid var(--garis);border-radius:7px;padding:9px 11px;font-size:15px}
.sv-urut{display:flex;gap:8px;align-items:center;border:1px solid var(--garis-2);border-radius:8px;padding:7px 10px;margin-bottom:6px;background:#fff}
.sv-urut .n{font-family:var(--font);font-weight:700;color:var(--tinta);width:22px}
.sv-urut .t{flex:1}
.ans{font-family:var(--font);font-size:13.5px}
.ans .lbl{font-size:12px;color:var(--teks-2);font-weight:600;margin:10px 0 4px}
.ans .box{border:1px solid var(--garis-2);border-radius:8px;padding:9px 12px;background:#FAFBFC;white-space:pre-wrap}
.ok-mark{color:var(--hijau);font-weight:700}.no-mark{color:var(--merah);font-weight:700}

/* hasil */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--garis);margin-bottom:16px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--teks-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--teks);border-bottom-color:var(--tinta)}
.nilai-big{font-weight:800;font-variant-numeric:tabular-nums}
.distr{display:flex;gap:4px}
.distr span{min-width:34px;text-align:center;font-size:12px;padding:2px 4px;border-radius:4px;background:#F2F3F5;font-variant-numeric:tabular-nums}
.distr span.k{background:var(--hijau-muda);color:var(--hijau);font-weight:700}
.koreksi-item{border:1px solid var(--garis);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:#fff}
.koreksi-item .jwb{white-space:pre-wrap;font-family:var(--font-soal);font-size:15px;background:#FAFBFC;border-radius:7px;padding:10px 12px;margin:8px 0}
.token-box{display:flex;align-items:center;gap:14px;border:1.6px dashed var(--tinta);border-radius:10px;padding:10px 16px;background:var(--tinta-muda)}
.token-box b{font-size:28px;letter-spacing:.18em;color:var(--tinta);font-variant-numeric:tabular-nums}

.chips-input{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--garis);border-radius:7px;padding:6px;min-height:40px;background:#fff}
.chips-input span{display:inline-flex;align-items:center;gap:4px;background:#EEF0F2;border-radius:5px;padding:2px 4px 2px 8px;font-size:13px}
.chips-input span button{border:0;background:none;cursor:pointer;color:var(--teks-2);font-size:15px;line-height:1;padding:0 3px}
.chips-input input{border:0;outline:none;flex:1;min-width:120px;height:28px;padding:0 4px}
.kelas-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.kelas-pick label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--garis);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px}
.kelas-pick label.on{border-color:var(--grafit);background:#F3F4F5;font-weight:600}
.kelas-pick input{accent-color:var(--grafit)}
.kelas-pick.kecil{margin-top:4px;gap:5px}.kelas-pick.kecil label{padding:3px 8px;font-size:12.5px}
.awas-kelas{margin-top:8px;padding:10px 12px;border:1px dashed var(--garis);border-radius:7px;background:#FAFBFC}
.awas-baris{padding:6px 0}.awas-baris+.awas-baris{border-top:1px solid var(--garis-2)}
.pengawas-sel{min-width:150px;max-width:240px}.pengawas-sel div+div{margin-top:3px}
.list-plain{list-style:none;margin:0;padding:0}
.list-plain li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--garis-2)}
.list-plain li:last-child{border-bottom:0}
.menu-pop{position:relative;display:inline-block}
.menu-pop .pop{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--garis);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:4px;z-index:20;min-width:180px}
.menu-pop .pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:5px;cursor:pointer;font-size:13px}
.menu-pop .pop button:hover{background:#F2F3F5}
.menu-pop .pop button.danger{color:var(--merah)}
.loading{padding:40px;text-align:center;color:var(--teks-2)}

@media (max-width:960px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .2s}
  .side.buka{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--seragam);color:#fff;position:sticky;top:0;z-index:40}
  .topbar button{background:none;border:0;color:#fff;cursor:pointer;padding:4px}
  .page{padding:18px 14px 50px}
  .ed{grid-template-columns:1fr}
  .ed-list{position:static}
  .grid2,.grid3{grid-template-columns:1fr}
}
@media print{.side,.topbar,.toasts{display:none!important}.shell{display:block}}
</style>
</head>
<body>
<div id="app" v-cloak></div>

<!-- ======================= TEMPLATE ======================= -->
<script type="text/x-template" id="t-root">
  <v-login v-if="!S.user"></v-login>
  <div v-else class="shell">
    <aside class="side" :class="{buka: menuBuka}">
      <div class="side-head">
        <span class="mark"><i></i><i class="on"></i><i></i></span>
        <b>CBT Sekolah</b>
        <span>{{ S.config.namaSekolah }}</span>
      </div>
      <nav class="nav" @click="menuBuka=false">
        <a v-for="m in menu" :key="m.r" :href="'#/'+m.r" :class="{on: S.route.name===m.r || (m.r==='bank' && S.route.name==='editor')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" v-html="m.ic"></svg>{{ m.t }}
        </a>
        <template v-if="S.user.role==='admin'">
          <div class="sep"></div>
          <div class="grp">Administrasi</div>
          <a v-for="m in menuAdmin" :key="m.r" :href="'#/'+m.r" :class="{on: S.route.name===m.r}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" v-html="m.ic"></svg>{{ m.t }}
          </a>
        </template>
        <div class="sep"></div>
        <a href="#/akun" :class="{on: S.route.name==='akun'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Akun saya</a>
      </nav>
      <div class="side-foot">
        <b>{{ S.user.nama }}</b>{{ S.user.role==='admin' ? 'Admin' : 'Guru' }}
        <div><button class="btn btn-sm" @click="keluar">Keluar</button></div>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <button @click="menuBuka=!menuBuka" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <span class="mark"><i></i><i class="on"></i><i></i></span><b>CBT Sekolah</b>
      </div>
      <component :is="'v-'+S.route.name" :key="S.route.name + (S.route.id||'')"></component>
    </div>
  </div>
  <div class="toasts" aria-live="polite">
    <div v-for="t in S.toasts" :key="t.id" class="toast" :class="t.tipe">{{ t.pesan }}</div>
  </div>
  <div class="modal-bg" v-if="S.dialog" @click.self="S.dialog.jawab(false)">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h2>{{ S.dialog.judul }}</h2></div>
      <div class="modal-body"><p style="white-space:pre-line">{{ S.dialog.teks }}</p></div>
      <div class="modal-foot">
        <button class="btn" @click="S.dialog.jawab(false)">{{ S.dialog.batal || 'Batal' }}</button>
        <button class="btn" :class="S.dialog.bahaya ? 'btn-danger' : 'btn-primary'" @click="S.dialog.jawab(true)" v-focus>{{ S.dialog.ok || 'Lanjutkan' }}</button>
      </div>
    </div>
  </div>
</script>

<script type="text/x-template" id="t-login">
  <div class="login">
    <div class="login-card">
      <span class="mark"><i></i><i class="on"></i><i></i><i></i></span>
      <h1>CBT {{ sekolah || 'Sekolah' }}</h1>
      <p class="muted">Masuk sebagai guru atau admin untuk menyusun soal dan mengelola ujian.</p>
      <form @submit.prevent="masuk">
        <label class="field"><span>Nama pengguna</span><input v-model.trim="u" autocomplete="username" autocapitalize="none" required></label>
        <label class="field"><span>Kata sandi</span><input type="password" v-model="p" autocomplete="current-password" required></label>
        <p class="err" v-if="err">{{ err }}</p>
        <button class="btn btn-primary btn-block" :disabled="loading">{{ loading ? 'Memeriksa…' : 'Masuk' }}</button>
      </form>
      <p class="login-foot" v-if="!apiSiap">Alamat backend belum diatur. Isi konstanta API_URL di file ini.</p>
    </div>
  </div>
</script>

<script type="text/x-template" id="t-beranda">
  <div class="page">
    <div class="page-head"><div><h1>{{ salam }}, {{ S.user.nama }}</h1><p>{{ S.config.namaSekolah }} — tahun ajaran {{ S.config.tahunAjaran }} semester {{ S.config.semester }}</p></div></div>
    <div v-if="!d" class="loading">Memuat…</div>
    <template v-else>
      <div class="panel panel-pad" style="margin-bottom:16px">
        <p class="lede">
          <template v-if="S.user.role==='admin'">Sekolah ini memiliki <b>{{ d.jumlahSiswa }}</b> siswa dan <b>{{ d.jumlahGuru }}</b> akun guru. Tersimpan </template>
          <template v-else>Anda memiliki </template>
          <b>{{ d.jumlahBank }}</b> bank soal berisi <b>{{ d.jumlahSoal }}</b> soal, dipakai di <b>{{ d.jumlahUjian }}</b> jadwal ujian.
          <template v-if="d.berlangsung"> Saat ini <b>{{ d.berlangsung }}</b> ujian sedang berlangsung.</template>
          <template v-else> Tidak ada ujian yang sedang berlangsung.</template>
        </p>
        <div class="row" style="margin-top:14px">
          <a class="btn btn-primary" href="#/bank">Susun soal</a>
          <a class="btn" href="#/jadwal" v-if="S.user.role==='admin'">Jadwalkan ujian</a>
          <a class="btn" href="#/monitor">Pantau ujian</a>
        </div>
        <p class="small muted" style="margin-top:10px" v-if="S.user.role!=='admin'">Anda ditugaskan sebagai pengawas di <b>{{ d.jumlahAwas }}</b> jadwal ujian.</p>
      </div>
      <div class="grid2" style="gap:16px">
        <div class="panel">
          <div class="panel-head"><h3>{{ S.user.role==='admin' ? 'Ujian 24 jam ke depan' : 'Ujian yang Anda awasi (24 jam ke depan)' }}</h3><a href="#/jadwal" class="small">{{ S.user.role==='admin' ? 'Semua jadwal' : 'Jadwal hari ini' }}</a></div>
          <ul class="list-plain" v-if="d.mendatang.length">
            <li v-for="u in d.mendatang" :key="u.id">
              <div><b>{{ u.nama }}</b><div class="small muted">{{ fmtWaktu(u.mulai) }} – {{ fmtJam(u.selesai) }} · {{ (u.awasi || u.kelas).join(', ') }}</div></div>
              <div class="row" style="gap:6px">
                <status-jadwal :s="u.status"></status-jadwal>
                <a class="btn btn-sm" :href="'#/monitor/'+u.id">Pantau</a>
              </div>
            </li>
          </ul>
          <div v-else class="empty">{{ S.user.role==='admin' ? 'Belum ada ujian yang dijadwalkan dalam 24 jam ke depan.' : 'Tidak ada ujian yang Anda awasi dalam 24 jam ke depan.' }}</div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Bank soal terakhir diubah</h3><a href="#/bank" class="small">Semua bank soal</a></div>
          <ul class="list-plain" v-if="d.bankTerbaru.length">
            <li v-for="b in d.bankTerbaru" :key="b.id">
              <div><a :href="'#/editor/'+b.id"><b>{{ b.judul }}</b></a><div class="small muted">{{ b.mapel }} · kelas {{ b.tingkat }} · {{ b.jumlahSoal }} soal</div></div>
              <span class="small muted">{{ relatif(b.diubah) }}</span>
            </li>
          </ul>
          <div v-else class="empty"><b>Belum ada bank soal</b>Buat bank soal pertama di menu Bank soal.</div>
        </div>
      </div>
    </template>
  </div>
</script>

<script type="text/x-template" id="t-bank">
  <div class="page">
    <div class="page-head">
      <div><h1>Bank soal</h1><p>Kumpulan soal per mata pelajaran. Satu bank soal bisa dipakai di banyak jadwal ujian.</p></div>
      <div class="row">
        <button class="btn" @click="pilihImpor">Impor file JSON</button>
        <button class="btn btn-primary" @click="baru={judul:'',mapel:mapelPilihan()[0]||'',tingkat:S.config.tingkat[0]||''}">Buat bank soal</button>
      </div>
    </div>
    <div class="panel">
      <div class="toolbar">
        <input class="input search" v-model="q" placeholder="Cari judul…" type="search">
        <select class="input" v-model="fMapel"><option value="">Semua mapel</option><option v-for="m in mapelList" :key="m">{{ m }}</option></select>
        <select class="input" v-model="fTingkat"><option value="">Semua tingkat</option><option v-for="t in S.config.tingkat" :key="t">{{ t }}</option></select>
      </div>
      <div v-if="!list" class="loading">Memuat…</div>
      <div v-else-if="!tampil.length" class="empty"><b>{{ list.length ? 'Tidak ada yang cocok' : 'Belum ada bank soal' }}</b>{{ list.length ? 'Ubah kata kunci atau filter.' : 'Klik “Buat bank soal” untuk mulai menyusun soal.' }}</div>
      <div v-else class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Judul</th><th>Mapel</th><th>Tingkat</th><th class="num">Soal</th><th class="num">Bobot</th><th v-if="S.user.role==='admin'">Pemilik</th><th>Diubah</th><th></th></tr></thead>
        <tbody><tr v-for="b in tampil" :key="b.id">
          <td><a v-if="bisaUbah(b)" :href="'#/editor/'+b.id"><b>{{ b.judul }}</b></a><b v-else>{{ b.judul }}</b></td>
          <td>{{ b.mapel }}</td><td>{{ b.tingkat }}</td><td class="num">{{ b.jumlahSoal }}</td><td class="num">{{ b.totalBobot }}</td>
          <td v-if="S.user.role==='admin'">{{ b.guruNama }}</td>
          <td class="small muted">{{ relatif(b.diubah) }}</td>
          <td class="act">
            <template v-if="bisaUbah(b)">
              <a class="btn btn-sm" :href="'#/editor/'+b.id">Edit</a>
              <menu-pop :items="[{t:'Duplikat',f:()=>duplikat(b)},{t:'Unduh JSON',f:()=>unduhJson(b)},{t:'Hapus',f:()=>hapus(b),danger:true}]"></menu-pop>
            </template>
          </td>
        </tr></tbody>
      </table></div>
    </div>

    <div class="modal-bg" v-if="baru" @click.self="baru=null">
      <form class="modal" @submit.prevent="buat">
        <div class="modal-head"><h2>Bank soal baru</h2><button type="button" class="x" @click="baru=null">×</button></div>
        <div class="modal-body">
          <label class="field"><span>Judul</span><input v-model="baru.judul" required placeholder="Contoh: PAS Ganjil Matematika X" v-focus></label>
          <div class="grid2">
            <label class="field"><span>Mata pelajaran</span><select v-model="baru.mapel"><option v-for="m in mapelPilihan()" :key="m">{{ m }}</option></select></label>
            <label class="field"><span>Tingkat</span><select v-model="baru.tingkat"><option v-for="t in S.config.tingkat" :key="t">{{ t }}</option></select></label>
          </div>
        </div>
        <div class="modal-foot"><button type="button" class="btn" @click="baru=null">Batal</button><button class="btn btn-primary" :disabled="sibuk">Buat dan mulai menyusun</button></div>
      </form>
    </div>
  </div>
</script>

<script type="text/x-template" id="t-editor">
  <div class="page" @paste="tempel">
    <div v-if="!bank" class="loading">Memuat bank soal…</div>
    <template v-else>
      <div class="ed-head">
        <a href="#/bank" class="btn btn-ghost btn-sm">‹ Bank soal</a>
        <input class="judul" v-model="bank.judul" aria-label="Judul bank soal">
        <select class="input" v-model="bank.mapel" style="width:auto"><option v-for="m in mapelOpsi" :key="m">{{ m }}</option></select>
        <select class="input" v-model="bank.tingkat" style="width:auto"><option v-for="t in S.config.tingkat" :key="t">{{ t }}</option></select>
        <span class="ed-status" :class="{kotor: kotor}">{{ kotor ? 'Ada perubahan belum disimpan' : (tersimpan ? 'Tersimpan ' + fmtJam(tersimpan) : 'Tersimpan') }}</span>
        <button class="btn btn-sm" @click="impor.buka=true">Impor cepat</button>
        <button class="btn btn-sm" @click="pratinjau=!pratinjau" :disabled="!bank.soal.length">{{ pratinjau ? 'Kembali menyunting' : 'Pratinjau siswa' }}</button>
        <button class="btn btn-primary btn-sm" @click="simpan" :disabled="menyimpan">{{ menyimpan ? 'Menyimpan…' : 'Simpan' }}</button>
      </div>
      <div class="warn-bar" v-if="dipakai.length">Bank ini dipakai di jadwal: <b>{{ dipakai.join(', ') }}</b>. Perubahan langsung berlaku untuk ujian tersebut.</div>
      <div class="ed">
        <div class="ed-list">
          <div class="panel panel-pad">
            <div class="row" style="justify-content:space-between"><h3>{{ bank.soal.length }} soal</h3><span class="small muted">bobot {{ totalBobot }}</span></div>
            <div class="bub-grid" v-if="bank.soal.length">
              <div class="bub-cell" v-for="(s,i) in bank.soal" :key="s.id">
                <button class="bub" :class="{isi: !masalah(s).length, aktif: i===sel, kurang: masalah(s).length}" @click="sel=i" :title="masalah(s).join('; ') || namaTipe(s.tipe)">{{ i+1 }}</button>
                <small>{{ singkatTipe(s.tipe) }}</small>
              </div>
            </div>
            <p class="small muted" v-else style="margin:8px 0 12px">Belum ada soal.</p>
            <div class="small" style="font-weight:600;margin-bottom:6px">Tambah soal</div>
            <div class="type-menu">
              <button class="btn" v-for="t in TIPE" :key="t.k" @click="tambah(t.k)">{{ t.n }}</button>
            </div>
            <p class="small muted" style="margin-top:12px">Bulatan hitam: soal lengkap. Titik merah: masih ada yang kurang. Tempel gambar dengan Ctrl+V.</p>
          </div>
        </div>
        <div>
          <div v-if="!bank.soal.length" class="panel empty"><b>Bank soal masih kosong</b>Pilih jenis soal di kiri, atau gunakan “Impor cepat” untuk menempel banyak soal pilihan ganda sekaligus.</div>
          <div v-else-if="pratinjau" class="panel panel-pad">
            <div class="row" style="justify-content:space-between;margin-bottom:14px">
              <h3>Soal nomor {{ sel+1 }} seperti yang dilihat siswa</h3>
              <div class="row" style="gap:6px"><button class="btn btn-sm" :disabled="sel===0" @click="sel--">Sebelumnya</button><button class="btn btn-sm" :disabled="sel===bank.soal.length-1" @click="sel++">Berikutnya</button></div>
            </div>
            <soal-view :soal="soalPratinjau" v-model="coba[bank.soal[sel].id]"></soal-view>
          </div>
          <soal-form v-else :s="bank.soal[sel]" :no="sel+1" :total="bank.soal.length" :key="bank.soal[sel].id"
            @naik="pindah(-1)" @turun="pindah(1)" @duplikat="duplikatSoal" @hapus="hapusSoal" @ganti-tipe="gantiTipe"></soal-form>
        </div>
      </div>
    </template>

    <div class="modal-bg" v-if="impor.buka" @click.self="impor.buka=false">
      <div class="modal lebar">
        <div class="modal-head"><div><h2>Impor cepat</h2><p class="muted small">Tempel soal dari Word/Excel dengan format di bawah. Soal ditambahkan di akhir bank.</p></div><button class="x" @click="impor.buka=false">×</button></div>
        <div class="modal-body">
          <div class="grid2" style="gap:16px">
            <textarea class="input" v-model="impor.teks" rows="16" placeholder="Tempel soal di sini…" style="font-family:ui-monospace,Consolas,monospace;font-size:13px"></textarea>
            <div class="hint" style="margin:0">
              <b>Format</b><br>
              Awali setiap soal dengan nomor: <code>1.</code><br>
              Pilihan jawaban diawali huruf: <code>A.</code> <code>B.</code> …<br>
              Tandai kunci dengan baris <code>Kunci: B</code> atau tanda <code>*</code> di akhir pilihan. Lebih dari satu kunci (<code>Kunci: A, C</code>) menjadi pilihan ganda kompleks.<br>
              Soal isian: tanpa pilihan, beri baris <code>Jawaban: Makassar | Kota Makassar</code><br>
              Soal tanpa pilihan dan tanpa jawaban menjadi uraian.<br>
              Baris <code>Bobot: 2</code> mengatur bobot soal.<br><br>
              <b>Contoh</b><br>
              <code>1. Ibu kota Sulawesi Selatan adalah ...</code><br>
              <code>A. Kendari</code><br><code>B. Makassar*</code><br><code>C. Palu</code><br><br>
              <code>2. Sebutkan dua contoh energi terbarukan!</code>
            </div>
          </div>
          <p class="small" style="margin-top:10px" v-if="hasilImpor.length">Terbaca <b>{{ hasilImpor.length }}</b> soal: {{ ringkasImpor }}<span class="no-mark" v-if="hasilImpor.filter(s=>masalah(s).length).length"> — {{ hasilImpor.filter(s=>masalah(s).length).length }} soal perlu dicek (misalnya kunci belum ada).</span></p>
        </div>
        <div class="modal-foot"><button class="btn" @click="impor.buka=false">Batal</button><button class="btn btn-primary" :disabled="!hasilImpor.length" @click="terapkanImpor">Tambahkan {{ hasilImpor.length }} soal</button></div>
      </div>
    </div>
  </div>
</script>

<script type="text/x-template" id="t-soal-form">
  <div class="panel">
    <div class="sf-head">
      <span class="no">{{ no }}</span>
      <label class="field" style="margin:0;min-width:210px"><span>Jenis soal</span>
        <select :value="s.tipe" @change="$emit('ganti-tipe', $event.target.value)"><option v-for="t in TIPE" :key="t.k" :value="t.k">{{ t.n }}</option></select>
      </label>
      <label class="field" style="margin:0;width:90px"><span>Bobot</span><input type="number" min="0" step="0.5" v-model.number="s.bobot"></label>
      <div class="row" style="margin-left:auto;gap:4px">
        <button class="btn btn-sm btn-ghost" :disabled="no===1" @click="$emit('naik')" title="Pindah ke atas">↑</button>
        <button class="btn btn-sm btn-ghost" :disabled="no===total" @click="$emit('turun')" title="Pindah ke bawah">↓</button>
        <button class="btn btn-sm" @click="$emit('duplikat')">Duplikat</button>
        <button class="btn btn-sm btn-danger" @click="$emit('hapus')">Hapus</button>
      </div>
    </div>
    <div class="sf-body">
      <div v-if="adaStimulus" class="field">
        <span>Teks bacaan / stimulus <button class="btn-link small" style="margin-left:8px" @click="s.stimulus='';adaStimulus=false">hapus</button></span>
        <teks-input v-model="s.stimulus" :rows="4" placeholder="Wacana, tabel data, atau cerita yang menjadi dasar soal"></teks-input>
      </div>
      <button v-else class="btn-link small" style="margin-bottom:12px" @click="adaStimulus=true">+ Tambah teks bacaan / stimulus</button>

      <div class="field"><span>Pertanyaan</span>
        <teks-input v-model="s.teks" :rows="3" placeholder="Tulis pertanyaan…"></teks-input>
      </div>
      <div>
        <div class="row" style="gap:8px">
          <button class="btn btn-sm" @click="unggahGambarSoal" :disabled="s.gambar.length>=6">Unggah gambar</button>
          <button class="btn btn-sm btn-ghost" @click="urlGambar">Pakai URL gambar</button>
          <span class="small muted">JPG/PNG, otomatis diperkecil. Bisa juga tempel (Ctrl+V).</span>
        </div>
        <div class="imgs" v-if="s.gambar.length">
          <div class="img-box" v-for="(g,i) in s.gambar" :key="g"><img :src="g" alt="Gambar soal"><button @click="s.gambar.splice(i,1)" aria-label="Hapus gambar">×</button></div>
        </div>
      </div>

      <!-- PG & PGK -->
      <div class="sec" v-if="s.tipe==='pg' || s.tipe==='pgk'">
        <h3>Pilihan jawaban</h3>
        <p class="muted">{{ s.tipe==='pg' ? 'Klik huruf untuk menandai satu kunci jawaban.' : 'Klik huruf untuk menandai semua jawaban yang benar (boleh lebih dari satu).' }}</p>
        <div class="opsi-row" v-for="(o,i) in s.opsi" :key="o.id">
          <button class="bub" :class="{isi: isKunci(o.id)}" @click="toggleKunci(o.id)" :title="isKunci(o.id)?'Kunci jawaban':'Tandai sebagai kunci'">{{ huruf(i) }}</button>
          <div><teks-input v-model="o.teks" :rows="1" :toolbar="false" :placeholder="'Pilihan ' + huruf(i)"></teks-input>
            <div class="imgs" v-if="o.gambar"><div class="img-box"><img :src="o.gambar" alt=""><button @click="o.gambar=''">×</button></div></div></div>
          <div class="row" style="gap:2px">
            <button class="btn btn-sm btn-ghost" @click="unggahGambarOpsi(o)" title="Gambar untuk pilihan ini">Gambar</button>
            <button class="btn btn-sm btn-ghost" @click="hapusOpsi(i)" :disabled="s.opsi.length<=2" title="Hapus pilihan">×</button>
          </div>
        </div>
        <button class="btn btn-sm" @click="s.opsi.push({id:rid('o'),teks:'',gambar:''})" :disabled="s.opsi.length>=8">+ Tambah pilihan</button>
      </div>

      <!-- Benar/Salah -->
      <div class="sec" v-if="s.tipe==='bs'">
        <h3>Pernyataan</h3>
        <p class="muted">Siswa menentukan setiap pernyataan. Pilih label yang sesuai.</p>
        <label class="field" style="max-width:280px"><span>Label pilihan</span>
          <select :value="s.label.join('|')" @change="s.label=$event.target.value.split('|')">
            <option v-for="l in LABEL_BS" :key="l" :value="l">{{ l.replace('|',' / ') }}</option>
          </select></label>
        <div class="bs-row" v-for="(p,i) in s.pernyataan" :key="p.id">
          <input class="input" v-model="p.teks" :placeholder="'Pernyataan ' + (i+1)">
          <div class="seg"><button :class="{on:p.benar===true}" @click="p.benar=true">{{ s.label[0] }}</button><button :class="{on:p.benar===false}" @click="p.benar=false">{{ s.label[1] }}</button></div>
          <button class="btn btn-sm btn-ghost" @click="s.pernyataan.splice(i,1)" :disabled="s.pernyataan.length<=1">×</button>
        </div>
        <button class="btn btn-sm" @click="s.pernyataan.push({id:rid('p'),teks:'',benar:true})">+ Tambah pernyataan</button>
      </div>

      <!-- Menjodohkan -->
      <div class="sec" v-if="s.tipe==='jodoh'">
        <h3>Pasangan</h3>
        <p class="muted">Isi pasangan yang benar. Kolom kanan diacak untuk siswa. Pengecoh adalah jawaban kanan tanpa pasangan.</p>
        <div class="jd-head"><span>Kiri (pernyataan)</span><span>Kanan (jawaban)</span><span style="flex:0 0 34px"></span></div>
        <div class="jd-row" v-for="(p,i) in s.pasangan" :key="p.idKiri">
          <input class="input" v-model="p.kiri" :placeholder="p.kiri==='' && p.pengecoh ? '(pengecoh — kosongkan)' : 'Pernyataan ' + (i+1)" :disabled="p.pengecoh">
          <input class="input" v-model="p.kanan" :placeholder="p.pengecoh ? 'Jawaban pengecoh' : 'Pasangan yang benar'">
          <button class="btn btn-sm btn-ghost" @click="s.pasangan.splice(i,1)" :disabled="s.pasangan.length<=1">×</button>
        </div>
        <div class="row" style="gap:6px"><button class="btn btn-sm" @click="s.pasangan.push({idKiri:rid('l'),idKanan:rid('r'),kiri:'',kanan:''})">+ Tambah pasangan</button><button class="btn btn-sm btn-ghost" @click="s.pasangan.push({idKiri:rid('l'),idKanan:rid('r'),kiri:'',kanan:'',pengecoh:true})">+ Tambah pengecoh</button></div>
      </div>

      <!-- Isian -->
      <div class="sec" v-if="s.tipe==='isian'">
        <h3>Jawaban yang diterima</h3>
        <p class="muted">Huruf besar/kecil, spasi berlebih, dan titik di akhir diabaikan. Koma dan titik desimal dianggap sama.</p>
        <div class="is-row" v-for="(j,i) in s.jawaban" :key="i">
          <input class="input" v-model="s.jawaban[i]" :placeholder="i===0 ? 'Jawaban utama' : 'Alternatif jawaban'">
          <button class="btn btn-sm btn-ghost" @click="s.jawaban.splice(i,1)" :disabled="s.jawaban.length<=1">×</button>
        </div>
        <button class="btn btn-sm" @click="s.jawaban.push('')">+ Tambah alternatif</button>
      </div>

      <!-- Urutan -->
      <div class="sec" v-if="s.tipe==='urut'">
        <h3>Urutan yang benar</h3>
        <p class="muted">Susun dari atas ke bawah sesuai urutan benar. Siswa melihat urutan acak.</p>
        <div class="ur-row" v-for="(o,i) in s.opsi" :key="o.id">
          <span class="bub isi" style="cursor:default">{{ i+1 }}</span>
          <input class="input" v-model="o.teks" :placeholder="'Langkah ' + (i+1)">
          <button class="btn btn-sm btn-ghost" :disabled="i===0" @click="geser(i,-1)">↑</button>
          <button class="btn btn-sm btn-ghost" :disabled="i===s.opsi.length-1" @click="geser(i,1)">↓</button>
          <button class="btn btn-sm btn-ghost" @click="s.opsi.splice(i,1)" :disabled="s.opsi.length<=2">×</button>
        </div>
        <button class="btn btn-sm" @click="s.opsi.push({id:rid('o'),teks:'',gambar:''})" :disabled="s.opsi.length>=12">+ Tambah butir</button>
      </div>

      <!-- Uraian -->
      <div class="sec" v-if="s.tipe==='uraian'">
        <h3>Pedoman penskoran</h3>
        <p class="muted">Tidak ditampilkan ke siswa. Dipakai saat koreksi manual di menu Hasil & koreksi.</p>
        <textarea class="input" v-model="s.rubrik" rows="4" placeholder="Contoh: skor 4 jika…, skor 2 jika…"></textarea>
      </div>

      <div class="sec" v-if="['pgk','bs','jodoh','urut'].includes(s.tipe)">
        <h3>Cara penilaian</h3>
        <label class="check"><input type="radio" value="sebagian" v-model="s.penilaian"><span><b>Sebagian</b> — skor sebanding dengan bagian yang benar{{ s.tipe==='pgk' ? ' (pilihan salah mengurangi skor)' : '' }}</span></label>
        <label class="check"><input type="radio" value="mutlak" v-model="s.penilaian"><span><b>Mutlak</b> — skor penuh hanya jika semuanya benar</span></label>
      </div>

      <div class="sec">
        <details :open="!!s.pembahasan"><summary style="cursor:pointer;font-weight:700">Pembahasan (opsional)</summary>
          <textarea class="input" v-model="s.pembahasan" rows="3" style="margin-top:8px" placeholder="Penjelasan jawaban, hanya untuk guru"></textarea>
        </details>
      </div>
    </div>
  </div>
</script>

<script type="text/x-template" id="t-teks-input">

  </div>
</script>

        </div>
        <div class="modal-foot"><button type="button" class="btn" @click="f=null">Batal</button><button class="btn btn-primary" :disabled="sibuk">{{ sibuk ? 'Menyimpan…' : 'Simpan jadwal' }}</button></div>

    </div>
  </div>

/* =====================================================================
   KONEKSI TUNGGAL (WebSocket): semua aksi lewat SATU koneksi yang dibuka
   sekali. 1 kali buka aplikasi = 1 request kuota Cloudflare. Bila koneksi
   ini tidak tersedia, aplikasi otomatis memakai HTTP biasa.
   ===================================================================== */
const Sok = {
  ws: null, membuka: null, seq: 0, tunggu: new Map(), potongan: new Map(), pendengar: new Set(), gagal: 0, aturWaktu: null,
  tersedia() { return !!WS_URL && this.gagal < 3; },
  terbuka() { return !!(this.ws && this.ws.readyState === 1); },
  buka() {
    if (this.terbuka()) return Promise.resolve();
    if (this.membuka) return this.membuka;
    if (!WS_URL) return Promise.reject(Object.assign(new Error('Koneksi langsung tidak tersedia'), { code: 'NET' }));
    this.membuka = new Promise((ok, no) => {
      let ws, jadi = false;
      const gagal = () => { if (jadi) return; jadi = true; this.membuka = null; this.gagal++; no(Object.assign(new Error('Tidak dapat tersambung'), { code: 'NET' })); };
      try { ws = new WebSocket(WS_URL + '?r=1'); } catch (e) { return gagal(); }
      const batas = setTimeout(() => { gagal(); try { ws.close(); } catch (e) {} }, 8000);
      ws.onopen = () => {
        if (jadi) { try { ws.close(); } catch (e) {} return; }
        jadi = true; clearTimeout(batas); this.ws = ws; this.membuka = null; this.gagal = 0; ok(); this.kabari({ t: '_buka' });
      };
      ws.onmessage = ev => { if (this.ws === ws) this.terima(ev.data); };
      ws.onclose = () => {
        clearTimeout(batas);
        if (!jadi) return gagal();
        if (this.ws !== ws) return;
        this.ws = null;
        const e = Object.assign(new Error('Koneksi terputus'), { code: 'NET' });
        this.tunggu.forEach(p => p.no(e)); this.tunggu.clear(); this.potongan.clear();
        this.kabari({ t: '_tutup' });
      };
    });
    return this.membuka;
  },
  kirim(o) {
    if (!this.terbuka()) return false;
    try {
      const s = JSON.stringify(o), P = 400000;
      if (s.length <= P) this.ws.send(s);
      else { const id = 'k' + (++this.seq), n = Math.ceil(s.length / P); for (let i = 0; i < n; i++) this.ws.send(JSON.stringify({ t: 'pt', id, i, n, s: s.slice(i * P, (i + 1) * P) })); }
      return true;
    } catch (e) { return false; }
  },
  terima(raw) {
    let m; try { m = JSON.parse(raw); } catch (e) { return; }
    if (m.t === 'pt') {
      let b = this.potongan.get(m.id);
      if (!b) this.potongan.set(m.id, b = { n: m.n, a: [], k: 0 });
      if (b.a[m.i] === undefined) { b.a[m.i] = m.s; b.k++; }
      if (b.k < b.n) return;
      this.potongan.delete(m.id);
      return this.terima(b.a.join(''));
    }
    if (m.now && this.aturWaktu) this.aturWaktu(m.now);
    if (m.t === 'res') { const p = this.tunggu.get(m.id); if (p) { this.tunggu.delete(m.id); p.ok(m); } return; }
    this.kabari(m);
  },
  kabari(m) { this.pendengar.forEach(f => { try { f(m); } catch (e) { console.error(e); } }); },
  async rpc(a, d, tok, batasMs) {
    await this.buka();
    const id = ++this.seq;
    return new Promise((ok, no) => {
      const t = setTimeout(() => { this.tunggu.delete(id); no(Object.assign(new Error('Server tidak menjawab'), { code: 'NET' })); }, batasMs || 45000);
      this.tunggu.set(id, { ok: m => { clearTimeout(t); ok(m); }, no: e => { clearTimeout(t); no(e); } });
      if (!this.kirim({ t: 'rpc', id, a, d, tok })) { clearTimeout(t); this.tunggu.delete(id); no(Object.assign(new Error('Koneksi terputus'), { code: 'NET' })); }
    });
  }
};
const AKSI_LAMA = new Set(['imporGithub', 'importSiswa', 'importGuru', 'hitungUlang', 'sinkronSekarang', 'uploadGambar', 'hasilUjian', 'koreksiMassal']);
/** Coba lewat koneksi tunggal dulu. null = tidak bisa (pakai HTTP). */
async function apiSok(action, data, tok, onAuth) {
  if (!Sok.tersedia()) return null;
  for (let i = 0; i < 3; i++) {
    let j;
    try { j = await Sok.rpc(action, data, tok, AKSI_LAMA.has(action) ? 180000 : 45000); } catch (e) { return null; }
    if (j.ok) return { data: j.data };
    const e = Object.assign(new Error(j.error || 'Terjadi kesalahan'), { code: j.code });
    if (j.code === 'AUTH') { onAuth(); throw e; }
    if (j.code !== 'BUSY') throw e;
    await sleep(700 * 2 ** i * (0.5 + Math.random()));
  }
  return null;
}

Sok.aturWaktu = n => { S.offset = n - Date.now(); };
async function api(action, data = {}, opt = {}) {
  if (!API_URL) throw new Error('Alamat backend (API_URL) belum diatur');
  if (!opt.http) { const r = await apiSok(action, data, S.token, () => keluar(true)); if (r) return r.data; }
  const body = JSON.stringify({ action, data, token: S.token });
  const maks = opt.retry ?? 4;
  let terakhir;
  for (let i = 0; i <= maks; i++) {
    try {
      const res = await fetch(API_URL + '?a=' + encodeURIComponent(action), { method: 'POST', body, headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
      if (res.status === 429 && !/json/.test(res.headers.get('content-type') || '')) throw Object.assign(new Error('Kuota harian Cloudflare (100.000 permintaan) sudah habis. Pulih pukul 08.00 WITA.'), { code: 'KUOTA' });
      const j = await res.json();
      if (j.serverTime) S.offset = j.serverTime - Date.now();
      if (j.ok) return j.data;
      const e = new Error(j.error || 'Terjadi kesalahan'); e.code = j.code;
      if (j.code === 'AUTH') { keluar(true); throw e; }
      if (j.code !== 'BUSY') throw e;
      terakhir = e;
    } catch (e) {
      if (e.code && e.code !== 'BUSY') throw e;
      terakhir = e.code ? e : new Error('Tidak dapat terhubung ke server. Periksa koneksi internet.');
    }
    if (i < maks) await sleep(Math.min(8000, 600 * 2 ** i) * (0.6 + Math.random() * 0.8));
  }
  throw terakhir;
}

function bacaDataURL(file) { return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(file); }); }
async function kompres(file) {
  if (!/^image\//.test(file.type)) throw new Error('File bukan gambar');
  if (file.type === 'image/svg+xml') throw new Error('Format SVG tidak didukung. Gunakan JPG atau PNG.');
  if (file.type === 'image/gif') { if (file.size > 2e6) throw new Error('Gambar maksimal 2 MB'); return { data: await bacaDataURL(file), tipe: file.type }; }
  const url = await bacaDataURL(file);
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('Gambar tidak bisa dibaca')); i.src = url; });
  const MAX = 1400, sk = Math.min(1, MAX / Math.max(img.width, img.height));
  if (file.type === 'image/png' && file.size < 350000 && sk === 1) return { data: url, tipe: 'image/png' };
  const c = document.createElement('canvas'); c.width = Math.round(img.width * sk); c.height = Math.round(img.height * sk);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  return { data: c.toDataURL('image/jpeg', 0.85), tipe: 'image/jpeg' };
}
async function unggah(file) {
  const k = await kompres(file);
  toast('Mengunggah gambar…', 'ok', 2500);
  const r = await api('uploadGambar', k, { retry: 2 });
  return r.url;
}

/* ---------- penilaian sisi klien (untuk pratinjau & analisis) ---------- */
function masalahSoal(s) {
  const m = [];
  if (!String(s.teks || '').trim() && !(s.gambar || []).length) m.push('pertanyaan kosong');
  if (s.tipe === 'pg') { if (!s.opsi.some(o => o.id === s.kunci)) m.push('kunci belum dipilih'); if (s.opsi.some(o => !o.teks.trim() && !o.gambar)) m.push('ada pilihan kosong'); }
  if (s.tipe === 'pgk') { if (!(s.kunci || []).length) m.push('kunci belum dipilih'); if (s.opsi.some(o => !o.teks.trim() && !o.gambar)) m.push('ada pilihan kosong'); }
  if (s.tipe === 'bs' && s.pernyataan.some(p => !p.teks.trim())) m.push('ada pernyataan kosong');
  if (s.tipe === 'jodoh' && (s.pasangan.filter(p => p.kiri.trim() && p.kanan.trim()).length < 1 || s.pasangan.some(p => !p.kanan.trim()))) m.push('pasangan belum lengkap');
  if (s.tipe === 'isian' && !s.jawaban.some(j => String(j).trim())) m.push('jawaban belum diisi');
  if (s.tipe === 'urut' && s.opsi.some(o => !o.teks.trim())) m.push('ada butir kosong');
  return m;
}
function soalBaru(tipe) {
  const o = () => ({ id: rid('o'), teks: '', gambar: '' });
  const s = { id: rid('s'), tipe, teks: '', stimulus: '', gambar: [], bobot: 1, pembahasan: '' };
  if (tipe === 'pg') { s.opsi = [o(), o(), o(), o(), o()]; s.kunci = ''; }
  if (tipe === 'pgk') { s.opsi = [o(), o(), o(), o(), o()]; s.kunci = []; s.penilaian = 'sebagian'; }
  if (tipe === 'bs') { s.label = ['Benar', 'Salah']; s.pernyataan = [1, 2, 3].map(() => ({ id: rid('p'), teks: '', benar: true })); s.penilaian = 'sebagian'; }
  if (tipe === 'jodoh') { s.pasangan = [1, 2, 3].map(() => ({ idKiri: rid('l'), idKanan: rid('r'), kiri: '', kanan: '' })); s.penilaian = 'sebagian'; }
  if (tipe === 'isian') s.jawaban = [''];
  if (tipe === 'urut') { s.opsi = [o(), o(), o(), o()]; s.penilaian = 'mutlak'; }
  if (tipe === 'uraian') { s.rubrik = ''; s.bobot = 4; }
  return s;
}
function normalisasiSoal(s) { // pastikan semua field ada (untuk data lama/impor)
  const b = soalBaru(s.tipe);
  const out = { ...b, ...s, gambar: s.gambar || [] };
  if (s.tipe === 'jodoh') out.pasangan = (s.pasangan || b.pasangan).map(p => ({ ...p, pengecoh: !p.kiri && !!p.kanan }));
  return out;
}
function untukSiswa(s) {
  const o = { ...s };
  if (s.tipe === 'jodoh') { o.kiri = s.pasangan.filter(p => p.kiri).map(p => ({ id: p.idKiri, teks: p.kiri })); o.kanan = s.pasangan.filter(p => p.kanan).map(p => ({ id: p.idKanan, teks: p.kanan })).sort(() => 0.5 - Math.random()); }
  if (s.tipe === 'urut') o.opsi = [...s.opsi].sort(() => 0.5 - Math.random());
  return o;
}

/* ---------- impor cepat teks ---------- */
function parseImporCepat(teks) {
  const baris = String(teks || '').replace(/\r/g, '').split('\n');
  const blok = []; let cur = null;
  for (const raw of baris) {
    const l = raw.trim();
    const mNo = l.match(/^(\d{1,3})\s*[.)]\s+(.*)$/);
    if (mNo) { cur = { teks: [mNo[2]], opsi: [], kunci: [], jawaban: null, bobot: null }; blok.push(cur); continue; }
    if (!cur) continue;
    const mOp = l.match(/^([A-Ha-h])\s*[.)]\s*(.*)$/);
    const mK = l.match(/^kunci(?:\s+jawaban)?\s*[:=]\s*(.+)$/i);
    const mJ = l.match(/^jawaban\s*[:=]\s*(.+)$/i);
    const mB = l.match(/^bobot\s*[:=]\s*([\d.,]+)/i);
    if (mK) cur.kunci = mK[1].toUpperCase().split(/[\s,;/&]+|dan/i).map(x => x.trim()).filter(x => /^[A-H]$/.test(x));
    else if (mJ) cur.jawaban = mJ[1].split('|').map(x => x.trim()).filter(Boolean);
    else if (mB) cur.bobot = Number(mB[1].replace(',', '.'));
    else if (mOp && (cur.opsi.length || cur.teks.length)) {
      let t = mOp[2], star = false;
      if (/\*\s*$/.test(t)) { star = true; t = t.replace(/\s*\*\s*$/, ''); }
      cur.opsi.push({ h: mOp[1].toUpperCase(), teks: t, star });
    } else if (l) { if (cur.opsi.length) cur.opsi[cur.opsi.length - 1].teks += '\n' + l; else cur.teks.push(l); }
  }
  return blok.map(b => {
    let s;
    if (b.opsi.length >= 2) {
      const kunciH = b.kunci.length ? b.kunci : b.opsi.filter(o => o.star).map(o => o.h);
      s = soalBaru(kunciH.length > 1 ? 'pgk' : 'pg');
      s.opsi = b.opsi.map(o => ({ id: rid('o'), teks: o.teks, gambar: '' }));
      const ids = kunciH.map(h => s.opsi[b.opsi.findIndex(o => o.h === h)]).filter(Boolean).map(o => o.id);
      s.kunci = s.tipe === 'pg' ? (ids[0] || '') : ids;
    } else if (b.jawaban) { s = soalBaru('isian'); s.jawaban = b.jawaban; }
    else s = soalBaru('uraian');
    s.teks = b.teks.join('\n').trim();
    if (b.bobot) s.bobot = b.bobot;
    return s;
  });
}

// Pengawas ujian: pilih guru seperti isian mata pelajaran (ketik lalu Enter / pilih dari daftar),
// lalu (bila kelas peserta lebih dari satu) tandai kelas yang diawasi tiap pengawas. Kosong = semua kelas.
app.component('pengawas-input', {
  props: ['modelValue', 'guru', 'kelas'], emits: ['update:modelValue'], template: '#t-pengawas-input',
  data: () => ({ baru: '', uid: ++chipUid }),
  computed: {
    pilihan() { const ada = new Set(this.modelValue.map(p => p.id)); return (this.guru || []).filter(g => g.aktif && !ada.has(g.id)).sort((a, b) => a.nama.localeCompare(b.nama)); }
  },
  methods: {
    label(g) { return g.nama + ' (' + g.username + ')'; },
    namaGuru(p) { const g = (this.guru || []).find(x => x.id === p.id); return g ? g.nama : (p.nama || 'Guru'); },
    cari(teks) {
      const t = teks.trim().toLowerCase(); if (!t) return null;
      const p = this.pilihan;
      return p.find(g => this.label(g).toLowerCase() === t) || p.find(g => g.username === t || g.nama.toLowerCase() === t)
        || (p.filter(g => g.nama.toLowerCase().includes(t) || g.username.includes(t)).length === 1 ? p.find(g => g.nama.toLowerCase().includes(t) || g.username.includes(t)) : null);
    },
    cekPilih() { const g = this.pilihan.find(x => this.label(x) === this.baru); if (g) this.tambah(); },   // dipilih dari daftar
    kd(e) { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); this.tambah(); } else if (e.key === 'Backspace' && !this.baru && this.modelValue.length) this.hapus(this.modelValue.length - 1); },
    tambah(diam) {
      const v = this.baru.replace(/,$/, ''); if (!v.trim()) { this.baru = ''; return; }
      const g = this.cari(v);
      if (!g) { if (!diam) toast('Guru “' + v.trim() + '” tidak ditemukan. Pilih dari daftar.', 'err'); return; }
      this.baru = '';
      this.$emit('update:modelValue', [...this.modelValue, { id: g.id, nama: g.nama, kelas: [] }]);
    },
    hapus(i) { const a = [...this.modelValue]; a.splice(i, 1); this.$emit('update:modelValue', a); },
    aktifKelas(p) { return p.kelas.filter(k => this.kelas.includes(k)); },
    ganti(p, kelas) { this.$emit('update:modelValue', this.modelValue.map(x => x.id === p.id ? { ...x, kelas } : x)); },
    semua(p) { this.ganti(p, []); },
    tog(p, k) { const a = this.aktifKelas(p); const b = a.includes(k) ? a.filter(x => x !== k) : [...a, k]; this.ganti(p, b.length === this.kelas.length ? [] : b); }
  }
});

app.component('teks-input', {

app.component('v-editor', {
  template: '#t-editor',
  data: () => ({ bank: null, sel: 0, kotor: false, menyimpan: false, tersimpan: 0, pratinjau: false, coba: {}, dipakai: [], impor: { buka: false, teks: '' } }),
  computed: {
    totalBobot() { return this.bank.soal.reduce((a, s) => a + (Number(s.bobot) || 0), 0); },
    mapelOpsi() { return [...new Set([...mapelPilihan(), this.bank.mapel])].filter(Boolean); },
    hasilImpor() { return parseImporCepat(this.impor.teks); },
    soalPratinjau() { return untukSiswa(this.bank.soal[this.sel]); },
    ringkasImpor() { const c = {}; this.hasilImpor.forEach(s => c[s.tipe] = (c[s.tipe] || 0) + 1); return Object.entries(c).map(([k, v]) => v + ' ' + namaTipe(k).toLowerCase()).join(', '); }
  },
  async mounted() {
    this.kunciS = e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); this.simpan(); } };
    document.addEventListener('keydown', this.kunciS);
    this.sebelumTutup = e => { if (this.kotor) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', this.sebelumTutup);
    try {
      const b = await api('getBank', { id: S.route.id });
      if (b.guruId && b.guruId !== S.user.id) { toast('Bank soal milik ' + (b.guruNama || 'guru') + ' tidak bisa diubah oleh admin.', 'err', 5000); location.hash = '#/bank'; return; }
      b.soal = b.soal.map(normalisasiSoal);
      const draf = JSON.parse(localStorage.getItem('cbt_draf_' + b.id) || 'null');
      if (draf && draf.waktu > (b.diubah || 0) && JSON.stringify(draf.bank.soal) !== JSON.stringify(b.soal)) {
        if (await tanya('Pulihkan draf?', `Ada perubahan yang belum disimpan dari ${fmtWaktu(draf.waktu)}. Pulihkan draf tersebut?`, { ok: 'Pulihkan', batal: 'Buang draf' })) { this.bank = draf.bank; this.kotor = true; }
        else localStorage.removeItem('cbt_draf_' + b.id);
      }
      if (!this.bank) this.bank = b;
      this.$watch('bank', () => { this.kotor = true; S.editorKotor = true; clearTimeout(this.tDraf); this.tDraf = setTimeout(() => localStorage.setItem('cbt_draf_' + this.bank.id, JSON.stringify({ waktu: Date.now(), bank: this.bank })), 800); }, { deep: true });
    } catch (e) { toast(e.message, 'err'); location.hash = '#/bank'; }
  },
  unmounted() { document.removeEventListener('keydown', this.kunciS); window.removeEventListener('beforeunload', this.sebelumTutup); S.editorKotor = false; },
  methods: {
    masalah: masalahSoal,
    tambah(tipe) { this.bank.soal.push(soalBaru(tipe)); this.sel = this.bank.soal.length - 1; this.pratinjau = false; },
    pindah(d) { const a = this.bank.soal, i = this.sel; if (i + d < 0 || i + d >= a.length) return; [a[i], a[i + d]] = [a[i + d], a[i]]; this.sel = i + d; },
    duplikatSoal() {
      const s = JSON.parse(JSON.stringify(this.bank.soal[this.sel])); s.id = rid('s');
      const peta = {};
      (s.opsi || []).forEach(o => { const n = rid('o'); peta[o.id] = n; o.id = n; });
      if (s.tipe === 'pg') s.kunci = peta[s.kunci] || ''; if (s.tipe === 'pgk') s.kunci = s.kunci.map(k => peta[k]).filter(Boolean);
      (s.pernyataan || []).forEach(p => p.id = rid('p')); (s.pasangan || []).forEach(p => { p.idKiri = rid('l'); p.idKanan = rid('r'); });
      this.bank.soal.splice(this.sel + 1, 0, s); this.sel++;
    },
    async hapusSoal() {
      if (!await tanya('Hapus soal nomor ' + (this.sel + 1) + '?', 'Soal ini akan dihapus dari bank setelah Anda menyimpan.', { ok: 'Hapus', bahaya: true })) return;
      this.bank.soal.splice(this.sel, 1); this.sel = Math.max(0, Math.min(this.sel, this.bank.soal.length - 1));
    },
    gantiTipe(t) {
      const lama = this.bank.soal[this.sel], b = soalBaru(t);
      b.id = lama.id; b.teks = lama.teks; b.stimulus = lama.stimulus; b.gambar = lama.gambar; b.pembahasan = lama.pembahasan; b.bobot = lama.bobot;
      if ((t === 'pg' || t === 'pgk' || t === 'urut') && lama.opsi) {
        b.opsi = lama.opsi;
        if (t === 'pg') b.kunci = lama.tipe === 'pgk' ? (lama.kunci[0] || '') : (lama.kunci || '');
        if (t === 'pgk') b.kunci = lama.tipe === 'pg' ? (lama.kunci ? [lama.kunci] : []) : (Array.isArray(lama.kunci) ? lama.kunci : []);
      }
      this.bank.soal.splice(this.sel, 1, b);
    },
    tempel(e) {
      const f = [...(e.clipboardData?.files || [])].find(x => /^image\//.test(x.type));
      if (!f || !this.bank || !this.bank.soal.length || this.pratinjau) return;
      e.preventDefault();
      const s = this.bank.soal[this.sel];
      if (s.gambar.length >= 6) return toast('Maksimal 6 gambar per soal', 'err');
      unggah(f).then(u => { s.gambar.push(u); toast('Gambar ditempel ke soal ' + (this.sel + 1)); }).catch(err => toast(err.message, 'err'));
    },
    terapkanImpor() { const n = this.hasilImpor.length; this.bank.soal.push(...this.hasilImpor); this.sel = this.bank.soal.length - n; this.impor = { buka: false, teks: '' }; toast(n + ' soal ditambahkan. Jangan lupa simpan.'); },
    async simpan() {
      if (this.menyimpan || !this.bank) return;
      if (!this.bank.judul.trim()) return toast('Judul bank soal wajib diisi', 'err');
      const kurang = this.bank.soal.map((s, i) => masalahSoal(s).length ? i + 1 : 0).filter(Boolean);
      if (kurang.length && !await tanya('Ada soal yang belum lengkap', `Soal nomor ${kurang.slice(0, 15).join(', ')}${kurang.length > 15 ? '…' : ''} belum lengkap (misalnya kunci belum dipilih). Tetap simpan?`, { ok: 'Tetap simpan' })) return;
      this.menyimpan = true;
      try {
        const kirim = JSON.parse(JSON.stringify(this.bank));
        kirim.soal.forEach(s => { if (s.pasangan) s.pasangan.forEach(p => { if (p.pengecoh) p.kiri = ''; delete p.pengecoh; }); });
        const r = await api('saveBank', { bank: kirim });
        this.dipakai = r.dipakai || [];
        this.tersimpan = Date.now();
        nextTick(() => { this.kotor = false; S.editorKotor = false; });
        localStorage.removeItem('cbt_draf_' + this.bank.id);
        toast('Bank soal tersimpan');
      } catch (e) { toast(e.message, 'err', 7000); } finally { this.menyimpan = false; }
    }
  }
});

app.component('v-jadwal', {

  },

  },

      try { const l = await api('listUjian', { untuk: 'jadwal' }); this.list = this.admin ? l : l.sort((a, b) => a.mulai - b.mulai || a.nama.localeCompare(b.nama)); }

    },

      if (u) {
        this.f = { ...u, kelas: [...u.kelas], pengawas: (u.pengawas || []).map(p => ({ id: p.id, nama: p.nama, kelas: [...(p.kelas || [])] })), mulaiStr: keInput(u.mulai), selesaiStr: keInput(u.selesai) };
        if (salin) { this.f.id = ''; this.f.nama = u.nama + ' (salinan)'; }
      } else {
        const m = new Date(sekarang() + 86400000); m.setHours(7, 30, 0, 0);
        this.f = { id: '', nama: '', bankId: '', tingkat: '', kelas: [], mulaiStr: keInput(m.getTime()), selesaiStr: keInput(m.getTime() + 2 * 3600000), durasi: 90, acakSoal: true, acakOpsi: true, tampilNilai: false, pakaiToken: true, maxPelanggaran: 3, aktif: true, keterangan: '', pengawas: [] };

const LABEL_STATUS = { belum: 'Belum mulai', mengerjakan: 'Mengerjakan', pending: 'Pending', selesai: 'Selesai' };
// Monitor HEMAT: cukup status tiap siswa (belum mulai / mengerjakan / pending / selesai). Tidak menarik progres jawaban.
// Memakai koneksi aplikasi yang sudah terbuka; perubahan status dikirim server lewat koneksi itu (tanpa request baru).
// Tidak ada penyegaran berkala & tidak menyambung ulang otomatis: bila koneksi putus, tekan "Perbarui" (1 request).
app.component('v-monitor', {
  template: '#t-monitor',
  data: () => ({ d: null, q: '', fKelas: '', fStatus: '', diperbarui: 0, langsung: false, terputus: false, LABEL_STATUS }),
  computed: {
    hit() { const h = { belum: 0, mengerjakan: 0, pending: 0, selesai: 0 }; this.d.peserta.forEach(p => { const k = p.status === 'direset' ? 'belum' : p.status; h[k] = (h[k] || 0) + 1; }); return h; },
    tampil() {
      const q = this.q.toLowerCase(), u = { pending: 0, mengerjakan: 1, belum: 2, direset: 2, selesai: 3 };
      const cocok = p => !this.fStatus || p.status === this.fStatus || (this.fStatus === 'belum' && p.status === 'direset');
      return this.d.peserta.filter(p => (!q || p.nama.toLowerCase().includes(q) || p.nis.includes(q)) && (!this.fKelas || p.kelas === this.fKelas) && cocok(p))
        .sort((a, b) => (u[a.status] - u[b.status]) || a.kelas.localeCompare(b.kelas) || a.nama.localeCompare(b.nama));
    }
  },
  mounted() {
    if (!S.route.id) return;
    this.mati = false;
    this.dengar = m => this.pesan(m);
    Sok.pendengar.add(this.dengar);
    this.sambung();
  },
  unmounted() { this.putus(); },
  methods: {
    async muat(diam) { try { this.d = await api('monitorUjian', { ujianId: S.route.id }, { retry: diam ? 1 : 3 }); this.diperbarui = Date.now(); } catch (e) { if (!diam) toast(e.message, 'err'); } },
    sambung() {
      if (!WS_URL || this.mati) { if (!this.d) this.muat(); return; }
      Sok.buka().then(() => { if (!this.mati) Sok.kirim({ t: 'pantau', tok: S.token, m: S.route.id }); })
        .catch(() => { this.terputus = true; if (!this.d) this.muat(true); });
    },
    sambungLagi() { this.terputus = false; if (WS_URL && Sok.tersedia()) this.sambung(); else this.muat(); },
    pesan(m) {
      if (this.mati) return;
      if (m.t === 'snap') { this.d = m.data; this.langsung = true; this.terputus = false; this.diperbarui = Date.now(); }
      else if (m.t === 'diff' && this.d) {
        const idx = new Map(this.d.peserta.map((p, i) => [p.nis, i]));
        m.rows.forEach(r => { const i = idx.get(r.nis); if (i === undefined) this.d.peserta.push(r); else this.d.peserta.splice(i, 1, r); });
        this.diperbarui = Date.now();
      } else if (m.t === 'tik') {
        // waktu berjalan: siswa yang batas waktunya lewat tampil Pending tanpa bertanya ke server
        if (this.d) { const t = sekarang(); this.d.peserta.forEach(p => { if (p.status === 'mengerjakan' && p.deadline && p.deadline + 120000 < t) p.status = 'pending'; }); }
      }
      else if (m.t === 'err' && m.k === 'pantau') { this.mati = true; this.langsung = false; if (m.code === 'AUTH') keluar(true); else toast(m.msg, 'err'); }
      else if (m.t === '_tutup') { this.langsung = false; this.terputus = true; }
    },
    putus() {
      this.mati = true;
      Sok.pendengar.delete(this.dengar);
      if (this.langsung) Sok.kirim({ t: 'lepas' });
      this.langsung = false;
    },
    aksi(p) {
      const a = [], aktif = p.status === 'mengerjakan' || p.status === 'pending';
      if (p.adaPerangkat && aktif) a.push({ t: 'Reset login (pindah perangkat)', f: () => this.jalankan('resetLogin', p, 'Reset login ' + p.nama + '?', 'Siswa bisa melanjutkan di perangkat lain. Jawaban yang belum terkirim dari perangkat lama tidak ikut pindah.') });
      if (aktif) a.push({ t: p.status === 'pending' ? 'Kumpulkan sekarang' : 'Hentikan dan kumpulkan', f: () => this.jalankan('paksaSelesai', p, 'Kumpulkan jawaban ' + p.nama + '?', 'Ujian siswa dihentikan sekarang dan dinilai dari cadangan jawaban terakhir yang sempat diterima server. Jawaban di perangkat siswa yang belum terkirim tidak ikut dinilai.'), danger: true });
      if (S.user.role === 'admin' && (p.status === 'selesai' || aktif)) a.push({ t: 'Ulang ujian dari awal', f: () => this.jalankan('resetPeserta', p, 'Ulang ujian ' + p.nama + '?', 'Semua jawaban dan nilai siswa ini dihapus. Siswa bisa mengerjakan lagi dari awal.'), danger: true });
      return a;
    },
    async jalankan(aksi, p, judul, teks) {
      if (!await tanya(judul, teks, { ok: 'Ya, lanjutkan', bahaya: aksi !== 'resetLogin' })) return;
      try { await coba(() => api(aksi, { ujianId: S.route.id, nis: p.nis }), 'Berhasil'); if (!this.langsung) this.muat(); } catch (e) {}
    },
    async gantiToken() {
      if (!await tanya('Ganti token?', 'Siswa yang belum mulai harus memakai token baru.', { ok: 'Ganti token' })) return;
      try { this.d.ujian.token = await api('gantiTokenUjian', { id: S.route.id }); toast('Token baru: ' + this.d.ujian.token); } catch (e) { toast(e.message, 'err'); }
    }
  }
});

      let iN = h.findIndex(x => ['nis', 'nisn', 'noinduk', 'nomorinduk'].includes(x)), iNm = h.findIndex(x => x.startsWith('nama')), iK = h.findIndex(x => ['kelas', 'rombel', 'rombonganbelajar'].includes(x)), iP = h.findIndex(x => ['password', 'katasandi', 'sandi', 'pass'].includes(x));
