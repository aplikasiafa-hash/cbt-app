<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4A525C">
<title>Ujian CBT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css">
<style>
:root{
  --kertas:#fff; --latar:#EDEFF2; --seragam:#4A525C; --seragam-gelap:#3A4049;
  --teks:#252A30; --teks-2:#5F6772; --teks-3:#8A919B; --garis:#D7DBE0; --garis-2:#E8EBEE;
  --tinta:#D23F68; --tinta-muda:#FBEAF0; --grafit:#26292E;
  --stabilo:#F7D54A; --stabilo-muda:#FFF7D6;
  --hijau:#2E7D57; --hijau-muda:#E2F2E9; --merah:#B3261E; --merah-muda:#FBE8E7; --biru:#2F5E9E; --biru-muda:#E7EEF8;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-soal:'Literata',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);font-size:15px;line-height:1.5;color:var(--teks);background:var(--latar);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
[v-cloak]{display:none}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--teks-2)} .small{font-size:13px} .tnum{font-variant-numeric:tabular-nums}
.mark{display:inline-flex;gap:4px;align-items:center}
.mark i{width:11px;height:11px;border-radius:50%;border:1.6px solid currentColor;display:block}
.mark i.on{background:currentColor}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:9px;border:1px solid var(--garis);background:var(--kertas);cursor:pointer;font-weight:700;white-space:nowrap;color:var(--teks);text-decoration:none}
.btn:hover{border-color:#B9BFC7}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--grafit);border-color:var(--grafit);color:#fff}
.btn-primary:hover{background:#000}
.btn-tinta{background:var(--tinta);border-color:var(--tinta);color:#fff}
.btn-ghost{border-color:transparent;background:transparent}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field>span{font-weight:700;font-size:14px}
.field input{height:48px;padding:0 14px;border:1.5px solid var(--garis);border-radius:9px;background:#fff;font-size:16px}
.field input:focus{border-color:var(--grafit);outline:none}
.err{background:var(--merah-muda);color:var(--merah);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:14px}

/* login — kepala lembar jawaban */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--seragam)}
.lembar{width:100%;max-width:420px;background:#fff;border-radius:12px;overflow:hidden}
.lembar-head{border-bottom:2px solid var(--tinta);padding:22px 26px 16px;color:var(--tinta);display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.lembar-head b{display:block;font-size:20px;color:var(--teks);margin-top:10px}
.lembar-head span{font-size:13px;color:var(--teks-2)}
.lembar-body{padding:22px 26px 24px}
.lembar-body p.muted{margin-bottom:18px;font-size:14px}

/* kerangka halaman daftar */
.bar-atas{background:var(--seragam);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.bar-atas .who{margin-left:auto;text-align:right;font-size:13px;line-height:1.35}
.bar-atas .who b{display:block;font-size:14px}
.bar-atas .btn{min-height:34px;background:transparent;color:#fff;border-color:rgba(255,255,255,.3);padding:0 12px;font-size:13px}
.wadah{max-width:760px;margin:0 auto;padding:24px 16px 60px}
.wadah h1{font-size:22px;margin-bottom:4px}
.kartu{background:#fff;border:1px solid var(--garis);border-radius:12px;padding:18px 20px;margin-top:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.kartu .info{flex:1;min-width:220px}
.kartu .mapel{font-size:13px;color:var(--teks-2);font-weight:600}
.kartu h3{font-size:17px;margin:2px 0 6px}
.kartu .waktu{font-size:13.5px;color:var(--teks-2)}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:12.5px;font-weight:700}
.chip-abu{background:#EEF0F2;color:var(--teks-2)}
.chip-hijau{background:var(--hijau-muda);color:var(--hijau)}
.chip-kuning{background:var(--stabilo-muda);color:#7A5B00}
.kosong{text-align:center;padding:50px 20px;color:var(--teks-2)}
.kosong b{display:block;color:var(--teks);font-size:16px;margin-bottom:6px}

/* konfirmasi */
.tbl-data{width:100%;border-collapse:collapse;margin:14px 0 18px}
.tbl-data td{padding:9px 0;border-bottom:1px dashed var(--garis);vertical-align:top}
.tbl-data td:first-child{color:var(--teks-2);width:40%;padding-right:12px}
.tbl-data td:last-child{font-weight:700}
.token-in{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:800;font-size:22px!important;font-variant-numeric:tabular-nums}
.aturan{background:var(--stabilo-muda);border:1px solid #EFD98A;border-radius:9px;padding:12px 16px;font-size:14px;margin-bottom:18px}
.aturan ul{margin:6px 0 0;padding-left:18px}
.aturan li{margin:3px 0}

/* layar ujian */
.uj{min-height:100vh;display:flex;flex-direction:column}
.uj-top{background:var(--seragam);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 14px;position:sticky;top:0;z-index:30;min-height:58px}
.uj-top .judul{min-width:0;flex:1}
.uj-top .judul b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uj-top .judul span{font-size:12px;color:#CDD2D8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.timer{background:#fff;color:var(--teks);border-radius:8px;padding:4px 12px;text-align:center;min-width:104px}
.timer small{display:block;font-size:10.5px;color:var(--teks-2);font-weight:600;line-height:1.2}
.timer b{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1.2}
.timer.kuning{background:var(--stabilo)}
.timer.merah{background:var(--tinta);color:#fff}.timer.merah small{color:#fff}
.btn-daftar{display:none;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;min-height:40px;padding:0 12px;font-weight:700;cursor:pointer}
.uj-main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;max-width:1240px;width:100%;margin:0 auto;padding:18px 18px 110px}
.kertas{background:#fff;border:1px solid var(--garis);border-radius:12px;position:relative;min-height:60vh;user-select:none;-webkit-user-select:none}
.kertas:before{content:"";position:absolute;left:58px;top:0;bottom:0;width:1.5px;background:var(--tinta);opacity:.35}
.kertas-head{display:flex;align-items:center;gap:12px;padding:14px 18px 12px 18px;border-bottom:1px solid var(--garis-2)}
.no-soal{width:44px;height:44px;border-radius:50%;background:var(--grafit);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.kertas-head .ket{flex:1;min-width:0}
.kertas-head .ket b{display:block;font-size:14px}
.kertas-head .ket span{font-size:13px;color:var(--teks-2)}
.fs{display:inline-flex;border:1px solid var(--garis);border-radius:8px;overflow:hidden}
.fs button{border:0;background:#fff;width:38px;height:34px;cursor:pointer;font-weight:700;color:var(--teks-2)}
.fs button+button{border-left:1px solid var(--garis)}
.fs button.on{background:var(--grafit);color:#fff}
.kertas-body{padding:18px 22px 26px 78px}
.soal{font-family:var(--font-soal);line-height:1.75;font-size:var(--fz,17px)}
.soal .stim{background:#F7F8F9;border-left:3px solid var(--garis);padding:12px 16px;margin-bottom:16px;border-radius:0 8px 8px 0;font-size:.94em;max-height:46vh;overflow:auto;user-select:none}
.soal .teks{margin-bottom:14px}
.soal .gbr{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 16px}
.soal .gbr img{max-width:100%;max-height:360px;border-radius:6px;border:1px solid var(--garis-2);cursor:zoom-in}
.petunjuk{font-family:var(--font);font-size:13.5px;font-weight:700;color:var(--teks-2);margin-bottom:10px}
.opsi{display:flex;gap:14px;align-items:flex-start;padding:11px 14px;border:1.5px solid var(--garis-2);border-radius:11px;margin-bottom:10px;cursor:pointer;background:#fff;width:100%;text-align:left;font-family:inherit;font-size:inherit;line-height:inherit}
.opsi:hover{border-color:var(--garis)}
.opsi.pilih{border-color:var(--grafit);background:#F5F6F7}
.opsi .t{flex:1;min-width:0;padding-top:4px}
.opsi img{max-width:100%;max-height:200px;display:block;margin-top:6px;border-radius:5px}
.bub{width:36px;height:36px;border-radius:50%;border:1.8px solid var(--tinta);color:var(--tinta);display:inline-grid;place-items:center;font-weight:700;font-size:14px;background:#fff;flex:none;font-family:var(--font);font-variant-numeric:tabular-nums;padding:0;cursor:pointer}
.bub.isi{background:var(--grafit);border-color:var(--grafit);color:#fff}
.bub.ragu{background:var(--stabilo);border-color:#C9A300;color:var(--teks)}
.bub.aktif{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--tinta)}
.bub.kotak{border-radius:8px}
.tbl-bs{width:100%;border-collapse:collapse;font-size:.95em}
.tbl-bs td,.tbl-bs th{border:1px solid var(--garis);padding:10px 12px;vertical-align:middle}
.tbl-bs th{font-family:var(--font);font-size:13px;background:#FAFBFC}
.tbl-bs td.c{text-align:center;width:92px;padding:6px}
.tbl-bs .rb{width:40px;height:40px;border-radius:50%;border:1.8px solid var(--tinta);background:#fff;cursor:pointer}
.tbl-bs .rb.on{background:var(--grafit);border-color:var(--grafit)}
.kanan-box{border:1.5px dashed var(--garis);border-radius:10px;padding:10px 14px;margin-bottom:10px;background:#FAFBFC}
.kb-judul{font-family:var(--font);font-size:12.5px;font-weight:700;color:var(--teks-2);margin-bottom:4px}
.kb-item{display:flex;gap:10px;align-items:baseline;padding:3px 0}
.kb-h{font-family:var(--font);font-weight:800;color:var(--tinta);min-width:18px}
.jodoh-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--garis)}
.jodoh-row select{font-family:var(--font);font-size:15px;width:100%;height:46px;border:1.5px solid var(--garis);border-radius:9px;padding:0 10px;background:#fff}
.jodoh-row select.ada{border-color:var(--grafit);background:#F5F6F7}
.isian{font-family:var(--font);width:100%;height:50px;border:1.5px solid var(--garis);border-radius:9px;padding:0 14px;font-size:17px;user-select:text;-webkit-user-select:text}
.uraian{font-family:var(--font-soal);width:100%;min-height:200px;border:1.5px solid var(--garis);border-radius:9px;padding:12px 14px;font-size:16px;line-height:1.6;resize:vertical;user-select:text;-webkit-user-select:text}
.isian:focus,.uraian:focus{border-color:var(--grafit);outline:none}
.urut-row{display:flex;gap:10px;align-items:center;border:1.5px solid var(--garis-2);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:#fff}
.urut-row .n{font-family:var(--font);font-weight:800;color:var(--tinta);width:24px;text-align:center}
.urut-row .t{flex:1}
.urut-row button{width:42px;height:40px;border:1px solid var(--garis);border-radius:8px;background:#fff;cursor:pointer;font-size:17px}
.urut-row button:disabled{opacity:.35}
.sisa-char{font-family:var(--font);font-size:12px;color:var(--teks-3);text-align:right;margin-top:4px}

.uj-foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--garis);z-index:25;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.uj-foot .isi{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:10px}
.ragu-btn{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border-radius:9px;border:1.5px solid #E2C55A;background:#fff;cursor:pointer;font-weight:700;margin:0 auto}
.ragu-btn .kotak{width:20px;height:20px;border-radius:5px;border:2px solid #C9A300;display:grid;place-items:center;font-size:13px;line-height:1}
.ragu-btn.on{background:var(--stabilo);border-color:#C9A300}
.ragu-btn.on .kotak{background:var(--grafit);border-color:var(--grafit);color:#fff}

.ljk{background:#fff;border:1.5px solid var(--tinta);border-radius:12px;padding:14px 14px 16px;position:sticky;top:76px;align-self:start}
.ljk h3{font-size:14px;color:var(--tinta);display:flex;justify-content:space-between;align-items:baseline}
.ljk h3 span{color:var(--teks-2);font-weight:600;font-size:12.5px}
.ljk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 6px;justify-items:center;margin:14px 0;max-height:52vh;overflow:auto;padding:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--teks-2);margin-bottom:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--tinta);vertical-align:-2px;margin-right:5px}
.legend i.isi{background:var(--grafit);border-color:var(--grafit)}
.legend i.ragu{background:var(--stabilo);border-color:#C9A300}
.sync{font-size:12px;color:var(--teks-2);margin-top:10px;display:flex;gap:6px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:#33A06F;display:inline-block}
.sync.off i{background:var(--merah)} .sync.proses i{background:var(--stabilo)}
.scrim{display:none}

.modal-bg{position:fixed;inset:0;background:rgba(30,34,39,.6);display:grid;place-items:center;padding:18px;z-index:60;overflow:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:460px;padding:22px 22px 18px}
.modal h2{font-size:19px;margin-bottom:8px}
.modal p{margin-bottom:12px}
.modal .aksi{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.daftar-no{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.daftar-no button{min-width:36px;height:32px;border-radius:7px;border:1px solid var(--garis);background:#fff;cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin-top:6px}
.check input{width:20px;height:20px;accent-color:var(--grafit);margin-top:1px}
.peringatan h2{color:var(--merah)}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:70;padding:12px}
.zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}
.fs-banner{background:var(--stabilo-muda);border-bottom:1px solid #EFD98A;padding:8px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:center}

.selesai-box{max-width:460px;margin:8vh auto;background:#fff;border-radius:14px;padding:30px 28px;text-align:center;border:1px solid var(--garis)}
.selesai-box .centang{width:64px;height:64px;border-radius:50%;background:var(--grafit);margin:0 auto 16px;display:grid;place-items:center}
.selesai-box h1{font-size:22px;margin-bottom:6px}
.nilai{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;margin:16px 0 4px;color:var(--teks)}
.toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90;width:max-content;max-width:92vw}
.toast{background:var(--grafit);color:#fff;padding:11px 16px;border-radius:9px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--merah)}

@media (max-width:900px){
  .uj-main{grid-template-columns:1fr;padding:12px 10px 110px}
  .btn-daftar{display:inline-flex;align-items:center}
  .ljk{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:50;border-radius:16px 16px 0 0;border-width:2px 0 0;transform:translateY(105%);transition:transform .2s;max-height:80vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .ljk.buka{transform:none}
  .scrim.buka{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .kertas:before{left:16px}
  .kertas-body{padding:16px 14px 22px 30px}
  .uj-top .judul span{display:none}
  .uj-top>.mark{display:none}
  .timer{min-width:88px;padding:3px 8px}
  .timer b{font-size:18px}
  .uj-foot .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){.ljk{transition:none}}
</style>
</head>
<body>
<div id="app" v-cloak></div>

<script type="text/x-template" id="t-root">
  <!-- LOGIN -->
  <div class="login" v-if="layar==='login'">
    <div class="lembar">
      <div class="lembar-head">
        <div><span class="mark"><i></i><i class="on"></i><i></i><i></i></span><b>{{ sekolah.namaSekolah || 'Ujian CBT' }}</b><span>Masuk untuk mengerjakan ujian</span></div>
      </div>
      <form class="lembar-body" @submit.prevent="masuk">
        <p class="muted">Gunakan NIS dan kata sandi dari kartu login. Kata sandi awal sama dengan NIS.</p>
        <div class="err" v-if="err">{{ err }}</div>
        <label class="field"><span>NIS</span><input v-model.trim="f.nis" inputmode="text" autocomplete="username" autocapitalize="none" required></label>
        <label class="field"><span>Kata sandi</span><input type="password" v-model="f.pw" autocomplete="current-password" required></label>
        <button class="btn btn-primary btn-block" :disabled="sibuk">{{ sibuk ? 'Memeriksa…' : 'Masuk' }}</button>
        <p class="small muted" style="margin-top:14px" v-if="!apiSiap">Alamat server belum diatur (API_URL).</p>
      </form>
    </div>
  </div>

  <!-- DAFTAR UJIAN -->
  <template v-else-if="layar==='daftar'">
    <div class="bar-atas">
      <span class="mark"><i></i><i class="on"></i><i></i></span>
      <b>{{ sekolah.namaSekolah }}</b>
      <div class="who"><b>{{ user.nama }}</b>{{ user.nis }} · {{ user.kelas }}</div>
      <button class="btn" @click="keluar">Keluar</button>
    </div>
    <div class="wadah">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap">
        <div><h1>Ujian Anda</h1><p class="muted">Ujian untuk kelas {{ user.kelas }}. Daftar diperbarui otomatis.</p></div>
        <button class="btn btn-sm" @click="muatDaftar()">Segarkan</button>
      </div>
      <div class="err" v-if="err" style="margin-top:14px">{{ err }}</div>
      <div v-if="!daftar" class="kosong">Memuat…</div>
      <div v-else-if="!daftar.length" class="kosong"><b>Tidak ada ujian hari ini</b>Belum ada ujian yang dijadwalkan untuk kelas Anda pada hari ini.</div>
      <div class="kartu" v-for="u in daftar" :key="u.id">
        <div class="info">
          <div class="mapel">{{ u.mapel }}</div>
          <h3>{{ u.nama }}</h3>
          <div class="waktu">{{ fmtHari(u.mulai) }}, {{ fmtJam(u.mulai) }}–{{ fmtJam(u.selesai) }} · {{ u.durasi }} menit · {{ u.jumlahSoal }} soal</div>
        </div>
        <template v-if="u.status==='selesai'"><span class="chip chip-hijau">Selesai<template v-if="u.nilai!==undefined"> · nilai {{ u.nilai }}<template v-if="u.perluKoreksi">*</template></template></span></template>
        <button v-else-if="u.status==='mengerjakan'" class="btn btn-tinta" @click="pilih(u)">Lanjutkan</button>
        <template v-else-if="u.jadwal==='berlangsung'"><button class="btn btn-primary" @click="pilih(u)">Mulai</button></template>
        <span v-else-if="u.jadwal==='akan'" class="chip chip-abu">Dibuka {{ hitungMundur(u.mulai) }}</span>
        <span v-else class="chip chip-abu">Ditutup</span>

const API_URL = window.CBT_API_URL || '/api';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      return new Promise((ok, gagal) => {
        const id = Math.random().toString(36).slice(2);
        const habis = setTimeout(() => this.tungguHasil && this.tungguHasil.gagal({ code: 'NET', msg: 'Tidak ada balasan' }), 15000);
        this.tungguHasil = {
          id,
          ok: d => { clearTimeout(habis); this.tungguHasil = null; ok(d); },
          gagal: m => { clearTimeout(habis); this.tungguHasil = null; gagal(Object.assign(new Error(m.msg || 'Gagal'), { code: m.code || 'NET' })); }
        };
        if (!Sok.kirim({ t: 'selesai', id, j: this.jw, p: this.pelanggaran, a: alasan ? alasan.toLowerCase() : '', mulai: this.uj.mulai })) this.tungguHasil.gagal({ code: 'NET', msg: 'Koneksi terputus' });
      });
    },
    akhiriServer(r) { this.akhiri({ ...r, nama: this.uj ? this.uj.ujian.nama : '', alasan: /otomatis|waktu/.test(r.catatan || '') ? 'waktu habis' : (r.catatan ? 'dihentikan pengawas' : '') }); },
    direset() { this.putus(); this.lepasPenjaga(); this.hapusPaketIni(); try { localStorage.removeItem(this.kunciLokal); } catch (e) {} this.uj = null; this.toast('Ujian Anda direset oleh pengawas. Silakan mulai lagi.', 'err', 7000); this.keDaftar(); },
    lepasPenjaga() {
      clearInterval(this.tUjian);
      if (!this.h) return;
      document.removeEventListener('visibilitychange', this.h.vis); window.removeEventListener('blur', this.h.blur);
      document.removeEventListener('fullscreenchange', this.h.fsc); window.removeEventListener('pagehide', this.h.unload);
      window.removeEventListener('beforeunload', this.h.before); document.removeEventListener('keydown', this.h.key);
      this.h = null;
    },
    hitungSisa() { if (this.uj) this.sisaDetik = Math.floor((this.uj.deadline - now()) / 1000); },
    setFz(z) { this.fz = z; localStorage.setItem('cbt_fz', z); },

    // ---- jawaban ----
    terjawab(s) {
      const v = this.jw.j[s.id];
      if (v === undefined || v === null || v === '') return false;
      if (s.tipe === 'pgk' || s.tipe === 'urut') return Array.isArray(v) && v.length > 0;
      if (s.tipe === 'bs') return s.pernyataan.every(p => typeof v[p.id] === 'boolean');
      if (s.tipe === 'jodoh') return s.kiri.every(k => v[k.id]);
      return String(v).trim() !== '';
    },
    ragu(id) { return this.jw.r.includes(id); },
    dipilih(id) { const v = this.jawabSaat; return this.soal.tipe === 'pg' ? v === id : (Array.isArray(v) && v.includes(id)); },
    setJawab(v) { this.jw.j[this.soal.id] = v; this.tandaiUbah(); },
    pilihOpsi(id) {
      if (this.soal.tipe === 'pg') return this.setJawab(this.jawabSaat === id ? '' : id);
      const a = Array.isArray(this.jawabSaat) ? [...this.jawabSaat] : []; const i = a.indexOf(id);
      i >= 0 ? a.splice(i, 1) : a.push(id); this.setJawab(a);
    },
    setObj(k, v) { this.setJawab({ ...this.objVal, [k]: v }); },
    opsiById(id) { return this.soal.opsi.find(o => o.id === id) || { teks: '' }; },
    geser(i, d) { const a = [...this.urutan]; [a[i], a[i + d]] = [a[i + d], a[i]]; this.setJawab(a); },
    toggleRagu() { const i = this.jw.r.indexOf(this.soal.id); i >= 0 ? this.jw.r.splice(i, 1) : this.jw.r.push(this.soal.id); this.tandaiUbah(); },
    ke(i) { if (i < 0 || i >= this.uj.soal.length) return; this.idx = i; this.ljkBuka = false; window.scrollTo({ top: 0 }); this.simpanLokal(); },
    tandaiUbah() { this.kotor = true; this.versiLokal++; this.simpanLokal(); },
    simpanLokal() { try { localStorage.setItem(this.kunciLokal, JSON.stringify({ jw: this.jw, pelanggaran: this.pelanggaran, idx: this.idx, t: Date.now() })); } catch (e) {} },
    dataSync() { return { ujianId: this.uj.ujian.id, jawaban: this.jw, pelanggaran: this.pelanggaran, perangkat: perangkatId(), mulai: this.uj.mulai }; },
    async syncServer(diam) {
      if (this.syncJalan || !this.uj) return;
      this.syncJalan = true; const versi = this.versiLokal;
      if (!diam) this.sync = 'proses';
      try {
        const r = await api('simpanJawaban', this.dataSync(), { retry: 1 });
        if (this.versiLokal === versi) this.kotor = false;
        this.sync = 'ok'; this.terakhirSync = now();
        if (r.status === 'selesai') this.akhiriServer(r);
        else if (r.status === 'direset' || r.status === 'belum') this.direset();
        else if (r.deadline) this.uj.deadline = r.deadline;
      } catch (e) {
        if (e.code === 'PERANGKAT') { this.putus(); this.lepasPenjaga(); this.hapusPaketIni(); this.toast(e.message, 'err', 8000); this.keDaftar(); }
        else this.sync = 'lokal';
      } finally { this.syncJalan = false; }
    },
    bukaSelesai() { this.ljkBuka = false; this.yakin = false; this.dlg = 'selesai'; },
    async kirim(alasan) {
      if (this.mengirim) return;
      this.mengirim = true; this.alasanKirim = alasan; this.gagalKirim = false; this.dlg = 'kirim'; this.terakhirCoba = this.tik;
      if (alasan === 'Waktu habis') await sleep(Math.random() * 8000); // sebar beban saat semua siswa habis waktu bersamaan
      try {
        let r = null;
        if (this.wsBuka && Sok.terbuka()) {
          try { r = await this.selesaiWs(alasan); }
          catch (e) { if (e.code && e.code !== 'NET' && e.code !== 'BUSY') throw e; r = null; }
        }
        // koneksi sempat putus → buka 1 koneksi baru khusus untuk mengirim jawaban akhir
        if (!r) r = await api('selesaiUjian', { ...this.dataSync(), alasan: alasan ? alasan.toLowerCase() : '' }, { retry: 3, maksJeda: 15000 });
        this.akhiri({ ...r, nama: this.uj.ujian.nama, alasan: alasan ? alasan.toLowerCase() : '' });
      } catch (e) {
        if (e.code === 'PERANGKAT') { this.putus(); this.lepasPenjaga(); this.hapusPaketIni(); this.toast(e.message, 'err', 8000); this.keDaftar(); }
        else if (e.code === 'DIRESET') this.direset();
        else if (e.code === 'AUTH') {   // sesi login kedaluwarsa: masuk lagi, jawaban tetap di perangkat lalu dikirim
          this.lepasPenjaga(); this.uj = null; this.dlg = ''; this.bersihSesi(); this.layar = 'login';
          this.err = 'Sesi berakhir. Masuk lagi untuk mengirim jawaban yang tersimpan di perangkat ini.';
        }
        else { this.gagalKirim = true; this.terakhirCoba = this.tik; }
      } finally { this.mengirim = false; }
    },
    akhiri(hasil) {
      if (this.layar !== 'ujian' && !this.uj) return;
      this.putus();
      this.lepasPenjaga();
      this.hapusPaketIni();
      try { localStorage.removeItem(this.kunciLokal); } catch (e) {}
      if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
      this.hasil = { ...hasil, uid: this.uj ? this.uj.ujian.id : '' }; this.dlg = ''; this.uj = null; this.layar = 'selesai';
    }
  }
});
app.directive('math', { mounted: el => renderMath(el), updated: el => renderMath(el) });
app.mount('#app');
</script>
